<style>
html{color-scheme:light dark}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}

/* Layout: an editorial reading room. A summary table up front (hairline rules, small-caps ochre labels),
   and each paper opens onto a sand "desk" with the PDF page on the left and a margin column on the right. */
:root{
  --paper:#ffffff;
  --desk:#f4f2ee;
  --ink:#16191d;
  --ink-2:#565c66;
  --ink-3:#8a9099;
  --rule:#d9dbdf;
  --rule-soft:#eceef0;
  --accent:#e64626;
  --accent-ink:#b8361c;
  --accent-wash:#fdebe6;
  --navy:#1a345e;
  --navy-ink:#ffffff;
  --sticky:#fff1c9;
  --sticky-edge:#e8c661;
  --pen:#1a345e;
  --hl:rgba(255,205,40,.42);
  --good:#2f6b4f;
  --shadow:0 1px 2px rgba(22,25,29,.06),0 10px 28px -14px rgba(26,52,94,.35);
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",Tahoma,"Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f151d;--desk:#151d28;--ink:#e8eaed;--ink-2:#a9b0ba;--ink-3:#77808c;--rule:#2b3441;--rule-soft:#1f2833;
  --accent:#f0603f;--accent-ink:#f5866a;--accent-wash:#3a1d16;--navy:#2c4f86;--navy-ink:#ffffff;
  --sticky:#4a3d17;--sticky-edge:#b8962f;--pen:#1a345e;--hl:rgba(255,205,40,.42);--good:#6fbf98;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f151d;--desk:#151d28;--ink:#e8eaed;--ink-2:#a9b0ba;--ink-3:#77808c;--rule:#2b3441;--rule-soft:#1f2833;
  --accent:#f0603f;--accent-ink:#f5866a;--accent-wash:#3a1d16;--navy:#2c4f86;--navy-ink:#ffffff;
  --sticky:#4a3d17;--sticky-edge:#b8962f;--pen:#1a345e;--hl:rgba(255,205,40,.42);--good:#6fbf98;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 10.5px/1.2 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink)}
.muted{color:var(--ink-2)}
.serif{font-family:var(--f-display)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:8px 14px;font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--rule-soft)}
.btn.danger{color:var(--accent-ink);border-color:var(--accent-wash)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.savestate{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.savestate::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.savestate.saving::before{background:var(--accent)}
.savestate.off::before{background:var(--ink-3)}

/* ---------- Library ---------- */
.lib-head{padding-block:44px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.lib-head h1{font:500 clamp(34px,5vw,52px)/1.02 var(--f-display);letter-spacing:-.015em;margin:10px 0 12px;text-wrap:balance}
.lib-head p{margin:0;max-width:62ch;color:var(--ink-2)}
.stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.stat .v{font:500 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.lib-actions{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.lib-actions .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:12px;border-top:1px solid var(--ink);margin-top:6px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:6px;padding:6px 10px;min-width:0;flex:0 1 280px}
.search input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:13.5px}
.search svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.toolbar label{font-size:12px;color:var(--ink-3)}
.toolbar select{border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:6px 8px;font-size:13px}
.legend{margin-left:auto;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.legend .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.tablewrap{overflow-x:auto;padding-bottom:60px}
table.lit{border-collapse:separate;border-spacing:0;width:100%;min-width:1240px;font-size:13.5px}
table.lit th{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--paper);text-align:left;font:600 10px/1.25 var(--f-body);letter-spacing:.13em;text-transform:uppercase;color:var(--accent-ink);padding:12px 8px 10px;border-bottom:1px solid var(--ink);vertical-align:bottom}
table.lit td{border-bottom:1px solid var(--rule-soft);padding:1px 2px;vertical-align:middle}
tr.grp td{padding:22px 8px 6px;border-bottom:1px solid var(--rule)}
.grp-in{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.plabel{font:500 20px/1.2 var(--f-display);text-decoration:none;letter-spacing:-.005em}
.plabel:hover{color:var(--accent-ink)}
.grp-in .meta{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grp-in .spacer{flex:1}
.chip{font:600 10px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--rule);border-radius:999px;padding:5px 8px;background:transparent;color:var(--ink-2)}
.chip[data-v="Reading"]{border-color:var(--navy);color:var(--navy)}
:root[data-theme="dark"] .chip[data-v="Reading"]{color:#9fb7e3;border-color:#4b6ea6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[data-v="Reading"]{color:#9fb7e3;border-color:#4b6ea6}}
.chip[data-v="Extracted"]{border-color:var(--good);color:var(--good)}
.linkbtn{border:0;background:none;padding:2px 0;font-size:12.5px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.linkbtn:hover{color:var(--accent-ink);text-decoration-color:currentColor}
.cellwrap{display:flex;align-items:center;gap:0}
.cell{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:8px 6px;border-radius:4px;outline:0;font-variant-numeric:tabular-nums}
.cell::placeholder{color:var(--ink-3);opacity:.6}
select.cell{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:4px}
.cell:hover{background:var(--rule-soft)}
.cell:focus{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cell[disabled]{cursor:default}
.cell[disabled]:hover{background:transparent}
.src{flex:none;width:20px;height:20px;border:0;background:none;padding:0;display:grid;place-items:center;color:var(--ink-3);opacity:0;border-radius:50%}
tr.r:hover .src,tr.r:focus-within .src{opacity:.7}
.src:hover{opacity:1!important;color:var(--accent)}
.src.has{opacity:1;color:var(--accent)}
.src svg{width:13px;height:13px}
.src[disabled]{display:none}
.rowdel{border:0;background:none;color:var(--ink-3);opacity:0;padding:4px 6px;border-radius:4px;font-size:12px}
tr.r:hover .rowdel,tr.r:focus-within .rowdel{opacity:1}
.rowdel:hover{color:var(--accent-ink);background:var(--accent-wash)}
.rowdel.arm{opacity:1;color:#fff;background:var(--accent)}
tr.flash td{background:var(--accent-wash)}
.empty{margin:30px 0 80px;border:1px solid var(--rule);border-radius:10px;padding:36px clamp(20px,4vw,48px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:36px}
.empty h2{font:500 30px/1.15 var(--f-display);margin:10px 0 14px}
.empty ol{margin:0;padding:0;list-style:none;display:grid;gap:16px;counter-reset:s}
.empty li{display:grid;grid-template-columns:28px 1fr;gap:10px;color:var(--ink-2)}
.empty li::before{counter-increment:s;content:counter(s);font:500 15px/1.4 var(--f-display);color:var(--accent-ink)}
.empty li b{color:var(--ink);font-weight:500}
.banner{background:var(--navy);color:var(--navy-ink);font-size:13.5px}
.banner .wrap{display:flex;gap:14px;align-items:center;padding-block:10px;flex-wrap:wrap}
.banner .btn{background:transparent;color:var(--navy-ink);border-color:rgba(255,255,255,.4)}

/* ---------- Paper view ---------- */
.pv-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.pv-top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);text-decoration:none;padding:6px 8px 6px 4px;border-radius:6px}
.back:hover{background:var(--rule-soft);color:var(--ink)}
.back svg{width:16px;height:16px}
.ptitle{font:500 22px/1.2 var(--f-display);border:0;background:transparent;outline:0;padding:4px 6px;border-radius:4px;min-width:0;flex:1 1 220px;letter-spacing:-.005em}

/* *** AI-GENERATED — 28 October 2026 — Policy cl. 4.2 (code) ***
   Theme: a cool off-white page, black ink, a sturdy text serif for titles and a small humanist sans
   for everything else. Colour is kept for meaning (sourced values, bias direction, note colours);
   chrome is black, white and hairline grey. Cards and drop zones use dashed borders; markers are squares. */
:root{
  --paper:#fdfcff; --desk:#f5f5fb; --ink:#111111; --ink-2:#4b4b52; --ink-3:#767676;
  --rule:#e1e1e1; --rule-soft:#f0eff5; --dash:rgba(17,17,17,.2);

  --sq:#e64626,#1a345e,#2f6b4f,#c99a1e,#7a3b8f,#3d7cc9,#111111; --sq-faint:#dcdbe3;
  --ease:cubic-bezier(.22,1,.36,1); --logo:var(--ink);
  --shadow:0 1px 2px rgba(17,17,17,.05),0 12px 30px -16px rgba(17,17,17,.28);
  --f-display:"Literata",Georgia,"Times New Roman",serif;

}

  --accent:#f0603f;--accent-ink:#f5866a;--accent-wash:#3a1d16;--navy:#2c4f86;--good:#6fbf98;
  --sq:#f0603f,#6d8fd0,#6fbf98,#e2b84a,#b07cc6,#5aa0e6,#f1efe9;--sq-faint:#2a2a31;--logo:#41ff78;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -16px rgba(0,0,0,.75)}}

  --accent:#f0603f;--accent-ink:#f5866a;--accent-wash:#3a1d16;--navy:#2c4f86;--good:#6fbf98;

<script>
/* *** AI-GENERATED — 28 October 2026 — Policy cl. 4.2 (code) *** */
/* *** AI-GENERATED — 30 October 2026 — Policy cl. 4.2 (code) — notes in search results *** */
/* *** AI-GENERATED — 4 November 2026 — Policy cl. 4.2 (code) — memos on coded passages are left out (themes show only in the Themes panel and on the Themes page) *** */
/* ---------------- full-text search ----------------
   Each PDF's text is read once with pdf.js and committed to the data repository as
   library/text/<paper>-<time>.json  {v:1, pages:[text of each page], abstract}.
   Search loads those files (kept in this browser's IndexedDB after the first fetch) and matches
   case-insensitively in the PDF text, the paper's label, reference and reading notes, and the
   text of every annotation. A paper must contain every search word; "quoted words" match as a
   phrase. Matches inside words count too: "fovea" finds "foveal" and "parafoveal".
   Untested / fails quietly: scanned PDFs with no text layer return no text (they are still found
   by their notes); words hyphenated across lines are re-joined only when the next line starts in
   lower case; the "abstract" is the text after the word "Abstract" on pages 1–2, so papers
   without that heading show none. Nothing here runs until the app calls it. */
const TEXT_DIR="library/text/";
const TXT={mem:new Map(), db:null, running:false, done:0, total:0, failed:new Set()};

function txtDb(){
  if(TXT.db) return TXT.db;
  TXT.db=new Promise(res=>{try{const r=indexedDB.open("fbl-text",1);r.onupgradeneeded=()=>r.result.createObjectStore("t");r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch{res(null);}});
  return TXT.db;
}
async function idbGet(k){const db=await txtDb();if(!db) return null;return new Promise(res=>{try{const q=db.transaction("t").objectStore("t").get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch{res(null);}});}
async function idbSet(k,v){const db=await txtDb();if(!db) return;try{db.transaction("t","readwrite").objectStore("t").put(v,k);}catch{}}
const txtKey=path=>`${S.cfg.owner}/${S.cfg.repo}:${path}`;
const needsIndex=p=>!!p.pdf&&(!p.text||p.textPdf!==p.pdf);

async function pdfTextFromDoc(pdf){
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const tc=await (await pdf.getPage(i)).getTextContent();
    let s="", lastY=null, lastEnd=null;
    for(const it of tc.items){
      if(typeof it.str!=="string") continue;
      const x=it.transform[4], y=it.transform[5], h=Math.hypot(it.transform[2],it.transform[3])||10;
      if(s&&lastY!==null){
        if(Math.abs(y-lastY)>h*0.5){ if(!/\s$/.test(s)) s+="\n"; }                       // new line
        else if(lastEnd!==null&&x-lastEnd>h*0.15&&!/\s$/.test(s)&&!/^\s/.test(it.str)) s+=" ";  // gap between words
      }
      s+=it.str; if(it.hasEOL) s+="\n";
      lastY=y; lastEnd=x+(it.width||0);
    }
    pages.push(s.replace(/([a-z])-\n([a-z])/g,"$1$2").replace(/\s+/g," ").trim());
  }
  return {v:1,pages,abstract:findAbstract(pages)};
}
function findAbstract(pages){
  const head=(pages[0]||"")+" "+(pages[1]||"");
  const m=head.match(/\babstract\b[\s.:—–-]*/i); if(!m) return "";
  let rest=head.slice(m.index+m[0].length);
  const stop=rest.search(/\b(key ?words?|introduction|significance statement|public significance)\b|©/i);
  if(stop>40) rest=rest.slice(0,stop);
  const w=rest.trim().split(" "); return w.slice(0,70).join(" ")+(w.length>70?"…":"");
}
/* Read one paper's text, keep it in memory, and commit it (when the token can write). */
async function indexPaper(pid){
  const p=S.papers.get(pid); if(!p||!p.pdf) return null;
  const had=pdfCache.has(p.pdf);
  const doc=await loadPdf(p);                      // shares the viewer's copy, so no second download
  let T; try{T=await pdfTextFromDoc(doc);}finally{
    if(!had&&!(S.view.name==="paper"&&S.view.id===pid)){pdfCache.delete(p.pdf);try{doc.destroy();}catch{}}  // don't hoard memory while backfilling
  }
  T.pdf=p.pdf;
  TXT.mem.set(pid,T);
  if(S.canWrite&&S.repoPrivate){
    const path=TEXT_DIR+pid+"-"+Date.now().toString(36)+".json";
    const res=await putFile(path,b64FromBytes(enc.encode(JSON.stringify(T))),`Index text: ${p.label||p.pdfName||pid}`);
    const cur=S.papers.get(pid);
    if(cur){
      const old=cur.text, oldSha=cur.textSha;
      put("papers",pid,{...cur,text:path,textSha:res.content.sha,textPdf:p.pdf});
      if(old&&old!==path) deleteFile(old,oldSha,"Remove old text index").catch(()=>{});
    }
    idbSet(txtKey(path),T);
  }
  return T;
}
async function loadText(pid){
  const p=S.papers.get(pid); if(!p||!p.pdf) return null;
  const m=TXT.mem.get(pid); if(m&&m.pdf===p.pdf) return m;
  if(p.text&&p.textPdf===p.pdf){
    let T=await idbGet(txtKey(p.text));
    if(!T){try{T=JSON.parse(dec.decode(await getRawBytes(p.text)));idbSet(txtKey(p.text),T);}catch{T=null;}}
    if(T){T.pdf=p.pdf;TXT.mem.set(pid,T);return T;}
  }
  return null;
}
/* Index every paper that has a PDF but no text yet, one at a time, then search again. */
async function indexMissing(){
  if(TXT.running) return;
  const todo=[...S.papers.entries()].filter(([id,p])=>needsIndex(p)&&!TXT.mem.has(id)&&!TXT.failed.has(id)).map(([id])=>id);
  if(!todo.length) return;
  TXT.running=true; TXT.done=0; TXT.total=todo.length; scheduleRender();
  for(const id of todo){
    try{await indexPaper(id);}catch{TXT.failed.add(id);}
    TXT.done++; scheduleRender();
  }
  TXT.running=false; if(S.rev>S.savedRev) saveNow();
  S.search=null; scheduleRender();
}

function parseQuery(q){const t=[];String(q).replace(/"([^"]+)"|(\S+)/g,(m,a,b)=>{const s=(a||b).toLowerCase().trim();if(s.length>=2) t.push(s);});return [...new Set(t)];}
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function markTerms(text,terms){let h=esc(text);for(const t of terms) h=h.replace(new RegExp(escRe(esc(t)),"gi"),m=>`<mark>${m}</mark>`);return h;}
function around(text,i,len,pad=110){
  let a=Math.max(0,i-pad), b=Math.min(text.length,i+len+pad);
  if(a>0){const sp=text.indexOf(" ",a);if(sp>=0&&sp<i) a=sp+1;}
  if(b<text.length){const sp=text.lastIndexOf(" ",b);if(sp>i+len) b=sp;}
  return (a>0?"… ":"")+text.slice(a,b)+(b<text.length?" …":"");
}
async function runSearch(q){
  const terms=parseQuery(q); const out=[];
  if(!terms.length) return {q,terms,results:out};
  for(const [pid,p] of S.papers){
    const T=await loadText(pid);
    const lc=T?T.pages.map(s=>s.toLowerCase()):[];
    const notes=annsOf(pid).filter(a=>a.kind!=="code"&&(a.text||todosOf(a).length)).map(a=>({id:a.id,page:a.page,kind:a.kind,text:[a.text||"",...todosOf(a).map(t=>t.t)].filter(Boolean).join(" · ")}));   // to-do items are searchable too (29 Oct 2026)
    if(p.notes) notes.push({id:null,page:null,kind:"notes",text:p.notes});
    const meta=((p.label||"")+" \n "+(p.ref||"")).toLowerCase();
    const hits=[]; let total=0, ok=true;
    for(const t of terms){
      let c=0;
      lc.forEach((s,pi)=>{let i=s.indexOf(t);while(i>=0){c++;if(hits.length<400) hits.push({page:pi+1,i,len:t.length});i=s.indexOf(t,i+t.length);}});
      const elsewhere=meta.includes(t)||notes.some(n=>n.text.toLowerCase().includes(t));
      if(!c&&!elsewhere){ok=false;break;}
      total+=c;
    }
    if(!ok) continue;
    hits.sort((a,b)=>a.page-b.page||a.i-b.i);
    const seen=new Set(), snips=[];
    for(const h of hits){if(seen.has(h.page)) continue;seen.add(h.page);snips.push({page:h.page,text:around(T.pages[h.page-1],h.i,h.len)});if(snips.length>=3) break;}
    const noteHits=[];
    for(const n of notes){const l=n.text.toLowerCase();const t=terms.find(t=>l.includes(t));if(!t) continue;noteHits.push({...n,snip:around(n.text,l.indexOf(t),t.length,80)});if(noteHits.length>=3) break;}
    out.push({pid,total,pages:[...new Set(hits.map(h=>h.page))],snips,noteHits,abstract:T?T.abstract:"",indexed:!!T});
  }
  out.sort((a,b)=>b.total-a.total||b.noteHits.length-a.noteHits.length||yearOf(S.papers.get(a.pid).label)-yearOf(S.papers.get(b.pid).label));
  return {q,terms,results:out};
}
let searchTimer=null, searchSeq=0;
function requestSearch(q){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(async()=>{
    const seq=++searchSeq;
    const r=await runSearch(q);
    if(seq!==searchSeq) return;
    S.search=r; if(S.view.name==="library") renderLibrary();
    indexMissing();
  },220);
}
function searchView(q){
  const s=S.search;
  const prog=TXT.running?`<p class="hitsum">Reading the text of your PDFs: ${TXT.done} of ${TXT.total}. Results update when it finishes.</p>`:"";
  if(!s||s.q!==q){requestSearch(q);return `<div class="wrap results">${prog}<p class="hitsum">Searching…</p></div>`;}
  if(!s.terms.length) return `<div class="wrap results"><p class="hitsum">Type at least two letters.</p></div>`;
  const results=s.results.filter(r=>{const p=S.papers.get(r.pid);return p&&inTag(p);});   // within the chosen tag
  const nHits=results.reduce((n,r)=>n+r.total,0);
  const nres=activeTag()===ALL_TAG?notesSorted().filter(n=>noteMatches(n.id,s.terms)):[];   // your own notes (30 Oct 2026)
  const notIdx=[...S.papers.values()].filter(p=>needsIndex(p)).length;
  let h=`<div class="wrap results">${prog}<p class="hitsum">${results.length} paper${results.length===1?"":"s"} · ${nHits} match${nHits===1?"":"es"} in the PDFs${nres.length?` · ${nres.length} of your notes`:""}${notIdx&&!TXT.running?` · ${notIdx} PDF${notIdx===1?"":"s"} not readable as text`:""}</p>`;
  for(const n of nres) h+=`<article class="hit nhit"><header><a class="plabel" href="#note-${n.id}" data-act="gonote" data-id="${n.id}">${esc(n.title||"Untitled note")}</a><span class="chip nchip">Note</span><span class="meta">Edited ${esc(fullDate(n.updatedAt))}</span></header><p class="abs">${noteSnippet(n.id,s.terms)}</p></article>`;
  if(!results.length&&!nres.length) h+=`<p class="blank">Nothing matches “${esc(q)}”${activeTag()!==ALL_TAG?" in this tag":""}.</p>`;
  const kindName={margin:"Margin note",sticky:"Sticky",evidence:"Source",sticker:"Sticker",notes:"Reading notes"};
  for(const r of results){
    const p=S.papers.get(r.pid); if(!p) continue;
    const pg=r.pages.length?` · ${r.pages.length>8?r.pages.slice(0,8).join(", ")+"…":r.pages.join(", ")}`:"";
    h+=`<article class="hit"><header><a class="plabel" href="#paper-${r.pid}" data-act="gohit" data-paper="${r.pid}" data-page="${r.pages[0]||""}">${esc(p.label||"Untitled paper")}</a>
      <span class="chip" data-v="${esc(p.status||"To read")}">${esc(p.status||"To read")}</span>
      <span class="meta">${r.total} match${r.total===1?"":"es"}${r.pages.length?` on p${r.pages.length>1?"p":""}.`+pg.slice(2):""}${r.indexed||!p.pdf?"":" · text not read yet"}</span></header>`;

  for(const [k,c] of S.cols) out.set(k,{...(out.get(k)||{}),...c,k});

   (Tags made before 9 Nov 2026 also carry a "photo" field from the old header; it is kept but no longer used.)

   (rename or delete one). Order: drag a tag up or down the sidebar list (see _nav.js). */

function tagsSorted(){return [...S.tags.entries()].map(([id,t])=>({id,...t})).sort((a,b)=>(a.order??0)-(b.order??0)||(a.createdAt||0)-(b.createdAt||0));}

const openTag=()=>{const t=S.view.name==="library"?S.view.tag:null; return t&&(t===ALL_TAG||t===NOTES_TAG||t===THEMES_TAG||S.tags.has(t))?t:null;};

/* addresses: #all-literature, #<tag name in lower case with dashes> */
const ALL_SLUG="all-literature";

  if(id===THEMES_TAG) return "themes";
  const list=tagsSorted(), k=list.findIndex(t=>t.id===id); if(k<0) return "";
  const s=slugify(list[k].name)||id;   // a name already used by an earlier tag gets a suffix
  const clash=s===ALL_SLUG||s==="notes"||s==="themes"||/^(paper|note)-/.test(s)||list.slice(0,k).some(t=>(slugify(t.name)||t.id)===s);
  return clash?s+"-"+id.slice(-4).toLowerCase():s;
}
function tagFromSlug(h){ if(h===ALL_SLUG) return ALL_TAG; if(h==="notes") return NOTES_TAG; if(h==="themes") return THEMES_TAG; const t=tagsSorted().find(t=>tagSlug(t.id)===h); return t?t.id:null; }

  name=String(name||"").replace(/\s+/g," ").trim().slice(0,40); if(!name) return null;
  const ex=tagsSorted().find(t=>t.name.toLowerCase()===name.toLowerCase()); if(ex) return ex.id;

/* ---------------- to-do stickers ----------------

   paper in the papers list and at the top of each tag page, and listed in Export with notes.
   Untested / fails quietly: a long list can cover the text under it (hide it, or move the sticker);
   if two devices change the same list at once, the later save wins; at most 60 items per sticker. */
const isTodo=a=>!!a&&a.kind==="sticker"&&a.sticker==="todo";

function firstOpenTodo(pid){return annsOf(pid).filter(isTodo).sort((a,b)=>a.page-b.page||a.y-b.y).find(a=>todosOf(a).some(t=>!t.done))||null;}
/* each item keeps when it was added (at) and ticked off (doneAt), for the Archive on the front page */
function setTodos(id,list){const a=S.anns.get(id); if(!a) return; const now=Date.now();
  put("anns",id,{...a,todos:list.slice(0,60).map(t=>({t:String(t.t||"").slice(0,300),done:!!t.done,at:t.at||now,doneAt:t.done?(t.doneAt||now):null}))});}
function todoSummary(a){const l=todosOf(a), open=l.filter(t=>!t.done).length; return l.length?`${open} of ${l.length} open: ${l.map(t=>(t.done?"✓ ":"")+t.t).join("; ")}`:"No items yet";}
/* the note drawn on the page under the sticker */
function todoCardHtml(a){

/* ---------------- selectable text, copy and text highlights ----------------
   Each rendered page gets pdf.js's invisible text layer on top, so its words can be selected.
   - Read tool: select text, then use the small bar under it: Copy, or Highlight in a colour.
     Ctrl/Cmd+C also copies. Click a highlight to add a note, recolour, copy its text or remove it.
   - Highlight tool: drag across words to highlight them in the chosen colour. A drag that starts
     where there is no text (a figure, a margin) draws a freehand stroke as before.
   A text highlight is saved as boxes on the page plus the quoted text (annotation kind "texthl"); it
   is drawn with the pen strokes and included in Export with notes (its note in the notes column).
   Untested / fails quietly: scanned PDFs have no text to select (use the freehand highlighter);
   selection follows the PDF's own text order, so on some two-column or rotated layouts it can jump
   across columns; highlight boxes are as tall as the PDF's text boxes, which on some fonts sit a
   little high or low; touch screens use the browser's own long-press selection. */
async function buildTextLayer(page,row,W){
  const tl=row.querySelector(".textLayer"), lib=window["pdfjs-dist/build/pdf"];
  if(!tl||!lib||!lib.renderTextLayer||tl.dataset.done) return;
  tl.dataset.done="1";
  const vp=page.getViewport({scale:W/page.getViewport({scale:1}).width});
  tl.style.setProperty("--scale-factor",String(vp.scale));

/* the current selection, split by page, as boxes in page fractions [x,y,w,h] plus the text */

  const range=sel.getRangeAt(0), out=[];
  for(const tl of document.querySelectorAll(".page .textLayer")){
    if(!range.intersectsNode(tl)) continue;
    const page=tl.closest(".page"), pr=page.getBoundingClientRect();

    wins.push({s,h:b-s});

    if(ny===Infinity) break;

function markSelection(color,mid){

  const nodes=[], w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);

  for(const t of nodes){

    if(e<=s||!t.data.slice(s,e).trim()) continue;

    const m=document.createElement("mark"); m.className="hl-"+color; if(mid0) m.dataset.m=mid0; mid.replaceWith(m); m.append(mid); n++;
  }

}

const nfind={q:"",ranges:[],cur:-1,t:0};
function runNoteFind(q,keep){

/* images → figures */
function shrinkImage(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=async()=>{
      const MAXW=2400, ext=file.type==="image/gif"?"gif":file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg", w=im.naturalWidth, h=im.naturalHeight;
      if(ext==="gif"||w<=MAXW){URL.revokeObjectURL(url); res({bytes:new Uint8Array(await file.arrayBuffer()),ext,w,h}); return;}
      const c=document.createElement("canvas"); c.width=MAXW; c.height=Math.round(h*MAXW/w);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(async b=>res({bytes:new Uint8Array(await b.arrayBuffer()),ext:ext==="png"?"png":"jpg",w:c.width,h:c.height}),ext==="png"?"image/png":"image/jpeg",0.9);
    };
    im.onerror=()=>{URL.revokeObjectURL(url); res(null);};
    im.src=url;
  });
}
async function insertFigure(file){
  if(!S.canWrite) return;
  if(!S.repoPrivate){toast("Make the data repository private before adding images.",4000);return;}
  if(!/^image\/(png|jpe?g|gif|webp)$/.test(file.type)){toast("Use a PNG, JPEG, GIF or WebP image.");return;}
  const got=await shrinkImage(file); if(!got){toast("That image couldn’t be read.");return;}
  if(got.bytes.length>25*1024*1024){toast("That image is over 25 MB.");return;}
  const nid=noteShellFor, path=IMG_DIR+nid+"-"+uid("f")+"."+got.ext, b=noteBody(); if(!b) return;
  IMGURL.set(path,URL.createObjectURL(new Blob([got.bytes],{type:MIME[got.ext]})));
  histSnap(); restoreNoteRange();
  const t=document.createElement("template"); t.innerHTML=figureHtml(path,got.w,got.h); const fig=t.content.firstElementChild;
  const after=insertBlockAtCaret(fig); hydrateFigures(b);
  fig.classList.add("uploading"); focusCaption(fig,"start");
  done(prevLeaf(fig)||fig,after); saveNoteNow();
  try{ await putFile(path,b64FromBytes(got.bytes),`Add image to note: ${S.notes.get(nid)?.title||"Untitled note"}`); fig.classList.remove("uploading"); }
  catch(e){ fig.classList.remove("uploading"); fig.classList.add("missing"); toast(`The image didn’t upload: ${e instanceof GhError?ghReason(e):"try again"}.`,5000); }
}
/* pasted text: paragraphs at blank lines; lines of one wrapped paragraph (as copied out of a PDF) are joined */
function textToBlocks(text){
  const t=String(text||"").replace(/\r\n?/g,"\n").replace(/ /g," ");
  let paras;
  if(/\n[ \t]*\n/.test(t)) paras=t.split(/\n[ \t]*\n+/).map(p=>p.replace(/-\n(?=\p{Ll})/gu,"-").replace(/\s*\n\s*/g," "));
  else { const ls=t.split("\n"); const long=ls.slice(0,-1).filter(l=>l.trim().length>=50).length;
    paras=ls.length>=3&&long>=0.7*(ls.length-1)?[ls.join("\n").replace(/-\n(?=\p{Ll})/gu,"-").replace(/\s*\n\s*/g," ")]:ls; }
  return paras.map(p=>p.replace(/[ \t]+/g," ").trim()).filter((p,i,a)=>p||a.length===1).map(p=>{ const e=document.createElement("p"); if(p) e.textContent=p; else e.append(document.createElement("br")); return e; });
}
/* pasted HTML: Google Docs and Word mark bold and italic with styles, which would otherwise be lost */
function prepPaste(html){
  const d=new DOMParser().parseFromString(html,"text/html");
  for(const x of d.querySelectorAll('b[id^="docs-internal-guid"]')) x.replaceWith(...x.childNodes);
  for(const x of [...d.querySelectorAll("span[style]")]){
    const s=x.getAttribute("style")||""; let inner=x;
    if(/font-weight\s*:\s*(bold|[6-9]00)/i.test(s)){ const e=d.createElement("strong"); e.append(...inner.childNodes); inner.append(e); inner=e; }
    if(/font-style\s*:\s*italic/i.test(s)){ const e=d.createElement("em"); e.append(...inner.childNodes); inner.append(e); }
  }
  return d.body.innerHTML;
}
function onNotePaste(ev){

    if(!list.some(x=>x.nodeType===1&&(x.textContent.trim()||x.querySelector("img,a.npin")))) list=null; }

const pClean=s=>String(s||"").replace(/\s+/g," ").trim();

/* ---------------- GitHub API ---------------- */
const enc=new TextEncoder(), dec=new TextDecoder();
function b64FromBytes(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s);}
function bytesFromB64(b64){const s=atob(b64.replace(/\s/g,""));const out=new Uint8Array(s.length);for(let i=0;i<s.length;i++) out[i]=s.charCodeAt(i);return out;}
const encPath=p=>p.split("/").map(encodeURIComponent).join("/");
class GhError extends Error{constructor(status,msg){super(msg);this.status=status;}}
async function gh(path,opts={}){
  const c=S.cfg;
  let res;
  try{
    res=await fetch("https://api.github.com"+path,{...opts,cache:"no-store",headers:{
      "Accept":"application/vnd.github+json","Authorization":"Bearer "+c.token,"X-GitHub-Api-Version":"2022-11-28",...(opts.headers||{})}});
  }catch(e){throw new GhError(0,"network");}
  return res;
}
async function ghJson(path,opts){const res=await gh(path,opts);if(res.status===404) return null;if(!res.ok) throw new GhError(res.status,await res.text().catch(()=>""));return res.json();}
const contentsUrl=p=>`/repos/${encodeURIComponent(S.cfg.owner)}/${encodeURIComponent(S.cfg.repo)}/contents/${encPath(p)}`;
async function getRawBytes(path){
  const res=await gh(contentsUrl(path)+"?ref="+encodeURIComponent(S.cfg.branch),{headers:{"Accept":"application/vnd.github.raw"}});
  if(!res.ok) throw new GhError(res.status,"raw");
  return new Uint8Array(await res.arrayBuffer());
}
async function getDataFile(useEtag){
  const headers=useEtag&&S.etag?{"If-None-Match":S.etag}:{};
  const res=await gh(contentsUrl(DATA_PATH)+"?ref="+encodeURIComponent(S.cfg.branch),{headers});
  if(res.status===304) return {unchanged:true};
  if(res.status===404) return {missing:true};
  if(!res.ok) throw new GhError(res.status,await res.text().catch(()=>""));
  const etag=res.headers.get("ETag"); const meta=await res.json();
  let text;
  if(meta.content&&meta.encoding==="base64") text=dec.decode(bytesFromB64(meta.content));
  else text=dec.decode(await getRawBytes(DATA_PATH));
  return {sha:meta.sha,etag,data:JSON.parse(text)};
}
async function putFile(path,b64,message,sha){
  const body={message,content:b64,branch:S.cfg.branch}; if(sha) body.sha=sha;
  const res=await gh(contentsUrl(path),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok) throw new GhError(res.status,await res.text().catch(()=>""));
  return res.json();
}
async function deleteFile(path,sha,message){
  if(!sha){const meta=await ghJson(contentsUrl(path)+"?ref="+encodeURIComponent(S.cfg.branch));if(!meta) return;sha=meta.sha;}
  const res=await gh(contentsUrl(path),{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,sha,branch:S.cfg.branch})});
  if(!res.ok&&res.status!==404) throw new GhError(res.status,"delete");
}
function ghReason(e){
  const s=e&&e.status;
  if(s===0) return "No connection to GitHub.";
  if(s===401) return "GitHub didn’t accept the token. It may have expired; add a new one in Settings.";
  if(s===403) return "GitHub refused the request. Check the token has Contents: Read and write on this repository.";
  if(s===404) return "Repository not found, or the token can’t see it.";
  if(s===409||s===422) return "The library changed on GitHub at the same time.";
  if(s===413) return "That file is too large for GitHub.";
  return "GitHub returned an error ("+s+").";
}

/* ---------------- data model, merge, cache ---------------- */
function serialize(){
  return {format:"foveal-bias-library",version:1,savedAt:new Date().toISOString(),
    papers:Object.fromEntries(S.papers),rows:Object.fromEntries(S.rows),anns:Object.fromEntries(S.anns),
    tags:Object.fromEntries(S.tags),cols:Object.fromEntries(S.cols),todos:Object.fromEntries(S.todos),notes:Object.fromEntries(S.notes),themes:Object.fromEntries(S.themes),deleted:S.deleted};   // todos: front-page items (29–30 Oct 2026)
}
function applyData(D){
  S.papers=new Map(Object.entries(D.papers||{}));
  S.rows=new Map(Object.entries(D.rows||{}));
  S.anns=new Map(Object.entries(D.anns||{}));
  S.tags=new Map(Object.entries(D.tags||{}));
  S.cols=new Map(Object.entries(D.cols||{}));
  S.todos=new Map(Object.entries(D.todos||{}));
  S.notes=new Map(Object.entries(D.notes||{}));
  S.themes=new Map(Object.entries(D.themes||{}));   // thematic analysis (4 Nov 2026)
  S.deleted={...(D.deleted||{})}; S.dataVer++;
  syncFields();
}
/* Newer edit wins, per paper/row/annotation. A deletion wins over any edit made before it. */
function merge(a,b){
  const out={papers:{},rows:{},anns:{},tags:{},cols:{},todos:{},notes:{},themes:{},deleted:{}};
  for(const [k,t] of Object.entries({...(a.deleted||{}),...(b.deleted||{})})) out.deleted[k]=Math.max((a.deleted||{})[k]||0,(b.deleted||{})[k]||0,t);
  for(const col of ["papers","rows","anns","tags","cols","todos","notes","themes"]){
    const A=a[col]||{},B=b[col]||{};
    for(const id of new Set([...Object.keys(A),...Object.keys(B)])){
      const x=A[id],y=B[id]; const doc=!x?y:!y?x:((y.updatedAt||0)>=(x.updatedAt||0)?y:x);
      const del=out.deleted[col+"/"+id]||0;
      if(doc&&!(del&&del>=(doc.updatedAt||0))) out[col][id]=doc;
    }
  }
  return out;
}
let cacheTimer=null;
function cacheLocal(){clearTimeout(cacheTimer);cacheTimer=setTimeout(()=>{if(!S.cfg) return;const ok=lsSet(LS_CACHE(S.cfg),{dirty:S.rev>S.savedRev,data:serialize()});if(!ok&&S.rev>S.savedRev) toast("This browser couldn’t keep a backup copy. Save to GitHub before closing.",4000);},400);}

/* ---------------- editing API used by the UI ---------------- */
function put(col,id,data){
  if(!S.canWrite) return;
  S[col].set(id,{...data,updatedAt:Date.now()}); S.dataVer++;
  markDirty();
}
async function removeDoc(col,id){
  if(!S.canWrite) return;
  S[col].delete(id); S.deleted[col+"/"+id]=Date.now(); S.dataVer++; markDirty();
}
let saveTimer=null, firstDirtyAt=0;
function markDirty(){
  S.rev++; S.saveErr=null; cacheLocal();
  const now=Date.now(); if(!firstDirtyAt) firstDirtyAt=now;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,Math.min(SAVE_DELAY,Math.max(0,firstDirtyAt+SAVE_MAX_WAIT-now)));
  setSaveState();
}
async function saveNow(){
  clearTimeout(saveTimer); saveTimer=null;
  if(!S.connected||!S.canWrite) return;
  if(S.saving){S.saveAgain=true;return;}
  if(S.rev===S.savedRev){setSaveState();return;}
  S.saving=true; setSaveState();
  let attempt=0;
  while(true){
    const rev=S.rev;
    const json=JSON.stringify(serialize(),null,1);
    try{
      const res=await putFile(DATA_PATH,b64FromBytes(enc.encode(json)),"Library: update notes",S.dataSha);
      if(S.dataSha) S.oldShas.add(S.dataSha);   // versions this browser has replaced: a late copy of one is not news (30 Oct 2026)
      S.dataSha=res.content.sha; S.etag=null; S.savedRev=rev; S.lastSaved=Date.now(); firstDirtyAt=S.rev>rev?Date.now():0;
      break;
    }catch(e){
      if((e.status===409||e.status===422)&&attempt<2){
        attempt++;
        try{const remote=await getDataFile(false); if(remote.data){applyData(merge(remote.data,serialize()));S.dataSha=remote.sha;scheduleRender();} else S.dataSha=null; continue;}
        catch(e2){S.saveErr=ghReason(e2);break;}
      }
      S.saveErr=ghReason(e);
      if(e.status===0){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,30000);}
      break;
    }
  }
  S.saving=false; cacheLocal(); setSaveState();
  if(S.saveAgain||(S.rev>S.savedRev&&!S.saveErr&&!saveTimer)){S.saveAgain=false;saveTimer=setTimeout(saveNow,SAVE_DELAY);}
}
function setSaveState(){
  for(const el of $$(".savestate")){
    let txt, act=false, cls="";
    if(!S.connected){txt="Not connected";cls="off";}
    else if(!S.canWrite){txt="Read only";cls="off";}
    else if(S.saving){txt="Saving to GitHub…";cls="saving";}
    else if(S.saveErr){txt="Not saved: "+S.saveErr+" Retry";cls="saving";act=true;}
    else if(S.rev>S.savedRev){txt="Unsaved changes · Save now";cls="saving";act=true;}
    else {txt=S.lastSaved?"Saved to GitHub "+ago(S.lastSaved):"Up to date with GitHub";}
    el.className="savestate "+cls+(act?" act":""); el.textContent=txt; el.dataset.act=act?"savenow":""; el.title=act?"Save to GitHub now (Ctrl/Cmd+S)":"";
  }
}

/* ---------------- connect, load, poll ---------------- */
async function connect(cfg){
  S.cfg={owner:cfg.owner.trim(),repo:cfg.repo.trim(),branch:(cfg.branch||"").trim(),token:cfg.token.trim()};
  const repo=await ghJson(`/repos/${encodeURIComponent(S.cfg.owner)}/${encodeURIComponent(S.cfg.repo)}`);
  if(!repo) throw new GhError(404,"repo");
  S.cfg.branch=S.cfg.branch||repo.default_branch||"main";
  S.repoPrivate=!!repo.private;
  S.canWrite=!!(repo.permissions&&repo.permissions.push);
  lsSet(LS_CFG,S.cfg);
  const remote=await getDataFile(false).catch(e=>{if(e.status===409) return {missing:true};throw e;});
  const cache=lsGet(LS_CACHE(S.cfg));
  let D=remote.data||{papers:{},rows:{},anns:{},deleted:{}};
  S.dataSha=remote.sha||null; S.etag=remote.etag||null;
  if(cache&&cache.dirty&&cache.data){D=merge(D,cache.data);applyData(D);S.connected=true;S.loaded=true;markDirty();toast("Recovered changes from this browser that hadn’t reached GitHub. Saving them now.",4500);}
  else {applyData(D);S.connected=true;S.loaded=true;S.lastSaved=null;}
  setSaveState();
}
async function poll(){
  if(!S.connected||S.saving||S.rev>S.savedRev||document.visibilityState!=="visible") return;
  try{
    const r=await getDataFile(true);
    if(r.unchanged||r.missing) return;
    if(S.saving||S.rev>S.savedRev) return;
    if(r.sha!==S.dataSha){
      if(S.oldShas.has(r.sha)) return;   // GitHub briefly served an older copy of a version this browser already replaced: ignore it
      applyData(merge(r.data,serialize())); S.dataSha=r.sha; S.etag=r.etag; cacheLocal(); scheduleRender();
      toast("Updated with changes saved from another tab or device.");
    }
    else S.etag=r.etag;
  }catch{}
}
setInterval(poll,POLL_MS);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") poll();});

function countsHtml(papers,noTodos){
  const inView=new Set(papers.map(p=>p.id));
  const nRows=[...S.rows.values()].filter(r=>inView.has(r.paper)).length;
  const viewAnns=[...S.anns.values()].filter(a=>inView.has(a.paper));
  const nSrc=viewAnns.filter(a=>a.kind==="evidence").length, nNotes=viewAnns.filter(a=>a.kind!=="ink"&&a.kind!=="evidence"&&a.kind!=="texthl"&&a.kind!=="link"&&a.kind!=="code").length;
  const nDone=papers.filter(p=>p.status==="Extracted").length, nTodo=papers.reduce((n,p)=>n+openTodos(p.id),0);
  const bits=[[papers.length,"paper","papers"],[nRows,"experiment","experiments"],[nDone,"extracted","extracted"],[nSrc,"sourced value","sourced values"],[nNotes,"note","notes"]];
  if(nTodo&&!noTodos) bits.push([nTodo,"to-do open","to-dos open"]);   // the front page has the list itself
  return `<p class="counts">${bits.map(([n,one,many])=>`<span><b>${n}</b> ${n===1?one:many}</span>`).join("")}</p>`;
}

function loadPdf(p){
  if(pdfCache.has(p.pdf)) return pdfCache.get(p.pdf);
  const pr=(async()=>{
    const lib=window["pdfjs-dist/build/pdf"]; if(!lib) throw new Error("viewer");
    lib.GlobalWorkerOptions.workerSrc="vendor/pdfjs/pdf.worker.min.js";
    const data=await getRawBytes(p.pdf);
    return lib.getDocument({data,isEvalSupported:false}).promise;
  })();
  pdfCache.set(p.pdf,pr); pr.catch(()=>pdfCache.delete(p.pdf));

function newRow(pid,exp){

async function importFiles(files,targetPid){
  if(!S.canWrite) return;
  if(!S.repoPrivate){toast("Make the repository private before adding PDFs.",4000);return;}
  const list=[...files].filter(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name));
  if(!list.length){toast("Choose a PDF file.");return;}
  let last=null, k=0, ok=0; const fresh=[];
  for(const f of list){
    k++;
    if(f.size>MAX_PDF){toast(`${f.name} is over 50 MB, too large to store through GitHub’s API.`,5000);await sleep(1500);continue;}
    toast(list.length>1?`Committing ${k} of ${list.length} to GitHub: ${f.name}`:`Committing ${f.name} to GitHub…`,120000);
    try{
      const pid=targetPid||uid("p");
      const path=PDF_DIR+pid+"-"+Date.now().toString(36)+".pdf";
      const res=await putFile(path,b64FromBytes(new Uint8Array(await f.arrayBuffer())),`Add PDF: ${f.name}`);
      if(targetPid){
        const p=S.papers.get(targetPid); const old=p.pdf, oldSha=p.pdfSha;
        put("papers",targetPid,{...p,pdf:path,pdfSha:res.content.sha,pdfName:f.name}); last=targetPid;
        if(old&&old!==path){pdfCache.delete(old);deleteFile(old,oldSha,"Remove replaced PDF").catch(()=>{});}
      } else {
        const label=f.name.replace(/\.pdf$/i,"").replace(/[_]+/g," ").trim().slice(0,120)||"Untitled paper";
        put("papers",pid,{label,ref:"",status:"To read",notes:"",pdf:path,pdfSha:res.content.sha,pdfName:f.name,createdAt:Date.now()});
        newRow(pid,"Exp 1"); last=pid; fresh.push(pid);
      }
      ok++;
    }catch(e){toast(`${f.name}: ${e instanceof GhError?ghReason(e):"didn’t upload."}`,5000);await sleep(1500);}
  }
  if(ok) {toast(ok>1?`Added ${ok} PDFs.`:"Added.");saveNow();}
  if(last&&(list.length===1||targetPid)) location.hash="paper-"+last;
  else if(ok&&!openTag()) location.hash=ALL_SLUG;   // several new papers: show them in All literature
  else render();
  if(ok) setTimeout(()=>indexMissing(),800);
  if(fresh.length&&S.askRefs!==false) askRefDetails(fresh);   // new papers: a box asks for their reference details (5 Nov 2026)
}
async function deletePaper(pid){
  const p=S.papers.get(pid); if(!p) return;
  for(const a of annsOf(pid)) await removeDoc("anns",a.id);
  for(const r of rowsOf(pid)) await removeDoc("rows",r.id);
  await removeDoc("papers",pid);
  if(p.pdf){pdfCache.delete(p.pdf);deleteFile(p.pdf,p.pdfSha,`Remove PDF: ${p.pdfName||p.label||""}`).catch(()=>{});}
  if(p.text){TXT.mem.delete(pid);deleteFile(p.text,p.textSha,`Remove text index: ${p.label||""}`).catch(()=>{});}
  saveNow();
  toast(`Deleted ${p.label||"paper"}.`); const h=libHash(null); if(location.hash===h||(h==="#"&&!location.hash)) render(); else location.hash=h;
}
function exportCsv(){
  const head=["Paper","Full reference","Status","Tags",...FIELDS.map(f=>f.label),"Sources (page)"];
  const lines=[head];
  for(const p of papersSorted()) for(const r of rowsOf(p.id)){
    const src=FIELDS.map(f=>{const e=evidenceFor(r.id,f.k);return e?`${f.short} p.${e.page}`:null;}).filter(Boolean).join("; ");
    lines.push([p.label||"",p.ref||"",p.status||"",paperTagIds(p).map(id=>S.tags.get(id).name).join("; "),...FIELDS.map(f=>r[f.k]??""),src]);
  }
  const csv="﻿"+lines.map(l=>l.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="foveal-bias-summary.csv";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

      for(let k=0;k<pts.length;k++){
        const p0=pts[Math.max(0,k-1)],p1=pts[k];
        const dist=segDist(x*d.W,y*d.H,p0[0]*d.W,p0[1]*d.H,p1[0]*d.W,p1[1]*d.H);
        if(dist<tol&&dist<bd){bd=dist;best=a.id;}
      }
    }
    if(best){removeDoc("anns",best).then(()=>drawInk(i));} else toast("Click directly on a stroke or highlight to erase it.",1800);
    return;
  }
  if(S.tool==="margin"){
    if(S.view.name==="note"||page.querySelector(".textLayer span")){ toast("Select the words the note is about.",2200); return; }   // *** AI-GENERATED — 3 November 2026 — Policy cl. 4.2 (code) — margin notes on marked words ***
    const id=newAnn({kind:"margin",page:i,x,y,text:"",color:S.colors.margin}); renderOverlays();
    const note=$(`.mnote[data-id="${id}"]`); if(note){startEditNote(note);if(window.innerWidth<=900) note.scrollIntoView({block:"center"});}
    return;
  }
  if(S.tool==="sticky"){
    const id=newAnn({kind:"sticky",page:i,x,y,text:"",color:S.colors.sticky}); renderOverlays();
    const el=$(`.sticky[data-id="${id}"]`); if(el) stickyPop({id,...S.anns.get(id)},el);
    return;
  }
  if(S.tool==="sticker"){
    const id=newAnn({kind:"sticker",sticker:S.sticker,page:i,x,y,rot:Math.round((Math.random()*24-12)*10)/10,text:"",...(S.sticker==="todo"?{todos:[]}:{})});
    freshSticker=id; renderOverlays(); setTimeout(()=>{freshSticker=null;},600);
    if(S.sticker==="todo"){ const el=$(`.stk[data-id="${id}"]`); if(el) todoPop(id,el,true); }   // a TODO sticker comes with a checklist
    return;
  }
  if(S.tool==="link"){   // a pin on this page that will point to another paper
    S.linkFrom={pid:S.view.id,page:i,x:+x.toFixed(4),y:+y.toFixed(4)}; S.pinMode="paper";
    const marker=document.createElement("span"); marker.style.cssText=`position:absolute;left:${x*100}%;top:${y*100}%;width:1px;height:1px`;
    page.querySelector(".layer").appendChild(marker); openPop(marker,pinPopHtml(""),"pinpop"); setTimeout(()=>{marker.remove(); $("#pinq")?.focus();},50);
    return;
  }
  if(S.tool==="evidence"){
    if(S.pendingEvidence){
      const {row,field}=S.pendingEvidence; const old=evidenceFor(row,field);
      if(old) removeDoc("anns",old.id);
      const id=newAnn({kind:"evidence",page:i,x,y,row,field,text:""});
      S.pendingEvidence=null; S.tool="read"; render();
      const r=S.rows.get(row); toast(`Linked ${FIELD[field].label}${r?" for "+(r.exp||""):""} to p. ${i}.`);
      const pinEl=$(`.pin[data-id="${id}"]`); if(pinEl) pinPop({id,...S.anns.get(id)},pinEl);
      return;
    }
    const marker=document.createElement("span"); marker.style.cssText=`position:absolute;left:${x*100}%;top:${y*100}%;width:1px;height:1px`;
    page.querySelector(".layer").appendChild(marker);
    evidencePickerPop(marker,i,x.toFixed(4),y.toFixed(4)); setTimeout(()=>marker.remove(),50);
  }
});
document.addEventListener("pointermove",ev=>{
  if(!liveStroke) return;
  const page=$(`.page[data-page="${liveStroke.page}"]`); if(!page) return;
  const [x,y]=pagePoint(page,ev); const last=liveStroke.points[liveStroke.points.length-1];
  const d=pageDims[liveStroke.page];
  if(Math.hypot((x-last[0])*d.W,(y-last[1])*d.H)<2) return;
  liveStroke.points.push(liveStroke.tool==="hl"?[x,liveStroke.points[0][1]+(y-liveStroke.points[0][1])*0.15]:[x,y]);
  drawInk(liveStroke.page);
});
function endStroke(){
  if(!liveStroke) return;
  const s=liveStroke; liveStroke=null;
  s.points=s.points.map(p=>[+p[0].toFixed(4),+p[1].toFixed(4)]).slice(0,4000);
  newAnn({kind:"ink",tool:s.tool,color:s.color,page:s.page,points:s.points,x:s.points[0][0],y:s.points[0][1]});
  drawInk(s.page);
}
/* drag stickers, stickies and source pins to move them */
let drag=null;
document.addEventListener("pointerdown",ev=>{
  const h=ev.target.closest(".stk,.sticky,.pin,.lpin"); if(!h||!S.canWrite||(S.view.name!=="paper"&&S.view.name!=="note")||(h.classList.contains("lpin")&&S.tool==="erase")) return;
  drag={el:h,id:h.dataset.id,page:h.closest(".page"),sx:ev.clientX,sy:ev.clientY,moved:false,pid:ev.pointerId};
},true);
document.addEventListener("pointermove",ev=>{
  if(!drag||ev.pointerId!==drag.pid) return;
  if(!drag.moved){ if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)<5) return; drag.moved=true; drag.el.classList.add("dragging"); try{drag.el.setPointerCapture(ev.pointerId);}catch{} closePop(); }
  ev.preventDefault();
  const [x,y]=pagePoint(drag.page,ev); drag.x=x; drag.y=y;
  drag.el.style.left=(x*100)+"%"; drag.el.style.top=(y*100)+"%";
  const card=drag.page.querySelector(`.todocard[data-for="${drag.id}"]`); if(card){card.style.left=(x*100)+"%"; card.style.top=(y*100)+"%";}
});
function endDrag(ev){
  if(!drag) return;
  const d=drag; drag=null;
  if(!d.moved) return;
  d.el.classList.remove("dragging"); S.suppressClick=true; setTimeout(()=>{S.suppressClick=false;},400);
  const a=S.anns.get(d.id); if(a&&d.x!=null){ put("anns",d.id,{...a,x:+d.x.toFixed(4),y:+d.y.toFixed(4)}); if(isTodo(a)) renderOverlays(); }
}
document.addEventListener("pointerup",endDrag,true);
document.addEventListener("pointercancel",endDrag,true);
document.addEventListener("pointerup",endStroke);
document.addEventListener("pointercancel",endStroke);
window.addEventListener("beforeunload",ev=>{ if(S.connected&&S.rev>S.savedRev){ saveNow(); ev.preventDefault(); ev.returnValue=""; } });

/* ---------------- routing ---------------- */
function route(){
  if(!S.connected){render();return;}
  const h=location.hash.replace(/^#/,"");
  const m=h.match(/^paper-([A-Za-z0-9]+)(?:@(\d+),([\d.]+),([\d.]+))?$/), nm=h.match(/^note-([A-Za-z0-9]+)$/);
  if(m&&m[2]){ S.focusSpot={page:+m[2],x:+m[3],y:+m[4]}; S.tab="pages"; S.tool="read"; history.replaceState(null,"","#paper-"+m[1]); }   // *** AI-GENERATED — 3 November 2026 — Policy cl. 4.2 (code) — an address with a spot (a link opened in a new tab) opens the PDF there ***
  closePop();
  if(S.pickSpot&&!(m&&m[1]===S.pickSpot.pid)) S.pickSpot=null;   // left the paper without choosing a spot
  if(nm){ if(S.view.name!=="note"||S.view.id!==nm[1]){ S.view={name:"note",id:nm[1]}; shellFor=null; render(); window.scrollTo(0,0); } else render(); return; }
  if(m){ if(S.view.name!=="paper"||S.view.id!==m[1]){S.view={name:"paper",id:m[1]};shellFor=null;if(!S.focusAnn&&!S.pendingEvidence&&!S.keepTab) S.tab="pages"; S.keepTab=false;} }
  else { const tag=h?tagFromSlug(decodeURIComponent(h)):null, was=S.view.name==="library"?S.view.tag:undefined;
    S.view={name:"library",tag}; shellFor=null; S.pendingEvidence=null; S.tool="read";
    if(tag) S.tag=tag;
    if(tag!==S.lastLibTag){S.filter=""; S.search=null; S.hitTerms=null; if(tag!==NOTES_TAG) S.noteFilter="";}   // a search survives a visit to a paper
    S.lastLibTag=tag;
    if(!tag&&location.href.includes("#")) history.replaceState(null,"",location.pathname+location.search); }   // the front page has a plain address
  render();
  if(!m) window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
let rz=null;
window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{
  if(S.view.name==="paper"&&S.tab==="pages"){const el=$("#pages");if(el&&Math.abs(el.clientWidth-lastPagesWidth)>40){el.dataset.pdf="";render();} else $$(".prow").forEach(layoutMargin);}
},250);});

/* ---------------- boot ---------------- */
(async function boot(){
  const cfg=lsGet(LS_CFG);
  if(!cfg||!cfg.token){S.view={name:"setup"};render();return;}
  $("#main").innerHTML=`<div class="wrap loading">Loading your library from GitHub…</div>`;
  try{await connect(cfg);S.view={name:"library"};route();}
  catch(e){
    S.cfg=cfg; S.setupErr=e instanceof GhError?ghReason(e):"Couldn’t load the library.";
    const cache=lsGet(LS_CACHE(cfg));
    if(cache&&cache.data&&e instanceof GhError&&e.status===0){
      applyData(cache.data); S.connected=true; S.canWrite=false; S.repoPrivate=true; S.view={name:"library"}; route();
      toast("Offline: showing this browser’s last copy, read only. Reload when you’re back online.",6000);
    } else {S.view={name:"setup"};$("#main").innerHTML="";render();}
  }
})();

</script>
