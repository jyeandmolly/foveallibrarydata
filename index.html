<style>
html{color-scheme:light dark}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}

/* Layout: an editorial reading room. A summary table up front (hairline rules, small-caps ochre labels),
   and each paper opens onto a sand "desk" with the PDF page on the left and a margin column on the right. */
:root{
  --paper:#ffffff;
  --desk:#f4f2ee;
  --ink:#16191d;
  --ink-2:#565c66;
  --ink-3:#8a9099;
  --rule:#d9dbdf;
  --rule-soft:#eceef0;
  --accent:#e64626;
  --accent-ink:#b8361c;
  --accent-wash:#fdebe6;
  --navy:#1a345e;
  --navy-ink:#ffffff;
  --sticky:#fff1c9;
  --sticky-edge:#e8c661;
  --pen:#1a345e;
  --hl:rgba(255,205,40,.42);
  --good:#2f6b4f;
  --shadow:0 1px 2px rgba(22,25,29,.06),0 10px 28px -14px rgba(26,52,94,.35);
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",Tahoma,"Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f151d;--desk:#151d28;--ink:#e8eaed;--ink-2:#a9b0ba;--ink-3:#77808c;--rule:#2b3441;--rule-soft:#1f2833;
  --accent:#f0603f;--accent-ink:#f5866a;--accent-wash:#3a1d16;--navy:#2c4f86;--navy-ink:#ffffff;
  --sticky:#4a3d17;--sticky-edge:#b8962f;--pen:#1a345e;--hl:rgba(255,205,40,.42);--good:#6fbf98;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f151d;--desk:#151d28;--ink:#e8eaed;--ink-2:#a9b0ba;--ink-3:#77808c;--rule:#2b3441;--rule-soft:#1f2833;
  --accent:#f0603f;--accent-ink:#f5866a;--accent-wash:#3a1d16;--navy:#2c4f86;--navy-ink:#ffffff;
  --sticky:#4a3d17;--sticky-edge:#b8962f;--pen:#1a345e;--hl:rgba(255,205,40,.42);--good:#6fbf98;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 10.5px/1.2 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink)}
.muted{color:var(--ink-2)}
.serif{font-family:var(--f-display)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:8px 14px;font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--rule-soft)}
.btn.danger{color:var(--accent-ink);border-color:var(--accent-wash)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.savestate{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.savestate::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.savestate.saving::before{background:var(--accent);animation:pulse 1s infinite alternate}
.savestate.off::before{background:var(--ink-3)}
@keyframes pulse{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Library ---------- */
.lib-head{padding-block:44px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.lib-head h1{font:500 clamp(34px,5vw,52px)/1.02 var(--f-display);letter-spacing:-.015em;margin:10px 0 12px;text-wrap:balance}
.lib-head p{margin:0;max-width:62ch;color:var(--ink-2)}
.stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.stat .v{font:500 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.lib-actions{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.lib-actions .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:12px;border-top:1px solid var(--ink);margin-top:6px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:6px;padding:6px 10px;min-width:0;flex:0 1 280px}
.search input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:13.5px}
.search svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.toolbar label{font-size:12px;color:var(--ink-3)}
.toolbar select{border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:6px 8px;font-size:13px}
.legend{margin-left:auto;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.legend .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.tablewrap{overflow-x:auto;padding-bottom:60px}
table.lit{border-collapse:separate;border-spacing:0;width:100%;min-width:1240px;font-size:13.5px}
table.lit th{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--paper);text-align:left;font:600 10px/1.25 var(--f-body);letter-spacing:.13em;text-transform:uppercase;color:var(--accent-ink);padding:12px 8px 10px;border-bottom:1px solid var(--ink);vertical-align:bottom}
table.lit td{border-bottom:1px solid var(--rule-soft);padding:1px 2px;vertical-align:middle}
tr.grp td{padding:22px 8px 6px;border-bottom:1px solid var(--rule)}
.grp-in{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.plabel{font:500 20px/1.2 var(--f-display);text-decoration:none;letter-spacing:-.005em}
.plabel:hover{color:var(--accent-ink)}
.grp-in .meta{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grp-in .spacer{flex:1}
.chip{font:600 10px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--rule);border-radius:999px;padding:5px 8px;background:transparent;color:var(--ink-2)}
.chip[data-v="Reading"]{border-color:var(--navy);color:var(--navy)}
:root[data-theme="dark"] .chip[data-v="Reading"]{color:#9fb7e3;border-color:#4b6ea6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[data-v="Reading"]{color:#9fb7e3;border-color:#4b6ea6}}
.chip[data-v="Extracted"]{border-color:var(--good);color:var(--good)}
.linkbtn{border:0;background:none;padding:2px 0;font-size:12.5px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.linkbtn:hover{color:var(--accent-ink);text-decoration-color:currentColor}
.cellwrap{display:flex;align-items:center;gap:0}
.cell{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:8px 6px;border-radius:4px;outline:0;font-variant-numeric:tabular-nums}
.cell::placeholder{color:var(--ink-3);opacity:.6}
select.cell{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:4px}
.cell:hover{background:var(--rule-soft)}
.cell:focus{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cell[disabled]{cursor:default}
.cell[disabled]:hover{background:transparent}
.src{flex:none;width:20px;height:20px;border:0;background:none;padding:0;display:grid;place-items:center;color:var(--ink-3);opacity:0;border-radius:50%}
tr.r:hover .src,tr.r:focus-within .src{opacity:.7}
.src:hover{opacity:1!important;color:var(--accent)}
.src.has{opacity:1;color:var(--accent)}
.src svg{width:13px;height:13px}
.src[disabled]{display:none}
.rowdel{border:0;background:none;color:var(--ink-3);opacity:0;padding:4px 6px;border-radius:4px;font-size:12px}
tr.r:hover .rowdel,tr.r:focus-within .rowdel{opacity:1}
.rowdel:hover{color:var(--accent-ink);background:var(--accent-wash)}
.rowdel.arm{opacity:1;color:#fff;background:var(--accent)}
tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-wash)}100%{background:transparent}}
.empty{margin:30px 0 80px;border:1px solid var(--rule);border-radius:10px;padding:36px clamp(20px,4vw,48px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:36px}
.empty h2{font:500 30px/1.15 var(--f-display);margin:10px 0 14px}
.empty ol{margin:0;padding:0;list-style:none;display:grid;gap:16px;counter-reset:s}
.empty li{display:grid;grid-template-columns:28px 1fr;gap:10px;color:var(--ink-2)}
.empty li::before{counter-increment:s;content:counter(s);font:500 15px/1.4 var(--f-display);color:var(--accent-ink)}
.empty li b{color:var(--ink);font-weight:500}
.banner{background:var(--navy);color:var(--navy-ink);font-size:13.5px}
.banner .wrap{display:flex;gap:14px;align-items:center;padding-block:10px;flex-wrap:wrap}
.banner .btn{background:transparent;color:var(--navy-ink);border-color:rgba(255,255,255,.4)}

/* ---------- Paper view ---------- */
.pv-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.pv-top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);text-decoration:none;padding:6px 8px 6px 4px;border-radius:6px}
.back:hover{background:var(--rule-soft);color:var(--ink)}
.back svg{width:16px;height:16px}
.ptitle{font:500 22px/1.2 var(--f-display);border:0;background:transparent;outline:0;padding:4px 6px;border-radius:4px;min-width:0;flex:1 1 220px;letter-spacing:-.005em}
.ptitle:hover{background:var(--rule-soft)}
.ptitle:focus{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--paper)}
.tabs{display:flex;gap:2px;border:1px solid var(--rule);border-radius:7px;padding:2px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:5px;font-size:13px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.pv-tools{border-bottom:1px solid var(--rule);background:var(--paper)}
.pv-tools .wrap{display:flex;gap:14px;align-items:center;padding-block:8px;flex-wrap:wrap}
.seg{display:flex;gap:2px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 9px;font-size:12.5px;color:var(--ink-2)}
.tool svg{width:16px;height:16px}
.tool:hover{background:var(--rule-soft);color:var(--ink)}
.tool[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-wash)}
.tool kbd{font:500 10px/1 var(--f-mono);color:var(--ink-3);border:1px solid var(--rule);border-radius:3px;padding:2px 4px}
.zoom{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.zoom button{width:28px;height:28px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.hint{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.desk{background:var(--desk);min-height:60vh;padding-block:28px 120px}
.pages{display:grid;gap:34px;justify-content:center;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.prow{display:grid;grid-template-columns:auto 270px;gap:22px;align-items:start}
.page{position:relative;background:#fff;box-shadow:var(--shadow);border-radius:2px;overflow:visible}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.page canvas.pdf{border-radius:2px}
.layer{position:absolute;inset:0}
.desk.t-margin .page,.desk.t-sticky .page,.desk.t-evidence .page{cursor:crosshair}
.desk.t-pen .page,.desk.t-hl .page{cursor:crosshair;touch-action:none}
.desk.t-erase .page{cursor:cell}
.pageload{position:absolute;inset:0;display:grid;place-items:center;color:#9aa0a8;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.margin{position:relative;min-height:100%}
.mhead{font:600 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:4px 0 10px;border-bottom:1px solid var(--rule)}
.mnotes{position:relative}
.mnote{position:absolute;left:0;right:0;display:grid;grid-template-columns:22px 1fr auto;gap:6px;background:var(--paper);border:1px solid var(--rule);border-left:2px solid var(--accent);border-radius:4px;padding:8px 6px 8px 8px;font-size:13px;line-height:1.45;transition:top .15s}
.mnote.hot{box-shadow:0 0 0 2px var(--accent-wash)}
.mnum{font:500 12px/1.4 var(--f-display);color:var(--accent-ink)}
.mbody{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text}
.mbody:empty::before{content:"Write a note…";color:var(--ink-3)}
.mnote textarea{width:100%;border:0;outline:0;background:transparent;resize:none;padding:0;font-size:13px;line-height:1.45;min-height:3.2em}
.x{border:0;background:none;color:var(--ink-3);width:22px;height:22px;border-radius:4px;display:grid;place-items:center;padding:0}
.x:hover{background:var(--accent-wash);color:var(--accent-ink)}
.x svg{width:12px;height:12px}
.tick{position:absolute;right:-12px;transform:translateY(-50%);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font:600 10px/18px var(--f-body);text-align:center;padding:0 4px;border:0;box-shadow:0 0 0 2px #fff}
.tick::before{content:"";position:absolute;right:100%;top:50%;width:14px;height:1.5px;background:var(--accent)}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:var(--accent);color:#fff;font:600 9.5px/1 var(--f-body);letter-spacing:.06em;padding:5px 6px 5px;border-radius:10px 10px 10px 2px;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap}
.pin::after{content:"";position:absolute;left:0;bottom:-5px;border:5px solid transparent;border-top-color:var(--accent);border-left-color:var(--accent)}
.sticky{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border:1px solid var(--sticky-edge);background:var(--sticky);border-radius:3px 3px 9px 3px;box-shadow:0 2px 5px rgba(0,0,0,.18);padding:0}
.sticky:hover,.pin:hover,.tick:hover{filter:brightness(1.06);transform-origin:center}
.pin.flash,.sticky.flash,.tick.flash{animation:ring 1.4s ease-out 2}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(230,70,38,.7)}100%{box-shadow:0 0 0 16px rgba(230,70,38,0)}}
.nopdf{max-width:640px;margin:20px auto;border:1px dashed var(--ink-3);border-radius:10px;padding:34px;text-align:center;background:var(--paper)}
.nopdf h2{font:500 24px/1.2 var(--f-display);margin:8px 0}
/* notes tab */
.nt{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;padding-block:32px 120px}
.nt h3{font:600 10.5px/1.2 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin:28px 0 10px}
.nt h3:first-child{margin-top:0}
.nt textarea.big{width:100%;min-height:340px;border:1px solid var(--rule);border-radius:8px;padding:16px 18px;background:var(--paper);font:400 16px/1.65 var(--f-display);resize:vertical;outline:0}
.nt textarea.big:focus,.nt textarea.small:focus,.nt input.small:focus{border-color:var(--accent)}
.nt textarea.small,.nt input.small{width:100%;border:1px solid var(--rule);border-radius:6px;padding:9px 11px;background:var(--paper);font-size:13.5px;resize:vertical;outline:0}
.preview{margin-top:14px;padding:16px 18px;border-left:2px solid var(--rule);font:400 15.5px/1.65 var(--f-display);color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.preview:empty{display:none}
.wl{color:var(--accent-ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}
.wl-missing{color:var(--ink-3);border-bottom:1px dashed var(--ink-3)}
.pl{color:var(--navy);text-decoration:underline dotted;cursor:pointer}
:root[data-theme="dark"] .pl{color:#9fb7e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pl{color:#9fb7e3}}
.alist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.alist li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:13px;cursor:pointer}
.alist li:hover{background:var(--rule-soft)}
.alist .pg{font:500 12px/1.5 var(--f-mono);color:var(--ink-3)}
.alist .k{font:600 9.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);display:block;margin-bottom:3px}
.alist .t{color:var(--ink-2);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.blank{font-size:13px;color:var(--ink-3)}
.fieldrow{display:grid;gap:6px;margin-bottom:14px}
.fieldrow label{font-size:12px;color:var(--ink-3)}
/* popover + toast */
.pop{position:fixed;z-index:60;width:min(340px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:0 18px 50px -12px rgba(0,0,0,.35);padding:14px}
.pop .ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pop .ph .eyebrow{flex:1}
.pop textarea,.pop input,.pop select{width:100%;border:1px solid var(--rule);border-radius:6px;padding:8px 10px;background:var(--paper);font-size:13.5px;outline:0}
.pop textarea{min-height:110px;resize:vertical;line-height:1.5}
.pop textarea:focus,.pop input:focus,.pop select:focus{border-color:var(--accent)}
.pop .pf{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:12px}
.pop .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pop label{font-size:11.5px;color:var(--ink-3);display:block;margin:8px 0 4px}
.pop .preview{margin-top:8px;padding:6px 0 0 10px;font-size:14px}
.pop.sticky-pop{background:var(--sticky);border-color:var(--sticky-edge)}
.pop.sticky-pop textarea{background:transparent;border-color:var(--sticky-edge)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.loading{padding:80px 0;color:var(--ink-3);text-align:center}
@media (max-width:900px){
  .lib-head{grid-template-columns:1fr}
  .lib-actions{align-items:flex-start}
  .lib-actions .row{justify-content:flex-start}
  .empty{grid-template-columns:1fr}
  .prow{grid-template-columns:auto}
  .mnotes{min-height:0}
  .mnote{position:relative!important;top:auto!important;margin-top:8px}
  .nt{grid-template-columns:1fr}
  .tool .lbl{display:none}
  .hint{margin-left:0;flex-basis:100%}
  .legend{margin-left:0}
}


/* GitHub version: setup screen and save status */
.setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;padding-block:56px 100px;align-items:start}
.setup h1{font:500 clamp(32px,4.4vw,46px)/1.05 var(--f-display);letter-spacing:-.015em;margin:10px 0 14px;text-wrap:balance}
.setup p{color:var(--ink-2);max-width:56ch}
.setup form{border:1px solid var(--rule);border-radius:10px;padding:26px;display:grid;gap:14px;background:var(--paper)}
.setup label{font-size:12px;color:var(--ink-3);display:block;margin-bottom:5px}
.setup input{width:100%;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--paper);font-size:14px;outline:0}
.setup input:focus{border-color:var(--accent)}
.setup .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.setup .err{color:var(--accent-ink);font-size:13.5px;min-height:1.2em}
.setup .note{font-size:12.5px;color:var(--ink-3)}
.steps{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;color:var(--ink-2);font-size:14px}
.steps li::before{counter-increment:s;content:counter(s);font:500 15px/1.45 var(--f-display);color:var(--accent-ink)}
.steps b{color:var(--ink);font-weight:500}
.steps code{font:13px var(--f-mono);background:var(--rule-soft);padding:1px 5px;border-radius:4px}
.steps a{color:var(--accent-ink)}
button.savestate{border:0;background:transparent;padding:4px 0;cursor:default}
button.savestate.act{cursor:pointer;color:var(--accent-ink);text-decoration:underline;text-underline-offset:3px}
.repo{font:12px var(--f-mono);color:var(--ink-3)}
@media (max-width:900px){.setup{grid-template-columns:1fr;gap:28px}.setup .two{grid-template-columns:1fr}}

/* colours, stickers, dragging */
.swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-left:10px;border-left:1px solid var(--rule)}
.swatches:empty{display:none}
.swl{font:600 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--rule);padding:0;cursor:pointer;transition:transform .12s}
.sw:hover{transform:scale(1.12)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.stkpick{width:34px;height:34px;border:1px solid transparent;border-radius:8px;background:transparent;padding:3px;cursor:pointer;transition:transform .12s}
.stkpick:hover{transform:scale(1.12) rotate(-4deg)}
.stkpick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash)}
.stkpick svg{width:100%;height:100%;display:block}
.popsw{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stkhead{width:26px;height:26px;flex:none}
.stkhead svg{width:100%;height:100%}
.stk{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));width:44px;height:44px;border:0;background:none;padding:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.22)) drop-shadow(0 6px 10px rgba(0,0,0,.14));touch-action:none;cursor:grab}
.stk svg{width:100%;height:100%;display:block;pointer-events:none}
.stk:hover{filter:drop-shadow(0 3px 3px rgba(0,0,0,.25)) drop-shadow(0 10px 16px rgba(0,0,0,.18))}
.stk.new{animation:stickon .38s cubic-bezier(.2,.9,.3,1.3)}
@keyframes stickon{0%{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(.3)}100%{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1)}}
.sticky,.pin{touch-action:none;cursor:grab}
.dragging{cursor:grabbing!important;opacity:.92;z-index:5}
.sticky{background:var(--nb,var(--sticky));border-color:var(--ne,var(--sticky-edge))}
.tick{background:var(--nk,var(--accent))}
.tick::before{background:var(--nk,var(--accent))}
.mnote{border-left-color:var(--nk,var(--accent));background:color-mix(in srgb,var(--nb,var(--paper)) 42%,var(--paper))}
.mnum{color:var(--nk,var(--accent-ink))}
.mtools{display:flex;flex-direction:column;gap:2px;align-items:center}
.mcol{width:14px;height:14px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--rule);background:var(--nk,var(--accent));padding:0;margin:4px;cursor:pointer;opacity:0;transition:opacity .12s}
.mnote:hover .mcol,.mnote:focus-within .mcol{opacity:1}
.pop.sticky-pop{background:var(--nb,var(--sticky));border-color:var(--ne,var(--sticky-edge));color:#16191d}
.pop.sticky-pop textarea{border-color:var(--ne,var(--sticky-edge));color:#16191d}
.pop.sticky-pop .eyebrow{color:#7a5a12}
.pop.sticky-pop .preview{color:#3d434b;border-left-color:var(--ne,var(--sticky-edge))}
@media (prefers-reduced-motion:reduce){.stk.new{animation:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mnote{background:color-mix(in srgb,var(--nb,var(--paper)) 12%,var(--paper))}}
:root[data-theme="dark"] .mnote{background:color-mix(in srgb,var(--nb,var(--paper)) 12%,var(--paper))}
.stk.wide{width:70px;height:70px}


/* *** AI-GENERATED — 28 October 2026 — Policy cl. 4.2 (code) ***
   Theme: a cool off-white page, black ink, a sturdy text serif for titles and a small humanist sans
   for everything else. Colour is kept for meaning (sourced values, bias direction, note colours);
   chrome is black, white and hairline grey. Cards and drop zones use dashed borders; markers are squares. */
:root{
  --paper:#fdfcff; --desk:#f5f5fb; --ink:#111111; --ink-2:#4b4b52; --ink-3:#767676;
  --rule:#e1e1e1; --rule-soft:#f0eff5; --dash:rgba(17,17,17,.2);
  --accent:#e64626; --accent-ink:#b8361c; --accent-wash:#fdebe6; --navy:#1a345e; --good:#2f6b4f;
  --sq:#e64626,#1a345e,#2f6b4f,#c99a1e,#7a3b8f,#3d7cc9,#111111; --sq-faint:#dcdbe3;
  --ease:cubic-bezier(.22,1,.36,1); --logo:var(--ink);
  --shadow:0 1px 2px rgba(17,17,17,.05),0 12px 30px -16px rgba(17,17,17,.28);
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Assistant","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e0e11;--desk:#17171c;--ink:#f1efe9;--ink-2:#b9b8bf;--ink-3:#8b8a92;--rule:#2c2c33;--rule-soft:#1c1c22;--dash:rgba(241,239,233,.22);
  --accent:#f0603f;--accent-ink:#f5866a;--accent-wash:#3a1d16;--navy:#2c4f86;--good:#6fbf98;
  --sq:#f0603f,#6d8fd0,#6fbf98,#e2b84a,#b07cc6,#5aa0e6,#f1efe9;--sq-faint:#2a2a31;--logo:#41ff78;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -16px rgba(0,0,0,.75)}}
:root[data-theme="dark"]{
  --paper:#0e0e11;--desk:#17171c;--ink:#f1efe9;--ink-2:#b9b8bf;--ink-3:#8b8a92;--rule:#2c2c33;--rule-soft:#1c1c22;--dash:rgba(241,239,233,.22);
  --accent:#f0603f;--accent-ink:#f5866a;--accent-wash:#3a1d16;--navy:#2c4f86;--good:#6fbf98;
  --sq:#f0603f,#6d8fd0,#6fbf98,#e2b84a,#b07cc6,#5aa0e6,#f1efe9;--sq-faint:#2a2a31;--logo:#41ff78;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 32px -16px rgba(0,0,0,.75)}
body{font:400 16px/1.55 var(--f-body)}
::selection{background:var(--accent-wash)}

/* header: logo left of the title, the eye collage beneath. It stays where it is while the rest
   of the page scrolls up over it. */
.brand{display:inline-flex;text-decoration:none;color:var(--logo)}
.brand svg{width:clamp(96px,9vw,132px);height:auto;display:block;overflow:visible}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--rule-soft);border-radius:999px;padding:6px 12px;font:600 12px/1 var(--f-body);color:var(--ink-2);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.pill:empty{display:none}
.pill::before{content:"";width:6px;height:6px;background:var(--good);flex:none}
body[data-view="paper"] .hero,body[data-view="note"] .hero{display:none}
.hero{position:sticky;top:0;z-index:0;padding-top:clamp(28px,6vh,72px)}
.hero-text{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:22px;align-items:end}
.hero-left{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:clamp(14px,2.4vh,26px);min-width:0}
.hero-left .brand{align-self:flex-end}
.hero-sub{margin:0 0 .55em;text-align:right;font:400 17px/1.45 var(--f-body);color:var(--ink-2)}
.hero-title{margin:0;font:400 clamp(44px,7vw,88px)/1.02 var(--f-display);letter-spacing:-.02em;color:var(--ink)}
.fovhost{position:relative;height:clamp(240px,40vh,440px);margin-top:clamp(20px,4vh,40px)}
.fovhost canvas{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;opacity:0;transition:opacity .9s var(--ease);-webkit-mask-image:linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 9%,#000 91%,transparent)}
.fovhost.ready canvas{opacity:1}
body{height:auto;min-height:100%}   /* a fixed-height body would stop the header sticking */
#main{position:relative;z-index:1;background:var(--paper)}
body:not([data-view="paper"]):not([data-view="note"]) #main{box-shadow:0 -1px 0 var(--rule),0 -22px 40px -26px rgba(17,17,17,.35);min-height:100vh}
@media (max-width:640px){
  .hero-text{grid-template-columns:1fr}
  .hero-left{display:contents}
  .hero-left .brand{order:0;margin-bottom:14px;align-self:start}
  .hero-title{order:1}
  .hero-sub{order:2;text-align:left;margin-top:12px}
}

/* type and chrome */
.eyebrow{font:600 12.5px/1.2 var(--f-body);letter-spacing:.01em;text-transform:none;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.eyebrow::before{content:"";width:7px;height:7px;background:var(--accent);flex:none}
.btn{border-radius:999px;padding:8px 16px;font:600 14px/1.2 var(--f-body);border-color:var(--rule);transition:border-color .18s,background .18s}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{filter:none;background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost:hover{background:var(--rule-soft)}
.savestate::before{border-radius:0}
.legend .dot{border-radius:0}
.lib-head{padding-block:28px 22px}
.lib-head p{font-size:15px}
.stats{gap:34px}
.stat .v{font:400 34px/1 var(--f-display)}
.stat .l{font:600 12.5px/1.2 var(--f-body);letter-spacing:.01em;text-transform:none;color:var(--ink-2);display:flex;align-items:center;gap:7px;margin-top:8px}
.stat .l::before{content:"";width:7px;height:7px;background:var(--sqc,var(--ink));flex:none}
.stat:nth-child(2) .l{--sqc:var(--navy)} .stat:nth-child(3) .l{--sqc:var(--good)}
.stat:nth-child(4) .l{--sqc:var(--accent)} .stat:nth-child(5) .l{--sqc:#c99a1e}
.toolbar{border-top:1px solid var(--ink)}
.search,.toolbar select{border-radius:999px}

/* ---------------- selectable text, copy and text highlights ----------------
   Each rendered page gets pdf.js's invisible text layer on top, so its words can be selected.
   - Read tool: select text, then use the small bar under it: Copy, or Highlight in a colour.
     Ctrl/Cmd+C also copies. Click a highlight to add a note, recolour, copy its text or remove it.
   - Highlight tool: drag across words to highlight them in the chosen colour. A drag that starts
     where there is no text (a figure, a margin) draws a freehand stroke as before.
   A text highlight is saved as boxes on the page plus the quoted text (annotation kind "texthl"); it
   is drawn with the pen strokes and included in Export with notes (its note in the notes column).
   Untested / fails quietly: scanned PDFs have no text to select (use the freehand highlighter);
   selection follows the PDF's own text order, so on some two-column or rotated layouts it can jump

   little high or low; touch screens use the browser's own long-press selection. */
async function buildTextLayer(page,row,W){
  const tl=row.querySelector(".textLayer"), lib=window["pdfjs-dist/build/pdf"];
  if(!tl||!lib||!lib.renderTextLayer||tl.dataset.done) return;
  tl.dataset.done="1";
  const vp=page.getViewport({scale:W/page.getViewport({scale:1}).width});
  tl.style.setProperty("--scale-factor",String(vp.scale));
  try{ await lib.renderTextLayer({textContentSource:page.streamTextContent(),container:tl,viewport:vp,textDivs:[]}).promise; }catch{return;}
  const end=document.createElement("div"); end.className="endOfContent"; tl.appendChild(end);

/* the current selection, split by page, as boxes in page fractions [x,y,w,h] plus the text */
function selectedOnPages(){
  const sel=window.getSelection(); if(!sel||sel.isCollapsed||!sel.rangeCount) return [];
  const range=sel.getRangeAt(0), out=[];
  for(const tl of document.querySelectorAll(".page .textLayer")){
    if(!range.intersectsNode(tl)) continue;
    const page=tl.closest(".page"), pr=page.getBoundingClientRect();
    const r=range.cloneRange();
    if(!tl.contains(r.startContainer)) r.setStart(tl,0);
    if(!tl.contains(r.endContainer)) r.setEnd(tl,tl.childNodes.length);

function mergeBoxes(list,pr){   // one box per run of text on a line
  const rs=list.map(q=>({l:q.left,t:q.top,r:q.right,b:q.bottom})).sort((a,b)=>a.t-b.t||a.l-b.l), out=[];
  for(const q of rs){

        keep.class="npin"; keep["data-paper"]=pid; keep.href="#paper-"+pid; const pg=c.getAttribute("data-page");

      else if(tag==="A"){const h=c.getAttribute("href")||""; if(/^(https?:|mailto:)/i.test(h)) keep.href=h;}
      if(tag==="IMG"){const s=c.getAttribute("data-src")||""; if(!s.startsWith(IMG_DIR)||!c.closest("figure.nfig")){c.remove();continue;} keep["data-src"]=s;}
      if(tag==="FIGURE"){ if(!c.classList.contains("nfig")){walk(c); c.replaceWith(...c.childNodes); continue;} keep.class="nfig"; }
      if(tag==="MARK"){const k=(c.className.match(/\bhl-(yellow|coral|mint|sky|lilac)\b/)||[])[0]; if(!k){walk(c); c.replaceWith(...c.childNodes); continue;} keep.class=k;}

const MIME={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp"};
async function loadNoteImage(img){

  if(IMGURL.has(path)){img.src=IMGURL.get(path);return;}
  img.closest("figure")?.classList.add("loading");
  try{ const bytes=await getRawBytes(path); const url=URL.createObjectURL(new Blob([bytes],{type:MIME[path.split(".").pop().toLowerCase()]||"image/png"})); IMGURL.set(path,url); img.src=url; }

function fixBlocks(b){

  if(!bad.length) return;

/* ---- pages ---- */
function pageGeometry(){
  const wrap=$("#npwrap"); if(!wrap) return null;
  const narrow=window.innerWidth<=900, avail=wrap.clientWidth-(narrow?0:292);
  const W=Math.round(Math.max(300,Math.min(720,avail))), k=W/720;
  const G={W,H:Math.round(W*1.48),GAP:34,MT:Math.round(92*k),MB:Math.round(80*k),ML:Math.round(88*k),MR:Math.round(88*k),narrow};
  G.CH=G.H-G.MT-G.MB; G.CW=G.W-G.ML-G.MR; return G;
}
function pageRowHtml(i){
  const even=i%2===0;
  const rh=i===1?`<div class="nfolio">${i}</div>`:`<div class="nrh${even?" ev":""}">${even?`<span class="fo">${i}</span><span class="rt" data-even="1"></span><span></span>`:`<span></span><span class="rt"></span><span class="fo">${i}</span>`}</div>`;
  return `<div class="prow" data-page="${i}"><div class="page npage" data-page="${i}">${rh}<canvas class="ink"></canvas><div class="layer"></div></div><aside class="margin"><div class="mhead">p. ${i}</div><div class="mnotes"></div></aside></div>`;
}
/* page size and the text column's place on page 1 */
function layoutPages(){
  const G=pageGeometry(), pages=$("#pages"), flow=$("#nflow"); if(!G||!pages||!flow) return;
  const changed=!NG||NG.W!==G.W||NG.narrow!==G.narrow; NG=G;
  const wrap=$("#npwrap"); wrap.style.setProperty("--pw",G.W+"px"); wrap.style.setProperty("--ph",G.H+"px"); wrap.style.setProperty("--pgch",G.CH+"px");
  wrap.style.setProperty("--mt",G.MT+"px"); wrap.style.setProperty("--ml",G.ML+"px"); wrap.style.setProperty("--mr",G.MR+"px"); wrap.style.setProperty("--mb",G.MB+"px");
  if(changed&&pageCount){ const n=pageCount; pageCount=0; setPageCount(n); }
  if(!pageCount) setPageCount(1);
  const p1=pages.querySelector('.page[data-page="1"]'), wr=wrap.getBoundingClientRect(), r=p1.getBoundingClientRect();
  flow.style.left=(r.left-wr.left+G.ML)+"px"; flow.style.top=(r.top-wr.top+G.MT)+"px"; flow.style.width=G.CW+"px";
}
function setPageCount(n){
  const pages=$("#pages"); if(!pages||!NG) return;
  if(n===pageCount&&pages.children.length===n) return;

function textLines(el){

  const rs=[...rg.getClientRects()].filter(r=>r.width>0.5&&r.height>0.5&&!sp.some(s=>Math.abs(s.top-r.top)<1&&Math.abs(s.height-r.height)<1)).sort((a,b)=>a.top-b.top);

    rg.selectNodeContents(t); const rs=rg.getClientRects(); if(!rs.length||rs[rs.length-1].bottom<=top+1) continue;
    let lo=0,hi=n-1;
    while(lo<hi){const mid=(lo+hi)>>1; rg.setStart(t,mid); rg.setEnd(t,mid+1); const r=rg.getBoundingClientRect(); if(r.height>0&&r.top>=top-1.5) hi=mid; else lo=mid+1;}
    rg.setStart(t,lo); rg.setEnd(t,lo+1); const r=rg.getBoundingClientRect(); if(r.top>=top-1.5) return [t,lo];
  }
  return null;
}
function pushBlock(el,target){
  let m=(parseFloat(getComputedStyle(el).marginTop)||0)+(target-el.getBoundingClientRect().top);
  el.style.marginTop=m+"px"; el.dataset.pgm="1";
  for(let t=0;t<3;t++){const d=target-el.getBoundingClientRect().top; if(Math.abs(d)<0.5) break; m+=d; el.style.marginTop=m+"px";}
}
function paginate(){
  clearTimeout(pagTimer); if(composing) return paginateSoon(400);
  const b=noteBody(), pages=$("#pages"), desk=$("#desk"); if(!b||!pages||!NG) return;
  const p1=pages.querySelector('.page[data-page="1"]'); if(!p1) return;
  for(const s of b.querySelectorAll(".pgsp")) s.remove();
  for(const e of b.querySelectorAll("[data-pgm]")){ e.style.marginTop=""; e.removeAttribute("data-pgm"); if(!e.getAttribute("style")) e.removeAttribute("style"); }
  b.normalize();   // the cursor (a live range) follows these changes
  const G=NG, pitch=G.H+G.GAP, P1=()=>p1.getBoundingClientRect().top;
  const start=k=>P1()+k*pitch+G.MT, end=k=>P1()+k*pitch+G.H-G.MB;
  const blocks=leafBlocks(b); let k=0;
  for(let i=0,guard=0,max=blocks.length*4+200;i<blocks.length&&guard<max;i++,guard++){
    const el=blocks[i], r=el.getBoundingClientRect(); if(r.height<0.5) continue;
    while(r.top>=end(k)-0.5) k++;
    if(k>0&&r.top>=end(k-1)-0.5&&r.top<start(k)-0.5){ pushBlock(el,start(k)); i--; continue; }   // starts in the gap between pages
    if(r.bottom<=end(k)+0.5) continue;
    const atomic=/^(H1|H2|H3|FIGURE)$/.test(el.tagName), lines=atomic?[]:textLines(el);
    const L=lines.findIndex(l=>l.bottom>end(k)+0.5);
    if(!atomic&&L<0) continue;                                             // only its spacing reaches past the page: fine
    if(atomic||L===0){
      if(r.top<=start(k)+1){ k++; continue; }                              // taller than a page: leave it
      let j=i; const prev=blocks[i-1];
      if(prev&&/^H[1-3]$/.test(prev.tagName)&&prev.getBoundingClientRect().top>start(k)+1) j=i-1;   // keep a heading with what follows
      pushBlock(blocks[j],start(k+1)); k++; i=j-1; continue;
    }
    const pos=charAtLine(el,lines[L].top); if(!pos){ k++; continue; }
    const lh=parseFloat(getComputedStyle(el).lineHeight)||((lines[L].bottom-lines[L].top)*1.4), lead=Math.max(0,(lh-(lines[L].bottom-lines[L].top))/2);
    const sp=document.createElement("span"); sp.className="pgsp"; sp.contentEditable="false"; sp.setAttribute("aria-hidden","true");
    let h=Math.min(pitch,Math.max(1,start(k+1)+lead-lines[L].top)); sp.style.height=h+"px";
    const rg=document.createRange(); rg.setStart(pos[0],pos[1]); rg.insertNode(sp);
    const firstAfter=()=>{ let n=sp.nextSibling; while(n&&n.nodeType===3&&!n.data.length) n=n.nextSibling; if(n&&n.nodeType===3){const cr=document.createRange(); cr.setStart(n,0); cr.setEnd(n,1); return cr.getBoundingClientRect().top;} return n&&n.getBoundingClientRect?n.getBoundingClientRect().top:null; };
    for(let t=0;t<2;t++){ const top=firstAfter(); if(top===null) break; const d=start(k+1)+lead-top; if(Math.abs(d)<0.5) break; h=Math.min(pitch,Math.max(1,h+d)); sp.style.height=h+"px"; }
    const now=firstAfter();
    if(now===null||now<start(k+1)-2){ sp.remove(); el.normalize(); k++; continue; }   // couldn't break this line cleanly: leave it rather than loop
    k++; i--;
  }
  const last=blocks.length?Math.max(...blocks.slice(-3).map(e=>e.getBoundingClientRect().bottom)):start(0);
  let need=Math.max(1,Math.floor((last-P1()-1)/pitch)+1);
  for(const a of annsOf(noteShellFor)) need=Math.max(need,a.page||1);   // keep pages that hold annotations
  setPageCount(Math.min(need,400)); updateNoteMeta();
}

/* ---- undo / redo (the page's own; spacers and image loading would confuse the browser's) ---- */
let hist=[],hpos=-1,histTimer=0;
function textOffset(root,node,off){const r=document.createRange(); r.selectNodeContents(root); try{r.setEnd(node,off);}catch{return 0;} return r.toString().length;}
function caretOffsets(){const b=noteBody(), s=getSelection(); if(!b||!s.rangeCount||!b.contains(s.anchorNode)) return null; const r=s.getRangeAt(0); return [textOffset(b,r.startContainer,r.startOffset),textOffset(b,r.endContainer,r.endOffset)];}
function pointAt(root,n){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let last=null; for(let t=w.nextNode();t;t=w.nextNode()){ if(n<=t.data.length) return [t,n]; n-=t.data.length; last=t; } return last?[last,last.data.length]:[root,0];}
function setCaretOffsets(c){const b=noteBody(); if(!b||!c) return; const s=getSelection(), r=document.createRange(); const a=pointAt(b,c[0]), z=pointAt(b,c[1]); try{r.setStart(a[0],a[1]); r.setEnd(z[0],z[1]); b.focus(); s.removeAllRanges(); s.addRange(r);}catch{}}
function histReset(){ hist=[]; hpos=-1; histSnap(); }
function histSnap(){ clearTimeout(histTimer); const b=noteBody(); if(!b) return; const html=cleanNoteHtml(b), c=caretOffsets();
  if(hist[hpos]&&hist[hpos].html===html){ if(c) hist[hpos].c=c; return; }
  hist=hist.slice(0,hpos+1); hist.push({html,c}); if(hist.length>200) hist.shift(); hpos=hist.length-1; }
function histSoon(){ clearTimeout(histTimer); histTimer=setTimeout(histSnap,600); }
function undoNote(dir){
  if(!S.canWrite) return; histSnap(); const j=hpos+dir; if(j<0||j>=hist.length) return;
  hpos=j; const st=hist[j], b=noteBody(); b.innerHTML=st.html; hydrateFigures(b); setCaretOffsets(st.c); afterNoteEdit({noSnap:true});
}

/* ---- pins to papers: "Link paper" → choose the paper → click the spot in its PDF → a pin in the note ----
   The pin (a small link showing the paper's label and page) opens the paper at that spot, marked
   for a few seconds. Papers without a PDF are linked without a spot. */
function pinPopHtml(q){
  const terms=parseQuery(q||""), list=papersSorted().filter(p=>!terms.length||terms.every(t=>(String(p.label||"")+" "+String(p.ref||"")).toLowerCase().includes(t))).slice(0,40);
  return `<div class="ph"><span class="eyebrow">Link a paper</span><button class="x" data-act="closepop" aria-label="Close">${ICON.x}</button></div>
    <input id="pinq" data-fkey="pinq" placeholder="Find a paper by label or reference" value="${esc(q||"")}" autocomplete="off" spellcheck="false">
    <ul class="pinlist">${list.length?list.map(p=>`<li><button type="button" class="pinpick" data-act="pinpick" data-paper="${p.id}"><b>${esc(p.label||"Untitled paper")}</b>${p.ref?`<small>${esc(String(p.ref).replace(/\s+/g," ").slice(0,110))}</small>`:""}<span class="pinhow">${p.pdf?"Pick the spot →":"No PDF: links the paper"}</span></button>${p.pdf?`<button type="button" class="linkbtn" data-act="pinnospot" data-paper="${p.id}" title="Link the paper without choosing a spot">No spot</button>`:""}</li>`).join(""):`<li class="blank">${S.papers.size?"No paper matches.":"Your library has no papers yet."}</li>`}</ul>`;
}
function insertPin(pp){
  const b=noteBody(), p=S.papers.get(pp.paper); if(!b||!p) return;
  histSnap(); setCaretOffsets(pp.c||[1e9,1e9]);
  const attrs=pp.page?` data-page="${pp.page}" data-x="${(+pp.x).toFixed(4)}" data-y="${(+pp.y).toFixed(4)}"`:"";
  document.execCommand("insertHTML",false,`<a class="npin" data-paper="${pp.paper}"${attrs} href="#paper-${pp.paper}">${esc((p.label||"Untitled paper")+(pp.page?`, p. ${pp.page}`:""))}</a>\u00a0`);
  afterNoteEdit(); saveNoteNow(); toast(`Linked ${p.label||"the paper"}${pp.page?`, p. ${pp.page}`:""}.`);
}

/* ---- highlighting words (the Highlight tool): <mark> in the text ---- */
function markSelection(color){
  const b=noteBody(), sel=getSelection(); if(!b||!sel.rangeCount||sel.isCollapsed) return 0;
  const range=sel.getRangeAt(0); if(!b.contains(range.commonAncestorContainer)) return 0;
  histSnap();
  const root=range.commonAncestorContainer.nodeType===3?range.commonAncestorContainer.parentNode:range.commonAncestorContainer;
  const nodes=[], w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  for(let t=w.nextNode();t;t=w.nextNode()) if(range.intersectsNode(t)&&!t.parentElement.closest(".pgsp,.flabel,.figdel")) nodes.push(t);
  let n=0;
  for(const t of nodes){
    let s=0,e=t.data.length; if(t===range.startContainer) s=range.startOffset; if(t===range.endContainer) e=range.endOffset;
    if(e<=s||!t.data.slice(s,e).trim()) continue;
    let mid=t; if(s>0) mid=t.splitText(s); if(e-s<mid.data.length) mid.splitText(e-s);
    const pm=mid.parentElement; if(pm.tagName==="MARK"&&pm.childNodes.length===1){ pm.className="hl-"+color; n++; continue; }
    const m=document.createElement("mark"); m.className="hl-"+color; mid.replaceWith(m); m.append(mid); n++;
  }
  sel.removeAllRanges(); afterNoteEdit(); return n;
}
function unmark(m){ histSnap(); const p=m.parentNode; m.replaceWith(...m.childNodes); p.normalize(); afterNoteEdit(); }

/* ---- find in this note ---- */
const nfind={q:"",ranges:[],cur:-1,t:0};
function runNoteFind(q,keep){
  const b=noteBody(); nfind.q=q; const terms=parseQuery(q);
  const ranges=[];
  if(b&&terms.length){ const w=document.createTreeWalker(b,NodeFilter.SHOW_TEXT);
    for(let t=w.nextNode();t;t=w.nextNode()){ if(t.parentElement.closest(".pgsp")) continue; const lc=t.data.toLowerCase();
      for(const x of terms){let i=lc.indexOf(x); while(i>=0){const r=document.createRange(); r.setStart(t,i); r.setEnd(t,i+x.length); ranges.push(r); i=lc.indexOf(x,i+x.length);}}}
    ranges.sort((a,c)=>a.compareBoundaryPoints(Range.START_TO_START,c)); }
  nfind.ranges=ranges; nfind.cur=ranges.length?(keep?Math.min(Math.max(0,nfind.cur),ranges.length-1):0):-1;
  paintNoteFind(!keep);
}
function paintNoteFind(scroll){
  const hl=window.CSS&&CSS.highlights&&window.Highlight;
  if(hl){ CSS.highlights.delete("notehit"); CSS.highlights.delete("notehitcur");
    if(nfind.ranges.length){ CSS.highlights.set("notehit",new Highlight(...nfind.ranges)); CSS.highlights.set("notehitcur",new Highlight(nfind.ranges[nfind.cur])); } }
  const c=$("#nfcount"); if(c) c.textContent=!nfind.q.trim()?"":nfind.ranges.length?`${nfind.cur+1} of ${nfind.ranges.length}`:(parseQuery(nfind.q).length?"No matches":"");
  if(scroll&&nfind.ranges.length){ const r=nfind.ranges[nfind.cur].getBoundingClientRect(); window.scrollBy({top:r.top-window.innerHeight*0.4,behavior:"smooth"}); }
}
function stepNoteFind(d){ if(!nfind.ranges.length) return; nfind.cur=(nfind.cur+d+nfind.ranges.length)%nfind.ranges.length; paintNoteFind(true); }
function clearNoteFind(){ nfind.q=""; nfind.ranges=[]; nfind.cur=-1; const f=$("#nfind"); if(f) f.value=""; paintNoteFind(false); }
function markNoteHits(terms){ const f=$("#nfind"); if(f){ f.value=terms.join(" "); runNoteFind(f.value); } }

/* images → figures */
function shrinkImage(file){
  return new Promise(res=>{
    if(file.type==="image/gif"){file.arrayBuffer().then(b=>res({bytes:new Uint8Array(b),ext:"gif"}));return;}
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=async()=>{
      const MAXW=2400, ext=file.type==="image/png"?"png":file.type==="image/webp"?"webp":"jpg";
      if(im.naturalWidth<=MAXW){URL.revokeObjectURL(url); res({bytes:new Uint8Array(await file.arrayBuffer()),ext}); return;}
      const c=document.createElement("canvas"); c.width=MAXW; c.height=Math.round(im.naturalHeight*MAXW/im.naturalWidth);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(async b=>res({bytes:new Uint8Array(await b.arrayBuffer()),ext:ext==="png"?"png":"jpg"}),ext==="png"?"image/png":"image/jpeg",0.9);
    };
    im.onerror=()=>{URL.revokeObjectURL(url); res(null);};
    im.src=url;
  });
}
async function insertFigure(file){
  if(!S.canWrite) return;
  if(!S.repoPrivate){toast("Make the data repository private before adding images.",4000);return;}
  if(!/^image\/(png|jpe?g|gif|webp)$/.test(file.type)){toast("Use a PNG, JPEG, GIF or WebP image.");return;}
  const got=await shrinkImage(file); if(!got){toast("That image couldn’t be read.");return;}
  if(got.bytes.length>25*1024*1024){toast("That image is over 25 MB.");return;}
  const nid=noteShellFor, path=IMG_DIR+nid+"-"+uid("f")+"."+got.ext;
  IMGURL.set(path,URL.createObjectURL(new Blob([got.bytes],{type:MIME[got.ext]})));
  histSnap(); restoreNoteRange();
  document.execCommand("insertHTML",false,figureHtml(path)+"<p><br></p>");
  const b=noteBody(); hydrateFigures(b);
  const fig=[...b.querySelectorAll("figure.nfig")].find(f=>f.querySelector("img")?.dataset.src===path);
  if(fig){ fig.classList.add("uploading"); fig.querySelector(".ftitle")?.focus(); }
  afterNoteEdit(); saveNoteNow();
  try{ await putFile(path,b64FromBytes(got.bytes),`Add image to note: ${S.notes.get(nid)?.title||"Untitled note"}`); fig?.classList.remove("uploading"); }
  catch(e){ fig?.classList.remove("uploading"); fig?.classList.add("missing"); toast(`The image didn’t upload: ${e instanceof GhError?ghReason(e):"try again"}.`,5000); }
}
function onNotePaste(ev){
  const cd=ev.clipboardData; if(!cd) return;
  const files=[...cd.files].filter(f=>f.type.startsWith("image/"));
  ev.preventDefault(); histSnap();
  if(files.length&&!ev.target.closest(".ftitle,.fcap")){ files.forEach(insertFigure); return; }
  const html=cd.getData("text/html"), text=cd.getData("text/plain");
  if(html&&!ev.target.closest(".ftitle,.fcap")) document.execCommand("insertHTML",false,sanitizeNoteHtml(html).replace(/<figure[\s\S]*?<\/figure>/g,m=>/data-src=/.test(m)?m:""));
  else document.execCommand("insertText",false,text);
  afterNoteEdit();
}
function onNoteDrop(ev){
  const files=[...(ev.dataTransfer?.files||[])].filter(f=>f.type.startsWith("image/")); if(!files.length) return;
  ev.preventDefault();
  if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(ev.clientX,ev.clientY); if(r&&noteBody().contains(r.startContainer)) noteRange=r;}
  files.forEach(insertFigure);
}
async function deleteNote(id){
  const n=S.notes.get(id); if(!n) return;
  const paths=[...String(n.html||"").matchAll(/data-src="([^"]+)"/g)].map(m=>m[1]).filter(p=>p.startsWith(IMG_DIR));
  for(const a of annsOf(id)) await removeDoc("anns",a.id);
  await removeDoc("notes",id); saveNow();
  for(const p of paths) deleteFile(p,null,`Remove image of deleted note: ${n.title||"Untitled note"}`).catch(()=>{});
  toast(`Deleted ${n.title||"the note"}.`);
  if(location.hash==="#notes") render(); else location.hash="notes";
}

document.addEventListener("click",ev=>{
  const t=ev.target.closest("[data-act],[data-cmd]"); if(!t) return;
  if(t.dataset.cmd){ if(!noteBody()) return; const c=t.dataset.cmd;
    if(c==="undo"||c==="redo"){ undoNote(c==="undo"?-1:1); return; }
    histSnap(); restoreNoteRange(); document.execCommand(c,false,null); afterNoteEdit(); return; }
  const act=t.dataset.act;
  if(act==="newnote"){ if(!S.canWrite) return; const id=uid("n"); put("notes",id,{title:"",html:"<p><br></p>",createdAt:Date.now()}); S.tool="read"; location.hash="note-"+id; }
  else if(act==="gonote"){ const terms=parseQuery(S.noteFilter||S.filter||""); S.noteHit=terms.length?terms:null; S.tool="read"; }
  else if(act==="delnote"){
    if(!t.classList.contains("arm")){t.classList.add("arm"); t.textContent="Delete for good?"; return;}
    deleteNote(t.dataset.id);
  }
  else if(act==="nimg") $("#nimgpick")?.click();
  else if(act==="figdel"){
    if(!t.classList.contains("arm")){t.classList.add("arm"); t.title="Click again to remove the figure"; return;}
    histSnap(); t.closest("figure")?.remove(); afterNoteEdit();
  }
  else if(act==="outline"){ const h=[...noteBody().querySelectorAll("h1,h2,h3")].filter(h=>h.textContent.trim())[+t.dataset.i]; if(h) h.scrollIntoView({block:"start",behavior:"smooth"}); }
  else if(act==="npin"){ ev.stopPropagation(); S.pinCaret=caretOffsets(); openPop(t,pinPopHtml(""),"pinpop"); setTimeout(()=>$("#pinq")?.focus(),30); }
  else if(act==="pinpick"||act==="pinnospot"){
    const pid=t.dataset.paper, p=S.papers.get(pid); closePop(); if(!p) return;
    if(act==="pinpick"&&p.pdf){ saveNoteNow(); S.pickSpot={nid:noteShellFor,c:S.pinCaret,pid}; S.tab="pages"; S.tool="read"; S.pendingEvidence=null; location.hash="paper-"+pid; }
    else insertPin({nid:noteShellFor,c:S.pinCaret,paper:pid});
  }
  else if(act==="nfnext") stepNoteFind(1);
  else if(act==="nfprev") stepNoteFind(-1);
  else if(act==="nfclear") clearNoteFind();
});
document.addEventListener("mousedown",ev=>{ if(ev.target.closest(".ntools .nt")) ev.preventDefault(); });   // keep the text selection
/* a pin in a note opens its paper at the spot */
document.addEventListener("click",ev=>{
  const a=ev.target.closest&&ev.target.closest("#nbody a.npin"); if(!a) return; ev.preventDefault(); ev.stopImmediatePropagation();
  if(!S.papers.has(a.dataset.paper)){ toast("That paper was deleted."); return; }
  S.focusSpot=a.dataset.page?{page:+a.dataset.page,x:+a.dataset.x||0.5,y:+a.dataset.y||0}:null; S.tab="pages"; S.tool="read";

},true);
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="nstyle"){ noteBlock(el.value); }
  else if(el.id==="nimgpick"){ const fs=[...el.files]; el.value=""; (async()=>{for(const f of fs) await insertFigure(f);})(); }
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="notefilter"){ S.noteFilter=el.value; renderNotesPage(); return; }
  if(el.id==="nfind"){ runNoteFind(el.value); return; }

  if(el.id==="ntitle"){ autoTitle(); const n=S.notes.get(noteShellFor); if(n&&S.canWrite){ put("notes",noteShellFor,{...n,title:el.value.replace(/\n/g," ")}); noteLoadedAt=S.notes.get(noteShellFor).updatedAt; document.title=(el.value||"Untitled note")+" · Foveal Bias Library"; updateNoteMeta(); paginateSoon(); } return; }
  if(el.closest&&el.closest("#nbody")){
    const cap=el.closest(".ftitle,.fcap"); if(cap&&!cap.textContent.trim()&&cap.innerHTML) cap.innerHTML="";

});
document.addEventListener("beforeinput",ev=>{ if(ev.target.closest&&ev.target.closest("#nbody")&&(ev.inputType==="historyUndo"||ev.inputType==="historyRedo")){ ev.preventDefault(); undoNote(ev.inputType==="historyUndo"?-1:1); } });
document.addEventListener("selectionchange",()=>{ if(S.view.name==="note") syncNoteTools(); });
document.addEventListener("keydown",ev=>{
  if(S.view.name!=="note") return;
  const el=ev.target, mod=ev.metaKey||ev.ctrlKey;
  if(mod&&!ev.altKey&&ev.key.toLowerCase()==="f"){ ev.preventDefault(); const f=$("#nfind"); if(f){f.focus(); f.select();} return; }
  if(el.id==="nfind"){ if(ev.key==="Enter"){ev.preventDefault(); stepNoteFind(ev.shiftKey?-1:1);} else if(ev.key==="Escape"){ clearNoteFind(); el.blur(); } return; }
  if(el.id==="ntitle"&&ev.key==="Enter"){ ev.preventDefault(); const b=noteBody(); b.focus(); const r=document.createRange(); const first=b.firstElementChild||b; r.setStart(first,0); r.collapse(true); getSelection().removeAllRanges(); getSelection().addRange(r); return; }
  if(!el.closest||!el.closest("#nbody")) return;
  if(mod&&ev.key.toLowerCase()==="z"){ ev.preventDefault(); undoNote(ev.shiftKey?1:-1); return; }
  if(mod&&ev.key.toLowerCase()==="y"){ ev.preventDefault(); undoNote(1); return; }
  if(ev.key==="Enter"&&el.closest(".ftitle")){ ev.preventDefault(); el.closest("figure").querySelector(".fcap")?.focus(); return; }
  if(ev.key==="Enter"&&el.closest(".fcap")){ ev.preventDefault(); const f=el.closest("figure"); let nx=f.nextElementSibling; if(!nx){nx=document.createElement("p"); nx.innerHTML="<br>"; f.after(nx);} const b=noteBody(); b.focus(); const r=document.createRange(); r.setStart(nx,0); r.collapse(true); getSelection().removeAllRanges(); getSelection().addRange(r); return; }
  if(mod&&ev.altKey&&/^Digit[0-3]$/.test(ev.code)){ ev.preventDefault(); noteBlock(["p","h1","h2","h3"][+ev.code.slice(5)]); return; }
  if(mod&&ev.shiftKey&&(ev.code==="Digit7"||ev.code==="Digit8")){ ev.preventDefault(); histSnap(); document.execCommand(ev.code==="Digit7"?"insertOrderedList":"insertUnorderedList"); afterNoteEdit(); return; }
  // at the top of a page, Backspace deletes the previous character, not the invisible page break
  if(ev.key==="Backspace"||ev.key==="Delete"){ const s=getSelection(); if(s.isCollapsed&&s.rangeCount){ const r=s.getRangeAt(0);
    const sib=ev.key==="Backspace"?(r.startOffset===0?prevNode(r.startContainer):(r.startContainer.nodeType===1?r.startContainer.childNodes[r.startOffset-1]:null)):(r.startContainer.nodeType===3&&r.startOffset<r.startContainer.data.length?null:nextNode(r.startContainer,r.startOffset));
    if(sib&&sib.nodeType===1&&sib.classList.contains("pgsp")){ const nr=document.createRange(); if(ev.key==="Backspace") nr.setStartBefore(sib); else nr.setStartAfter(sib); nr.collapse(true); s.removeAllRanges(); s.addRange(nr); } } }
});
function prevNode(n){ while(n&&!n.previousSibling&&n.parentNode&&n.parentNode.id!=="nbody") n=n.parentNode; return n&&n.previousSibling; }

function papersSorted(){

/* Lookups by paper and by row, rebuilt only when the data changes (S.dataVer), so drawing the table

function idx(){

function paperByLabel(label){const l=String(label).trim().toLowerCase();for(const [id,p] of S.papers) if(String(p.label||"").trim().toLowerCase()===l) return id;return null;}

/* ---------------- GitHub API ---------------- */
const enc=new TextEncoder(), dec=new TextDecoder();
function b64FromBytes(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s);}
function bytesFromB64(b64){const s=atob(b64.replace(/\s/g,""));const out=new Uint8Array(s.length);for(let i=0;i<s.length;i++) out[i]=s.charCodeAt(i);return out;}
const encPath=p=>p.split("/").map(encodeURIComponent).join("/");
class GhError extends Error{constructor(status,msg){super(msg);this.status=status;}}
async function gh(path,opts={}){
  const c=S.cfg;
  let res;
  try{
    res=await fetch("https://api.github.com"+path,{...opts,cache:"no-store",headers:{
      "Accept":"application/vnd.github+json","Authorization":"Bearer "+c.token,"X-GitHub-Api-Version":"2022-11-28",...(opts.headers||{})}});
  }catch(e){throw new GhError(0,"network");}
  return res;
}
async function ghJson(path,opts){const res=await gh(path,opts);if(res.status===404) return null;if(!res.ok) throw new GhError(res.status,await res.text().catch(()=>""));return res.json();}
const contentsUrl=p=>`/repos/${encodeURIComponent(S.cfg.owner)}/${encodeURIComponent(S.cfg.repo)}/contents/${encPath(p)}`;
async function getRawBytes(path){
  const res=await gh(contentsUrl(path)+"?ref="+encodeURIComponent(S.cfg.branch),{headers:{"Accept":"application/vnd.github.raw"}});
  if(!res.ok) throw new GhError(res.status,"raw");
  return new Uint8Array(await res.arrayBuffer());
}
async function getDataFile(useEtag){
  const headers=useEtag&&S.etag?{"If-None-Match":S.etag}:{};
  const res=await gh(contentsUrl(DATA_PATH)+"?ref="+encodeURIComponent(S.cfg.branch),{headers});
  if(res.status===304) return {unchanged:true};
  if(res.status===404) return {missing:true};
  if(!res.ok) throw new GhError(res.status,await res.text().catch(()=>""));
  const etag=res.headers.get("ETag"); const meta=await res.json();
  let text;
  if(meta.content&&meta.encoding==="base64") text=dec.decode(bytesFromB64(meta.content));
  else text=dec.decode(await getRawBytes(DATA_PATH));
  return {sha:meta.sha,etag,data:JSON.parse(text)};
}
async function putFile(path,b64,message,sha){
  const body={message,content:b64,branch:S.cfg.branch}; if(sha) body.sha=sha;
  const res=await gh(contentsUrl(path),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok) throw new GhError(res.status,await res.text().catch(()=>""));
  return res.json();
}
async function deleteFile(path,sha,message){
  if(!sha){const meta=await ghJson(contentsUrl(path)+"?ref="+encodeURIComponent(S.cfg.branch));if(!meta) return;sha=meta.sha;}
  const res=await gh(contentsUrl(path),{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,sha,branch:S.cfg.branch})});
  if(!res.ok&&res.status!==404) throw new GhError(res.status,"delete");
}
function ghReason(e){
  const s=e&&e.status;
  if(s===0) return "No connection to GitHub.";
  if(s===401) return "GitHub didn’t accept the token. It may have expired; add a new one in Settings.";
  if(s===403) return "GitHub refused the request. Check the token has Contents: Read and write on this repository.";
  if(s===404) return "Repository not found, or the token can’t see it.";
  if(s===409||s===422) return "The library changed on GitHub at the same time.";
  if(s===413) return "That file is too large for GitHub.";
  return "GitHub returned an error ("+s+").";
}

/* ---------------- data model, merge, cache ---------------- */
function serialize(){
  return {format:"foveal-bias-library",version:1,savedAt:new Date().toISOString(),
    papers:Object.fromEntries(S.papers),rows:Object.fromEntries(S.rows),anns:Object.fromEntries(S.anns),
    tags:Object.fromEntries(S.tags),cols:Object.fromEntries(S.cols),todos:Object.fromEntries(S.todos),notes:Object.fromEntries(S.notes),deleted:S.deleted};   // todos: front-page items (29–30 Oct 2026)
}
function applyData(D){
  S.papers=new Map(Object.entries(D.papers||{}));
  S.rows=new Map(Object.entries(D.rows||{}));
  S.anns=new Map(Object.entries(D.anns||{}));
  S.tags=new Map(Object.entries(D.tags||{}));
  S.cols=new Map(Object.entries(D.cols||{}));
  S.todos=new Map(Object.entries(D.todos||{}));
  S.notes=new Map(Object.entries(D.notes||{}));
  S.deleted={...(D.deleted||{})}; S.dataVer++;
  syncFields();
}
/* Newer edit wins, per paper/row/annotation. A deletion wins over any edit made before it. */
function merge(a,b){
  const out={papers:{},rows:{},anns:{},tags:{},cols:{},todos:{},notes:{},deleted:{}};
  for(const [k,t] of Object.entries({...(a.deleted||{}),...(b.deleted||{})})) out.deleted[k]=Math.max((a.deleted||{})[k]||0,(b.deleted||{})[k]||0,t);
  for(const col of ["papers","rows","anns","tags","cols","todos","notes"]){
    const A=a[col]||{},B=b[col]||{};
    for(const id of new Set([...Object.keys(A),...Object.keys(B)])){
      const x=A[id],y=B[id]; const doc=!x?y:!y?x:((y.updatedAt||0)>=(x.updatedAt||0)?y:x);
      const del=out.deleted[col+"/"+id]||0;
      if(doc&&!(del&&del>=(doc.updatedAt||0))) out[col][id]=doc;
    }
  }
  return out;
}
let cacheTimer=null;
function cacheLocal(){clearTimeout(cacheTimer);cacheTimer=setTimeout(()=>{if(!S.cfg) return;const ok=lsSet(LS_CACHE(S.cfg),{dirty:S.rev>S.savedRev,data:serialize()});if(!ok&&S.rev>S.savedRev) toast("This browser couldn’t keep a backup copy. Save to GitHub before closing.",4000);},400);}

/* ---------------- editing API used by the UI ---------------- */
function put(col,id,data){
  if(!S.canWrite) return;
  S[col].set(id,{...data,updatedAt:Date.now()}); S.dataVer++;
  markDirty();
}
async function removeDoc(col,id){
  if(!S.canWrite) return;
  S[col].delete(id); S.deleted[col+"/"+id]=Date.now(); S.dataVer++; markDirty();
}
let saveTimer=null, firstDirtyAt=0;
function markDirty(){
  S.rev++; S.saveErr=null; cacheLocal();
  const now=Date.now(); if(!firstDirtyAt) firstDirtyAt=now;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,Math.min(SAVE_DELAY,Math.max(0,firstDirtyAt+SAVE_MAX_WAIT-now)));
  setSaveState();
}
async function saveNow(){
  clearTimeout(saveTimer); saveTimer=null;
  if(!S.connected||!S.canWrite) return;
  if(S.saving){S.saveAgain=true;return;}
  if(S.rev===S.savedRev){setSaveState();return;}
  S.saving=true; setSaveState();
  let attempt=0;
  while(true){
    const rev=S.rev;
    const json=JSON.stringify(serialize(),null,1);
    try{
      const res=await putFile(DATA_PATH,b64FromBytes(enc.encode(json)),"Library: update notes",S.dataSha);
      S.dataSha=res.content.sha; S.etag=null; S.savedRev=rev; S.lastSaved=Date.now(); firstDirtyAt=S.rev>rev?Date.now():0;
      break;
    }catch(e){
      if((e.status===409||e.status===422)&&attempt<2){
        attempt++;
        try{const remote=await getDataFile(false); if(remote.data){applyData(merge(remote.data,serialize()));S.dataSha=remote.sha;scheduleRender();} else S.dataSha=null; continue;}
        catch(e2){S.saveErr=ghReason(e2);break;}
      }
      S.saveErr=ghReason(e);
      if(e.status===0){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,30000);}
      break;
    }
  }
  S.saving=false; cacheLocal(); setSaveState();
  if(S.saveAgain||(S.rev>S.savedRev&&!S.saveErr&&!saveTimer)){S.saveAgain=false;saveTimer=setTimeout(saveNow,SAVE_DELAY);}
}
function setSaveState(){
  for(const el of $$(".savestate")){
    let txt, act=false, cls="";
    if(!S.connected){txt="Not connected";cls="off";}
    else if(!S.canWrite){txt="Read only";cls="off";}
    else if(S.saving){txt="Saving to GitHub…";cls="saving";}
    else if(S.saveErr){txt="Not saved: "+S.saveErr+" Retry";cls="saving";act=true;}
    else if(S.rev>S.savedRev){txt="Unsaved changes · Save now";cls="saving";act=true;}
    else {txt=S.lastSaved?"Saved to GitHub "+ago(S.lastSaved):"Up to date with GitHub";}
    el.className="savestate "+cls+(act?" act":""); el.textContent=txt; el.dataset.act=act?"savenow":""; el.title=act?"Save to GitHub now (Ctrl/Cmd+S)":"";
  }
}
setInterval(setSaveState,30000);

/* ---------------- connect, load, poll ---------------- */
async function connect(cfg){
  S.cfg={owner:cfg.owner.trim(),repo:cfg.repo.trim(),branch:(cfg.branch||"").trim(),token:cfg.token.trim()};
  const repo=await ghJson(`/repos/${encodeURIComponent(S.cfg.owner)}/${encodeURIComponent(S.cfg.repo)}`);
  if(!repo) throw new GhError(404,"repo");
  S.cfg.branch=S.cfg.branch||repo.default_branch||"main";
  S.repoPrivate=!!repo.private;
  S.canWrite=!!(repo.permissions&&repo.permissions.push);
  lsSet(LS_CFG,S.cfg);
  const remote=await getDataFile(false).catch(e=>{if(e.status===409) return {missing:true};throw e;});
  const cache=lsGet(LS_CACHE(S.cfg));
  let D=remote.data||{papers:{},rows:{},anns:{},deleted:{}};
  S.dataSha=remote.sha||null; S.etag=remote.etag||null;
  if(cache&&cache.dirty&&cache.data){D=merge(D,cache.data);applyData(D);S.connected=true;S.loaded=true;markDirty();toast("Recovered changes from this browser that hadn’t reached GitHub. Saving them now.",4500);}
  else {applyData(D);S.connected=true;S.loaded=true;S.lastSaved=null;}
  setSaveState();
}
async function poll(){
  if(!S.connected||S.saving||S.rev>S.savedRev||document.visibilityState!=="visible") return;
  try{
    const r=await getDataFile(true);
    if(r.unchanged||r.missing) return;
    if(S.saving||S.rev>S.savedRev) return;
    if(r.sha!==S.dataSha){applyData(r.data);S.dataSha=r.sha;S.etag=r.etag;cacheLocal();scheduleRender();toast("Updated with changes from another device.");}
    else S.etag=r.etag;
  }catch{}
}
setInterval(poll,POLL_MS);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") poll();});

/* ---------------- library ----------------
   AI-GENERATED — 29 October 2026 — Policy cl. 4.2 (code). Two pages:
   - front page (no address after the #): the photos, small counts and the Import / Add / Export /

function countsHtml(papers,noTodos){
  const inView=new Set(papers.map(p=>p.id));
  const nRows=[...S.rows.values()].filter(r=>inView.has(r.paper)).length;
  const viewAnns=[...S.anns.values()].filter(a=>inView.has(a.paper));
  const nSrc=viewAnns.filter(a=>a.kind==="evidence").length, nNotes=viewAnns.filter(a=>a.kind!=="ink"&&a.kind!=="evidence"&&a.kind!=="texthl").length;
  const nDone=papers.filter(p=>p.status==="Extracted").length, nTodo=papers.reduce((n,p)=>n+openTodos(p.id),0);
  const bits=[[papers.length,"paper","papers"],[nRows,"experiment","experiments"],[nDone,"extracted","extracted"],[nSrc,"sourced value","sourced values"],[nNotes,"note","notes"]];
  if(nTodo&&!noTodos) bits.push([nTodo,"to-do open","to-dos open"]);   // the front page has the list itself
  return `<p class="counts">${bits.map(([n,one,many])=>`<span><b>${n}</b> ${n===1?one:many}</span>`).join("")}</p>`;
}

  return `<div class="wrap"><section class="empty">
      <div>
        <div class="eyebrow">Start here</div>
        <h2>Import your first paper</h2>
        <p class="muted">Each PDF becomes a page you can read and annotate, and a group in the summary table. Changes are committed to your repository a few seconds after you stop typing.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px">
          ${canPdf?`<button class="btn primary" data-act="import">${ICON.upload}Import PDFs</button>`:""}
          ${can?`<button class="btn" data-act="addpaper">${ICON.plus}Add paper without PDF</button>`:""}
        </div>
      </div>
      <ol>
        <li><span><b>Fill the table as you read.</b> One row per experiment: eccentricities, stimulus, response method, reference objects, delay, and the size and direction of the bias.</span></li>
        <li><span><b>Pin each value to its source.</b> Hover a cell and click the pin, then click the spot in the PDF. The cell turns ochre and opens that spot when clicked.</span></li>
        <li><span><b>Annotate the page.</b> Numbered margin notes, sticky notes, stickers, a pen and a highlighter.</span></li>

      </ol>
    </section></div>`;
}
function renderLibrary(){
  const main=$("#main"); setView("library");
  const open=openTag();
  if(open===NOTES_TAG){ renderNotesPage(); return; }
  if(!open){   // front page
    document.title="Foveal Bias Library";
    const html=`<div class="wrap"><header class="lib-head front">${countsHtml(papersSorted(),true)}${libActions()}</header>${homeTodosHtml()}</div>`+(S.papers.size?"":emptyLibraryHtml());
    keepFocus(main,()=>{main.innerHTML=html;});
    setSaveState(); updateTagTiles(); return;
  }
  const tagName=open===ALL_TAG?"All literature":(S.tags.get(open)?.name||"");
  document.title=tagName+" · Foveal Bias Library";
  const allPapers=papersSorted(), papers=allPapers.filter(inTag);
  const q=S.filter.trim(), searching=q.length>=2, mode=S.libMode==="table"?"table":"list", can=S.canWrite;
  const head=`
  <div class="wrap">
    <header class="tag-head">
      <div class="th-top"><a class="back" href="#">${ICON.back}All tags</a><button class="savestate"></button></div>
      <h2 class="tag-title">${esc(tagName)}</h2>
      ${countsHtml(papers)}
    </header>
    <div class="toolbar">
      <div class="viewseg" role="group" aria-label="Show">${[["list","Papers"],["table","Summary table"]].map(([m,l])=>`<button data-act="libmode" data-mode="${m}" aria-pressed="${mode===m}">${l}</button>`).join("")}</div>
      <div class="search">${ICON.search}<input id="filter" data-fkey="filter" type="search" placeholder="Search papers, PDFs and notes" value="${esc(S.filter)}" aria-label="Search papers, PDFs and notes" autocomplete="off" spellcheck="false">${S.filter?`<button class="x" data-act="clearsearch" aria-label="Clear search">${ICON.x}</button>`:""}</div>
      <label for="sort">Sort</label>
      <select id="sort" data-fkey="sort">
        ${[["year","Year in label"],["label","Label A–Z"],["status","Reading status"],["added","Date added"]].map(([v,l])=>`<option value="${v}" ${S.sort===v?"selected":""}>${l}</option>`).join("")}
      </select>
      ${mode==="table"&&!searching?`<span class="legend"><span class="dots" aria-hidden="true">${PIN_COLORS.slice(0,4).map(c=>`<i style="background:${c}"></i>`).join("")}</span>Pin: value linked to its source in the PDF (colour = column)</span>`:""}
    </div>
  </div>`;
  let body="";
  if(searching&&allPapers.length) body=searchView(q);
  else if(!allPapers.length) body=emptyLibraryHtml();
  else if(!papers.length) body=`<div class="wrap"><p class="blank" style="padding:28px 0 80px">No papers are tagged “${esc(tagName)}” yet. Open a paper and use Tags at the top to add it.</p></div>`;
  else if(mode==="list") body=paperListHtml(papers,open);
  else body=summaryTableHtml(papers,open);
  keepFocus(main,()=>{main.innerHTML=head+body;});
  setSaveState(); updateTagTiles();
  if(S.flashRow){
    const tr=main.querySelector(`tr[data-row="${S.flashRow}"]`); S.flashRow=null;
    if(tr){tr.scrollIntoView({block:"center",behavior:"smooth"});tr.classList.add("flash");}
  }
}

  return `<div class="wrap"><ol class="plist">${papers.map(p=>{
    const pa=annsOf(p.id), nr=rowsOf(p.id).length;
    const nn=pa.filter(a=>a.kind!=="ink"&&a.kind!=="evidence"&&a.kind!=="texthl").length, ns=pa.filter(a=>a.kind==="evidence").length, nt=openTodos(p.id);
    const sub=String(p.ref||"").trim()||String(p.notes||"").trim();
    return `<li class="pitem">
      <div class="pmain">
        <a class="plabel" href="#paper-${p.id}">${esc(p.label||"Untitled paper")}</a>
        ${sub?`<p class="psub">${esc(sub.replace(/\s+/g," ").slice(0,320))}</p>`:""}
        <div class="pmeta">
          <select class="chip" data-v="${esc(p.status||"To read")}" data-paper="${p.id}" data-pk="status" data-fkey="st:${p.id}" aria-label="Reading status" ${can?"":"disabled"}>${STATUSES.map(s=>`<option ${s===(p.status||"To read")?"selected":""}>${s}</option>`).join("")}</select>

          ${nt?`<a class="todocount" href="#paper-${p.id}" data-act="opentodo" data-paper="${p.id}">${nt} to-do${nt===1?"":"s"} open</a>`:""}
        </div>
      </div>
      <div class="pacts"><a class="linkbtn open" href="#paper-${p.id}">Open</a>${can?`<button class="linkbtn pdel" data-act="delpaper" data-paper="${p.id}" title="Delete this paper, its notes and its PDF">Delete</button>`:""}</div>
    </li>`;}).join("")}</ol></div>`;
}
function summaryTableHtml(shown,tagId){
  const can=S.canWrite;
  const cols=FIELDS.map(f=>`<col style="width:${f.w||110}px">`).join("")+`<col style="width:64px">`;
  const th=FIELDS.map(f=>`<th scope="col">${can?`<button class="colbtn" data-act="colmenu" data-col="${f.k}" title="Column settings">${esc(f.label)}<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>`:esc(f.label)}</th>`).join("")
    +`<th>${can?`<button class="coladd" data-act="coladd" title="Add a column" aria-label="Add a column">+</button>`:""}</th>`;
  let tb="";
  for(const p of shown){
    const rows=rowsOf(p.id);
    const pa=annsOf(p.id);
    const nn=pa.filter(a=>a.kind!=="ink"&&a.kind!=="evidence"&&a.kind!=="texthl").length;   // same count as the papers list
    const ns=pa.filter(a=>a.kind==="evidence").length;
    tb+=`<tr class="grp"><td colspan="${FIELDS.length+1}"><div class="grp-in">
      <a class="plabel" href="#paper-${p.id}">${esc(p.label||"Untitled paper")}</a>
      <select class="chip" data-v="${esc(p.status||"To read")}" data-paper="${p.id}" data-pk="status" data-fkey="st:${p.id}" aria-label="Reading status" ${can?"":"disabled"}>${STATUSES.map(s=>`<option ${s===(p.status||"To read")?"selected":""}>${s}</option>`).join("")}</select>
      ${paperTagIds(p).map(id=>`<button class="tagchip sm${id===tagId?" on":""}" data-act="picktag" data-tag="${id}" title="Open this tag">${esc(S.tags.get(id).name)}</button>`).join("")}
      <span class="meta">${p.pdf?"PDF":"No PDF"} · ${nn} note${nn===1?"":"s"} · ${ns} sourced value${ns===1?"":"s"}</span>
      <span class="spacer"></span>
      ${can?`<button class="linkbtn" data-act="addrow" data-paper="${p.id}">Add experiment</button>`:""}
      <a class="linkbtn" href="#paper-${p.id}">Open paper</a>
    </div></td></tr>`;
    for(const r of rows){
      tb+=`<tr class="r" data-row="${r.id}">`;
      for(const f of FIELDS){
        const v=r[f.k]??"";
        const ev=evidenceFor(r.id,f.k);
        const srcBtn=`<button class="src ${ev?"has":""}" data-act="src" data-row="${r.id}" data-k="${f.k}" style="--pc:${pinColor(f.k)}" title="${ev?`Go to source on p. ${ev.page}`:(p.pdf?"Mark where this comes from in the PDF":"Attach a PDF to link sources")}" aria-label="${ev?"Go to source":"Mark source"}" ${p.pdf?"":"disabled"}><svg viewBox="0 0 16 16" fill="${ev?"currentColor":"none"}" stroke="currentColor" stroke-width="1.6"><path d="M8 14.5s4.5-4.2 4.5-7.5a4.5 4.5 0 1 0-9 0c0 3.3 4.5 7.5 4.5 7.5z"/></svg></button>`;
        let ctl;
        if(f.options){ const oc=optColor(f,v);
          ctl=`<select class="cell" data-row="${r.id}" data-k="${f.k}" data-fkey="c:${r.id}:${f.k}" data-v="${esc(v)}"${oc?` data-oc style="--oc:${oc}"`:""} aria-label="${esc(f.label)}" ${can?"":"disabled"}><option value=""></option>${f.options.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}${v&&!f.options.includes(v)?`<option selected>${esc(v)}</option>`:""}</select>`; }
        else ctl=`<input class="cell" data-row="${r.id}" data-k="${f.k}" data-fkey="c:${r.id}:${f.k}" value="${esc(v)}" placeholder="—" aria-label="${esc(f.label)}"${f.type==="number"?` inputmode="decimal"`:""} ${can?"":"disabled"}>`;
        tb+=`<td><div class="cellwrap">${srcBtn}${ctl}</div></td>`;   // pin on the left of the value
      }
      tb+=`<td>${can?`<button class="rowdel" data-act="delrow" data-row="${r.id}" title="Delete this experiment row">Delete</button>`:""}</td></tr>`;
    }
    if(!rows.length) tb+=`<tr class="r"><td colspan="${FIELDS.length+1}" class="blank" style="padding:10px 8px">No experiments yet.</td></tr>`;
  }
  return `<div class="wrap"><div class="tablewrap"><table class="lit"><colgroup>${cols}</colgroup><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div></div>`;
}

let shellFor=null, pagesToken=0, lastPagesWidth=0, freshSticker=null;
function renderPaper(){
  const pid=S.view.id, p=S.papers.get(pid); setView("paper");
  if(shellFor!==pid){buildShell(pid);shellFor=pid;}
  const ti=$("#ptitle"); if(ti&&document.activeElement!==ti) ti.value=p.label||"";
  const st=$("#pstatus"); if(st){st.value=p.status||"To read";st.dataset.v=st.value;}
  const tb=$("#tagbtn"); if(tb){const h=tagButtonLabel(p); if(tb.innerHTML!==h) tb.innerHTML=h;}
  document.title=(p.label||"Paper")+" · Foveal Bias Library";
  $$(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===S.tab)));
  $("#ptools").hidden=S.tab!=="pages"; $("#desk").hidden=S.tab!=="pages"; $("#notestab").hidden=S.tab!=="notes";
  $$(".tool").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tool===S.tool)));
  const tool=TOOLS.find(t=>t.k===S.tool); $("#hint").textContent=tool?tool.hint:"";
  $("#desk").className="desk t-"+S.tool+(S.pickSpot?" picking":"");
  renderSwatches();
  const ps=$("#psearch"); if(ps&&S.hitTerms&&S.hitTerms.length&&!ps.value&&document.activeElement!==ps){ps.value=S.hitTerms.map(t=>/\s/.test(t)?`"${t}"`:t).join(" ");setFindCount("");}
  $("#zoomv").textContent=Math.round(S.zoom*100)+"%";
  if(S.tab==="pages"){
    if(p.pdf&&$("#pages").dataset.pdf!==p.pdf) renderPages(pid);
    else if(!p.pdf) renderNoPdf(pid);
    else { renderOverlays(); if(S.focusAnn&&pageDims.length) revealAnn(S.focusAnn); if(S.focusSpot&&pageDims.length) revealSpot(); }
  } else renderNotesTab(pid);
}
