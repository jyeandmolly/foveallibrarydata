<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
html{color-scheme:light dark}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}

/* Layout: an editorial reading room. A summary table up front (hairline rules, small-caps ochre labels),
   and each paper opens onto a sand "desk" with the PDF page on the left and a margin column on the right. */
:root{
  --paper:#ffffff;
  --desk:#f4f2ee;
  --ink:#16191d;
  --ink-2:#565c66;
  --ink-3:#8a9099;
  --rule:#d9dbdf;
  --rule-soft:#eceef0;
  --accent:#e64626;
  --accent-ink:#b8361c;
  --accent-wash:#fdebe6;
  --navy:#1a345e;
  --navy-ink:#ffffff;
  --sticky:#fff1c9;
  --sticky-edge:#e8c661;
  --pen:#1a345e;
  --hl:rgba(255,205,40,.42);
  --good:#2f6b4f;
  --shadow:0 1px 2px rgba(22,25,29,.06),0 10px 28px -14px rgba(26,52,94,.35);
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",Tahoma,"Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f151d;--desk:#151d28;--ink:#e8eaed;--ink-2:#a9b0ba;--ink-3:#77808c;--rule:#2b3441;--rule-soft:#1f2833;
  --accent:#f0603f;--accent-ink:#f5866a;--accent-wash:#3a1d16;--navy:#2c4f86;--navy-ink:#ffffff;
  --sticky:#4a3d17;--sticky-edge:#b8962f;--pen:#1a345e;--hl:rgba(255,205,40,.42);--good:#6fbf98;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f151d;--desk:#151d28;--ink:#e8eaed;--ink-2:#a9b0ba;--ink-3:#77808c;--rule:#2b3441;--rule-soft:#1f2833;
  --accent:#f0603f;--accent-ink:#f5866a;--accent-wash:#3a1d16;--navy:#2c4f86;--navy-ink:#ffffff;
  --sticky:#4a3d17;--sticky-edge:#b8962f;--pen:#1a345e;--hl:rgba(255,205,40,.42);--good:#6fbf98;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 10.5px/1.2 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink)}
.muted{color:var(--ink-2)}
.serif{font-family:var(--f-display)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:8px 14px;font-size:13.5px;font-weight:500;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--rule-soft)}
.btn.danger{color:var(--accent-ink);border-color:var(--accent-wash)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.savestate{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.savestate::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.savestate.saving::before{background:var(--accent);animation:pulse 1s infinite alternate}
.savestate.off::before{background:var(--ink-3)}
@keyframes pulse{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Library ---------- */
.lib-head{padding-block:44px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.lib-head h1{font:500 clamp(34px,5vw,52px)/1.02 var(--f-display);letter-spacing:-.015em;margin:10px 0 12px;text-wrap:balance}
.lib-head p{margin:0;max-width:62ch;color:var(--ink-2)}
.stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.stat .v{font:500 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.lib-actions{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.lib-actions .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-block:12px;border-top:1px solid var(--ink);margin-top:6px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:6px;padding:6px 10px;min-width:0;flex:0 1 280px}
.search input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:13.5px}
.search svg{width:15px;height:15px;color:var(--ink-3);flex:none}
.toolbar label{font-size:12px;color:var(--ink-3)}
.toolbar select{border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:6px 8px;font-size:13px}
.legend{margin-left:auto;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.legend .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.tablewrap{overflow-x:auto;padding-bottom:60px}
table.lit{border-collapse:separate;border-spacing:0;width:100%;min-width:1240px;font-size:13.5px}
table.lit th{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--paper);text-align:left;font:600 10px/1.25 var(--f-body);letter-spacing:.13em;text-transform:uppercase;color:var(--accent-ink);padding:12px 8px 10px;border-bottom:1px solid var(--ink);vertical-align:bottom}
table.lit td{border-bottom:1px solid var(--rule-soft);padding:1px 2px;vertical-align:middle}
tr.grp td{padding:22px 8px 6px;border-bottom:1px solid var(--rule)}
.grp-in{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.plabel{font:500 20px/1.2 var(--f-display);text-decoration:none;letter-spacing:-.005em}
.plabel:hover{color:var(--accent-ink)}
.grp-in .meta{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grp-in .spacer{flex:1}
.chip{font:600 10px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--rule);border-radius:999px;padding:5px 8px;background:transparent;color:var(--ink-2)}
.chip[data-v="Reading"]{border-color:var(--navy);color:var(--navy)}
:root[data-theme="dark"] .chip[data-v="Reading"]{color:#9fb7e3;border-color:#4b6ea6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[data-v="Reading"]{color:#9fb7e3;border-color:#4b6ea6}}
.chip[data-v="Extracted"]{border-color:var(--good);color:var(--good)}
.linkbtn{border:0;background:none;padding:2px 0;font-size:12.5px;color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.linkbtn:hover{color:var(--accent-ink);text-decoration-color:currentColor}
.cellwrap{display:flex;align-items:center;gap:0}
.cell{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:8px 6px;border-radius:4px;outline:0;font-variant-numeric:tabular-nums}
.cell::placeholder{color:var(--ink-3);opacity:.6}
select.cell{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:4px}
.cell:hover{background:var(--rule-soft)}
.cell:focus{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cell[disabled]{cursor:default}
.cell[disabled]:hover{background:transparent}
select.cell[data-v="Toward fovea"]{color:var(--accent-ink);font-weight:500}
select.cell[data-v="Away from fovea"]{color:var(--navy);font-weight:500}
:root[data-theme="dark"] select.cell[data-v="Away from fovea"]{color:#9fb7e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) select.cell[data-v="Away from fovea"]{color:#9fb7e3}}
select.cell[data-v="No bias"]{color:var(--ink-2)}
.src{flex:none;width:20px;height:20px;border:0;background:none;padding:0;display:grid;place-items:center;color:var(--ink-3);opacity:0;border-radius:50%}
tr.r:hover .src,tr.r:focus-within .src{opacity:.7}
.src:hover{opacity:1!important;color:var(--accent)}
.src.has{opacity:1;color:var(--accent)}
.src svg{width:13px;height:13px}
.src[disabled]{display:none}
.rowdel{border:0;background:none;color:var(--ink-3);opacity:0;padding:4px 6px;border-radius:4px;font-size:12px}
tr.r:hover .rowdel,tr.r:focus-within .rowdel{opacity:1}
.rowdel:hover{color:var(--accent-ink);background:var(--accent-wash)}
.rowdel.arm{opacity:1;color:#fff;background:var(--accent)}
tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-wash)}100%{background:transparent}}
.empty{margin:30px 0 80px;border:1px solid var(--rule);border-radius:10px;padding:36px clamp(20px,4vw,48px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:36px}
.empty h2{font:500 30px/1.15 var(--f-display);margin:10px 0 14px}
.empty ol{margin:0;padding:0;list-style:none;display:grid;gap:16px;counter-reset:s}
.empty li{display:grid;grid-template-columns:28px 1fr;gap:10px;color:var(--ink-2)}
.empty li::before{counter-increment:s;content:counter(s);font:500 15px/1.4 var(--f-display);color:var(--accent-ink)}
.empty li b{color:var(--ink);font-weight:500}
.banner{background:var(--navy);color:var(--navy-ink);font-size:13.5px}
.banner .wrap{display:flex;gap:14px;align-items:center;padding-block:10px;flex-wrap:wrap}
.banner .btn{background:transparent;color:var(--navy-ink);border-color:rgba(255,255,255,.4)}

/* ---------- Paper view ---------- */
.pv-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.pv-top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);text-decoration:none;padding:6px 8px 6px 4px;border-radius:6px}
.back:hover{background:var(--rule-soft);color:var(--ink)}
.back svg{width:16px;height:16px}
.ptitle{font:500 22px/1.2 var(--f-display);border:0;background:transparent;outline:0;padding:4px 6px;border-radius:4px;min-width:0;flex:1 1 220px;letter-spacing:-.005em}
.ptitle:hover{background:var(--rule-soft)}
.ptitle:focus{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--paper)}
.tabs{display:flex;gap:2px;border:1px solid var(--rule);border-radius:7px;padding:2px}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:5px;font-size:13px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.pv-tools{border-bottom:1px solid var(--rule);background:var(--paper)}
.pv-tools .wrap{display:flex;gap:14px;align-items:center;padding-block:8px;flex-wrap:wrap}
.seg{display:flex;gap:2px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 9px;font-size:12.5px;color:var(--ink-2)}
.tool svg{width:16px;height:16px}
.tool:hover{background:var(--rule-soft);color:var(--ink)}
.tool[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-wash)}
.tool kbd{font:500 10px/1 var(--f-mono);color:var(--ink-3);border:1px solid var(--rule);border-radius:3px;padding:2px 4px}
.zoom{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.zoom button{width:28px;height:28px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.hint{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.desk{background:var(--desk);min-height:60vh;padding-block:28px 120px}
.pages{display:grid;gap:34px;justify-content:center;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.prow{display:grid;grid-template-columns:auto 270px;gap:22px;align-items:start}
.page{position:relative;background:#fff;box-shadow:var(--shadow);border-radius:2px;overflow:visible}
.page canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.page canvas.pdf{border-radius:2px}
.layer{position:absolute;inset:0}
.desk.t-margin .page,.desk.t-sticky .page,.desk.t-evidence .page{cursor:crosshair}
.desk.t-pen .page,.desk.t-hl .page{cursor:crosshair;touch-action:none}
.desk.t-erase .page{cursor:cell}
.pageload{position:absolute;inset:0;display:grid;place-items:center;color:#9aa0a8;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.margin{position:relative;min-height:100%}
.mhead{font:600 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:4px 0 10px;border-bottom:1px solid var(--rule)}
.mnotes{position:relative}
.mnote{position:absolute;left:0;right:0;display:grid;grid-template-columns:22px 1fr auto;gap:6px;background:var(--paper);border:1px solid var(--rule);border-left:2px solid var(--accent);border-radius:4px;padding:8px 6px 8px 8px;font-size:13px;line-height:1.45;transition:top .15s}
.mnote.hot{box-shadow:0 0 0 2px var(--accent-wash)}
.mnum{font:500 12px/1.4 var(--f-display);color:var(--accent-ink)}
.mbody{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text}
.mbody:empty::before{content:"Write a note…";color:var(--ink-3)}
.mnote textarea{width:100%;border:0;outline:0;background:transparent;resize:none;padding:0;font-size:13px;line-height:1.45;min-height:3.2em}
.x{border:0;background:none;color:var(--ink-3);width:22px;height:22px;border-radius:4px;display:grid;place-items:center;padding:0}
.x:hover{background:var(--accent-wash);color:var(--accent-ink)}
.x svg{width:12px;height:12px}
.tick{position:absolute;right:-12px;transform:translateY(-50%);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font:600 10px/18px var(--f-body);text-align:center;padding:0 4px;border:0;box-shadow:0 0 0 2px #fff}
.tick::before{content:"";position:absolute;right:100%;top:50%;width:14px;height:1.5px;background:var(--accent)}
.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:var(--accent);color:#fff;font:600 9.5px/1 var(--f-body);letter-spacing:.06em;padding:5px 6px 5px;border-radius:10px 10px 10px 2px;box-shadow:0 2px 6px rgba(0,0,0,.25);white-space:nowrap}
.pin::after{content:"";position:absolute;left:0;bottom:-5px;border:5px solid transparent;border-top-color:var(--accent);border-left-color:var(--accent)}
.sticky{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border:1px solid var(--sticky-edge);background:var(--sticky);border-radius:3px 3px 9px 3px;box-shadow:0 2px 5px rgba(0,0,0,.18);padding:0}
.sticky:hover,.pin:hover,.tick:hover{filter:brightness(1.06);transform-origin:center}
.pin.flash,.sticky.flash,.tick.flash{animation:ring 1.4s ease-out 2}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(230,70,38,.7)}100%{box-shadow:0 0 0 16px rgba(230,70,38,0)}}
.nopdf{max-width:640px;margin:20px auto;border:1px dashed var(--ink-3);border-radius:10px;padding:34px;text-align:center;background:var(--paper)}
.nopdf h2{font:500 24px/1.2 var(--f-display);margin:8px 0}
/* notes tab */
.nt{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;padding-block:32px 120px}
.nt h3{font:600 10.5px/1.2 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink);margin:28px 0 10px}
.nt h3:first-child{margin-top:0}
.nt textarea.big{width:100%;min-height:340px;border:1px solid var(--rule);border-radius:8px;padding:16px 18px;background:var(--paper);font:400 16px/1.65 var(--f-display);resize:vertical;outline:0}
.nt textarea.big:focus,.nt textarea.small:focus,.nt input.small:focus{border-color:var(--accent)}
.nt textarea.small,.nt input.small{width:100%;border:1px solid var(--rule);border-radius:6px;padding:9px 11px;background:var(--paper);font-size:13.5px;resize:vertical;outline:0}
.preview{margin-top:14px;padding:16px 18px;border-left:2px solid var(--rule);font:400 15.5px/1.65 var(--f-display);color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere}
.preview:empty{display:none}
.wl{color:var(--accent-ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}
.wl-missing{color:var(--ink-3);border-bottom:1px dashed var(--ink-3)}
.pl{color:var(--navy);text-decoration:underline dotted;cursor:pointer}
:root[data-theme="dark"] .pl{color:#9fb7e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pl{color:#9fb7e3}}
.alist{list-style:none;margin:0;padding:0;display:grid;gap:0}
.alist li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule-soft);font-size:13px;cursor:pointer}
.alist li:hover{background:var(--rule-soft)}
.alist .pg{font:500 12px/1.5 var(--f-mono);color:var(--ink-3)}
.alist .k{font:600 9.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);display:block;margin-bottom:3px}
.alist .t{color:var(--ink-2);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.blank{font-size:13px;color:var(--ink-3)}
.fieldrow{display:grid;gap:6px;margin-bottom:14px}
.fieldrow label{font-size:12px;color:var(--ink-3)}
/* popover + toast */
.pop{position:fixed;z-index:60;width:min(340px,calc(100vw - 32px));background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:0 18px 50px -12px rgba(0,0,0,.35);padding:14px}
.pop .ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pop .ph .eyebrow{flex:1}
.pop textarea,.pop input,.pop select{width:100%;border:1px solid var(--rule);border-radius:6px;padding:8px 10px;background:var(--paper);font-size:13.5px;outline:0}
.pop textarea{min-height:110px;resize:vertical;line-height:1.5}
.pop textarea:focus,.pop input:focus,.pop select:focus{border-color:var(--accent)}
.pop .pf{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:12px}
.pop .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pop label{font-size:11.5px;color:var(--ink-3);display:block;margin:8px 0 4px}
.pop .preview{margin-top:8px;padding:6px 0 0 10px;font-size:14px}
.pop.sticky-pop{background:var(--sticky);border-color:var(--sticky-edge)}
.pop.sticky-pop textarea{background:transparent;border-color:var(--sticky-edge)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:13.5px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:calc(100vw - 32px)}
.loading{padding:80px 0;color:var(--ink-3);text-align:center}
@media (max-width:900px){
  .lib-head{grid-template-columns:1fr}
  .lib-actions{align-items:flex-start}
  .lib-actions .row{justify-content:flex-start}
  .empty{grid-template-columns:1fr}
  .prow{grid-template-columns:auto}
  .mnotes{min-height:0}
  .mnote{position:relative!important;top:auto!important;margin-top:8px}
  .nt{grid-template-columns:1fr}
  .tool .lbl{display:none}
  .hint{margin-left:0;flex-basis:100%}
  .legend{margin-left:0}
}


/* GitHub version: setup screen and save status */

.setup label{font-size:12px;color:var(--ink-3);display:block;margin-bottom:5px}
.setup input{width:100%;border:1px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--paper);font-size:14px;outline:0}

.steps li::before{counter-increment:s;content:counter(s);font:500 15px/1.45 var(--f-display);color:var(--accent-ink)}

.repo{font:12px var(--f-mono);color:var(--ink-3)}

const evidenceFor=(rid,k)=>[...S.anns.entries()].map(([id,a])=>({id,...a})).find(a=>a.kind==="evidence"&&a.row===rid&&a.field===k);
function paperByLabel(label){const l=String(label).trim().toLowerCase();for(const [id,p] of S.papers) if(String(p.label||"").trim().toLowerCase()===l) return id;return null;}
function richText(t,opts={}){
  let h=esc(t||"");
  h=h.replace(/\[\[([^\[\]\n]{1,120})\]\]/g,(m,lab)=>{

    return id?`<a class="wl" href="#paper-${id}">${lab}</a>`:`<span class="wl-missing" title="No paper with this label yet">[[${lab}]]</span>`;

/* ---------------- GitHub API ---------------- */
const enc=new TextEncoder(), dec=new TextDecoder();
function b64FromBytes(bytes){let s="";for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s);}
function bytesFromB64(b64){const s=atob(b64.replace(/\s/g,""));const out=new Uint8Array(s.length);for(let i=0;i<s.length;i++) out[i]=s.charCodeAt(i);return out;}
const encPath=p=>p.split("/").map(encodeURIComponent).join("/");
class GhError extends Error{constructor(status,msg){super(msg);this.status=status;}}
async function gh(path,opts={}){
  const c=S.cfg;
  let res;
  try{
    res=await fetch("https://api.github.com"+path,{...opts,cache:"no-store",headers:{
      "Accept":"application/vnd.github+json","Authorization":"Bearer "+c.token,"X-GitHub-Api-Version":"2022-11-28",...(opts.headers||{})}});
  }catch(e){throw new GhError(0,"network");}
  return res;
}
async function ghJson(path,opts){const res=await gh(path,opts);if(res.status===404) return null;if(!res.ok) throw new GhError(res.status,await res.text().catch(()=>""));return res.json();}
const contentsUrl=p=>`/repos/${encodeURIComponent(S.cfg.owner)}/${encodeURIComponent(S.cfg.repo)}/contents/${encPath(p)}`;
async function getRawBytes(path){
  const res=await gh(contentsUrl(path)+"?ref="+encodeURIComponent(S.cfg.branch),{headers:{"Accept":"application/vnd.github.raw"}});
  if(!res.ok) throw new GhError(res.status,"raw");
  return new Uint8Array(await res.arrayBuffer());
}
async function getDataFile(useEtag){
  const headers=useEtag&&S.etag?{"If-None-Match":S.etag}:{};
  const res=await gh(contentsUrl(DATA_PATH)+"?ref="+encodeURIComponent(S.cfg.branch),{headers});
  if(res.status===304) return {unchanged:true};
  if(res.status===404) return {missing:true};
  if(!res.ok) throw new GhError(res.status,await res.text().catch(()=>""));
  const etag=res.headers.get("ETag"); const meta=await res.json();
  let text;
  if(meta.content&&meta.encoding==="base64") text=dec.decode(bytesFromB64(meta.content));
  else text=dec.decode(await getRawBytes(DATA_PATH));
  return {sha:meta.sha,etag,data:JSON.parse(text)};
}
async function putFile(path,b64,message,sha){
  const body={message,content:b64,branch:S.cfg.branch}; if(sha) body.sha=sha;
  const res=await gh(contentsUrl(path),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok) throw new GhError(res.status,await res.text().catch(()=>""));
  return res.json();
}
async function deleteFile(path,sha,message){
  if(!sha){const meta=await ghJson(contentsUrl(path)+"?ref="+encodeURIComponent(S.cfg.branch));if(!meta) return;sha=meta.sha;}
  const res=await gh(contentsUrl(path),{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,sha,branch:S.cfg.branch})});
  if(!res.ok&&res.status!==404) throw new GhError(res.status,"delete");
}
function ghReason(e){
  const s=e&&e.status;
  if(s===0) return "No connection to GitHub.";
  if(s===401) return "GitHub didn’t accept the token. It may have expired; add a new one in Settings.";
  if(s===403) return "GitHub refused the request. Check the token has Contents: Read and write on this repository.";
  if(s===404) return "Repository not found, or the token can’t see it.";
  if(s===409||s===422) return "The library changed on GitHub at the same time.";
  if(s===413) return "That file is too large for GitHub.";
  return "GitHub returned an error ("+s+").";
}

/* ---------------- data model, merge, cache ---------------- */
function serialize(){
  return {format:"foveal-bias-library",version:1,savedAt:new Date().toISOString(),
    papers:Object.fromEntries(S.papers),rows:Object.fromEntries(S.rows),anns:Object.fromEntries(S.anns),deleted:S.deleted};
}
function applyData(D){
  S.papers=new Map(Object.entries(D.papers||{}));
  S.rows=new Map(Object.entries(D.rows||{}));
  S.anns=new Map(Object.entries(D.anns||{}));
  S.deleted={...(D.deleted||{})};
}
/* Newer edit wins, per paper/row/annotation. A deletion wins over any edit made before it. */
function merge(a,b){
  const out={papers:{},rows:{},anns:{},deleted:{}};
  for(const [k,t] of Object.entries({...(a.deleted||{}),...(b.deleted||{})})) out.deleted[k]=Math.max((a.deleted||{})[k]||0,(b.deleted||{})[k]||0,t);
  for(const col of ["papers","rows","anns"]){
    const A=a[col]||{},B=b[col]||{};
    for(const id of new Set([...Object.keys(A),...Object.keys(B)])){
      const x=A[id],y=B[id]; const doc=!x?y:!y?x:((y.updatedAt||0)>=(x.updatedAt||0)?y:x);
      const del=out.deleted[col+"/"+id]||0;
      if(doc&&!(del&&del>=(doc.updatedAt||0))) out[col][id]=doc;
    }
  }
  return out;
}
let cacheTimer=null;
function cacheLocal(){clearTimeout(cacheTimer);cacheTimer=setTimeout(()=>{if(!S.cfg) return;const ok=lsSet(LS_CACHE(S.cfg),{dirty:S.rev>S.savedRev,data:serialize()});if(!ok&&S.rev>S.savedRev) toast("This browser couldn’t keep a backup copy. Save to GitHub before closing.",4000);},400);}

/* ---------------- editing API used by the UI ---------------- */
function put(col,id,data){
  if(!S.canWrite) return;
  S[col].set(id,{...data,updatedAt:Date.now()});
  markDirty();
}
async function removeDoc(col,id){
  if(!S.canWrite) return;
  S[col].delete(id); S.deleted[col+"/"+id]=Date.now(); markDirty();
}
let saveTimer=null, firstDirtyAt=0;
function markDirty(){
  S.rev++; S.saveErr=null; cacheLocal();
  const now=Date.now(); if(!firstDirtyAt) firstDirtyAt=now;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,Math.min(SAVE_DELAY,Math.max(0,firstDirtyAt+SAVE_MAX_WAIT-now)));
  setSaveState();
}
async function saveNow(){
  clearTimeout(saveTimer); saveTimer=null;
  if(!S.connected||!S.canWrite) return;
  if(S.saving){S.saveAgain=true;return;}
  if(S.rev===S.savedRev){setSaveState();return;}
  S.saving=true; setSaveState();
  let attempt=0;
  while(true){
    const rev=S.rev;
    const json=JSON.stringify(serialize(),null,1);
    try{
      const res=await putFile(DATA_PATH,b64FromBytes(enc.encode(json)),"Library: update notes",S.dataSha);
      S.dataSha=res.content.sha; S.etag=null; S.savedRev=rev; S.lastSaved=Date.now(); firstDirtyAt=S.rev>rev?Date.now():0;
      break;
    }catch(e){
      if((e.status===409||e.status===422)&&attempt<2){
        attempt++;
        try{const remote=await getDataFile(false); if(remote.data){applyData(merge(remote.data,serialize()));S.dataSha=remote.sha;scheduleRender();} else S.dataSha=null; continue;}
        catch(e2){S.saveErr=ghReason(e2);break;}
      }
      S.saveErr=ghReason(e);
      if(e.status===0){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,30000);}
      break;
    }
  }
  S.saving=false; cacheLocal(); setSaveState();
  if(S.saveAgain||(S.rev>S.savedRev&&!S.saveErr&&!saveTimer)){S.saveAgain=false;saveTimer=setTimeout(saveNow,SAVE_DELAY);}
}
function setSaveState(){
  for(const el of $$(".savestate")){
    let txt, act=false, cls="";
    if(!S.connected){txt="Not connected";cls="off";}
    else if(!S.canWrite){txt="Read only";cls="off";}
    else if(S.saving){txt="Saving to GitHub…";cls="saving";}
    else if(S.saveErr){txt="Not saved: "+S.saveErr+" Retry";cls="saving";act=true;}
    else if(S.rev>S.savedRev){txt="Unsaved changes · Save now";cls="saving";act=true;}
    else {txt=S.lastSaved?"Saved to GitHub "+ago(S.lastSaved):"Up to date with GitHub";}
    el.className="savestate "+cls+(act?" act":""); el.textContent=txt; el.dataset.act=act?"savenow":""; el.title=act?"Save to GitHub now (Ctrl/Cmd+S)":"";
  }
}
setInterval(setSaveState,30000);

/* ---------------- connect, load, poll ---------------- */
async function connect(cfg){
  S.cfg={owner:cfg.owner.trim(),repo:cfg.repo.trim(),branch:(cfg.branch||"").trim(),token:cfg.token.trim()};
  const repo=await ghJson(`/repos/${encodeURIComponent(S.cfg.owner)}/${encodeURIComponent(S.cfg.repo)}`);
  if(!repo) throw new GhError(404,"repo");
  S.cfg.branch=S.cfg.branch||repo.default_branch||"main";
  S.repoPrivate=!!repo.private;
  S.canWrite=!!(repo.permissions&&repo.permissions.push);
  lsSet(LS_CFG,S.cfg);
  const remote=await getDataFile(false).catch(e=>{if(e.status===409) return {missing:true};throw e;});
  const cache=lsGet(LS_CACHE(S.cfg));
  let D=remote.data||{papers:{},rows:{},anns:{},deleted:{}};
  S.dataSha=remote.sha||null; S.etag=remote.etag||null;
  if(cache&&cache.dirty&&cache.data){D=merge(D,cache.data);applyData(D);S.connected=true;S.loaded=true;markDirty();toast("Recovered changes from this browser that hadn’t reached GitHub. Saving them now.",4500);}
  else {applyData(D);S.connected=true;S.loaded=true;S.lastSaved=null;}
  setSaveState();
}
async function poll(){
  if(!S.connected||S.saving||S.rev>S.savedRev||document.visibilityState!=="visible") return;
  try{
    const r=await getDataFile(true);
    if(r.unchanged||r.missing) return;
    if(S.saving||S.rev>S.savedRev) return;
    if(r.sha!==S.dataSha){applyData(r.data);S.dataSha=r.sha;S.etag=r.etag;cacheLocal();scheduleRender();toast("Updated with changes from another device.");}
    else S.etag=r.etag;
  }catch{}
}
setInterval(poll,POLL_MS);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible") poll();});

/* ---------------- render loop ---------------- */
let rafPending=false;
function scheduleRender(){if(rafPending) return;rafPending=true;requestAnimationFrame(()=>{rafPending=false;render();});}
function render(){

  } else b.innerHTML="";
}
function keepFocus(container,fn){
  const ae=document.activeElement, fkey=ae&&container.contains(ae)?ae.dataset.fkey:null;
  let sel=null; try{ if(fkey&&ae.selectionStart!=null) sel=[ae.selectionStart,ae.selectionEnd]; }catch{}
  fn();
  if(fkey){const el=container.querySelector(`[data-fkey="${CSS.escape(fkey)}"]`);if(el){el.focus({preventScroll:true});if(sel) try{el.setSelectionRange(sel[0],sel[1]);}catch{}}}
}

        }
        tb+=`<td>${can?`<button class="rowdel" data-act="delrow" data-row="${r.id}" title="Delete this experiment row">Delete</button>`:""}</td></tr>`;
      }
      if(!rows.length) tb+=`<tr class="r"><td colspan="${FIELDS.length+1}" class="blank" style="padding:10px 8px">No experiments yet.</td></tr>`;
    }
    if(!shown.length) tb=`<tr><td colspan="${FIELDS.length+1}" class="blank" style="padding:22px 8px">No papers match “${esc(S.filter)}”.</td></tr>`;
    body=`<div class="wrap"><div class="tablewrap"><table class="lit"><colgroup>${cols}</colgroup><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div></div>`;
  }
  keepFocus(main,()=>{main.innerHTML=head+body;});
  if(S.flashRow){
    const tr=main.querySelector(`tr[data-row="${S.flashRow}"]`); S.flashRow=null;
    if(tr){tr.scrollIntoView({block:"center",behavior:"smooth"});tr.classList.add("flash");}
  }
}

function loadPdf(p){
  if(pdfCache.has(p.pdf)) return pdfCache.get(p.pdf);
  const pr=(async()=>{
    const lib=window["pdfjs-dist/build/pdf"]; if(!lib) throw new Error("viewer");
    lib.GlobalWorkerOptions.workerSrc="vendor/pdfjs/pdf.worker.min.js";
    const data=await getRawBytes(p.pdf);
    return lib.getDocument({data,isEvalSupported:false}).promise;
  })();
  pdfCache.set(p.pdf,pr); pr.catch(()=>pdfCache.delete(p.pdf));
  return pr;
}
async function renderPages(pid){
  const p=S.papers.get(pid), el=$("#pages"); if(!el) return;
  const token=++pagesToken;
  el.dataset.pdf=p.pdf;
  el.innerHTML=`<div class="loading">Fetching the PDF from GitHub…</div>`;
  let pdf;
  try{pdf=await loadPdf(p);}catch(e){
    if(token!==pagesToken) return;
    const why=e.message==="viewer"?"The PDF viewer files didn’t load. Check that the vendor folder was uploaded with index.html.":(e instanceof GhError?ghReason(e):"The file may be damaged. Try attaching a different copy.");
    el.innerHTML=`<div class="nopdf"><div class="eyebrow">Couldn’t open the PDF</div><h2>This file didn’t load</h2><p class="muted">${esc(why)}</p>${S.canWrite&&S.repoPrivate?`<button class="btn" data-act="attach" data-paper="${pid}">Replace PDF</button>`:""}</div>`;
    el.dataset.pdf="";
    return;
  }
  if(token!==pagesToken) return;
  const narrow=window.innerWidth<=900;
  const avail=(narrow?el.clientWidth-32:el.clientWidth-270-22-32);
  const baseW=clamp(Math.min(avail,860),280,860);
  const W=Math.round(baseW*S.zoom);
  lastPagesWidth=el.clientWidth;
  el.innerHTML=""; pageDims=[];
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i); if(token!==pagesToken) return;
    const vp1=page.getViewport({scale:1});
    const H=Math.round(W*vp1.height/vp1.width);
    pageDims[i]={W,H};
    const row=document.createElement("div"); row.className="prow"; row.dataset.page=i;
    row.innerHTML=`<div class="page" data-page="${i}" style="width:${W}px;height:${H}px"><div class="pageload">Page ${i}</div><canvas class="pdf"></canvas><canvas class="ink"></canvas><div class="layer"></div></div><aside class="margin"><div class="mhead">p. ${i}</div><div class="mnotes" style="height:${narrow?"auto":(H-30)+"px"}"></div></aside>`;
    el.appendChild(row); pages.push({page,row,W});
  }
  renderOverlays();
  if(S.focusAnn) revealAnn(S.focusAnn);
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  for(const {page,row,W} of pages){
    if(token!==pagesToken) return;
    const c=row.querySelector("canvas.pdf"), vp=page.getViewport({scale:(W/page.getViewport({scale:1}).width)*dpr});
    c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
    try{await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;}catch{}
    const ld=row.querySelector(".pageload"); if(ld) ld.remove();
    drawInk(+row.dataset.page);
  }
}
function renderOverlays(){

function reconcileMargin(row,margins){

function layoutMargin(row){
  if(window.innerWidth<=900) return;

  const H=page.offsetHeight, off=box.offsetTop;

  let bottom=0;
  for(const {el,y} of els){

let liveStroke=null;
function drawInk(i){
  const row=$(`.prow[data-page="${i}"]`); if(!row) return;
  const c=row.querySelector("canvas.ink"), d=pageDims[i]; if(!c||!d) return;
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  if(c.width!==Math.round(d.W*dpr)){c.width=Math.round(d.W*dpr);c.height=Math.round(d.H*dpr);}
  const g=c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,d.W,d.H);
  const strokes=annsOf(S.view.id).filter(a=>a.kind==="ink"&&a.page===i);
  if(liveStroke&&liveStroke.page===i) strokes.push(liveStroke);
  for(const s of strokes) strokePath(g,s,d);
}
function strokePath(g,s,d){
  const pts=s.points||[]; if(pts.length<1) return;
  const css=getComputedStyle(document.documentElement);
  g.save();
  if(s.tool==="hl"){g.globalCompositeOperation="multiply";g.strokeStyle=(HL.find(h=>h.k===s.color)||HL[0]).c;g.lineWidth=Math.max(10,d.W*0.017);g.lineCap="butt";}
  else {g.strokeStyle=(PEN.find(h=>h.k===s.color)||PEN[0]).c;g.lineWidth=Math.max(1.4,d.W*0.0022);g.lineCap="round";}
  g.lineJoin="round"; g.beginPath();
  g.moveTo(pts[0][0]*d.W,pts[0][1]*d.H);
  if(pts.length===1) g.lineTo(pts[0][0]*d.W+.1,pts[0][1]*d.H);
  for(let k=1;k<pts.length;k++) g.lineTo(pts[k][0]*d.W,pts[k][1]*d.H);
  g.stroke(); g.restore();
}
function revealAnn(id){
  const a=S.anns.get(id); if(!a){S.focusAnn=null;return;}

  setTimeout(()=>{

    if(m){m.classList.remove("flash");void m.offsetWidth;m.classList.add("flash");}
    const note=row.querySelector(`.mnote[data-id="${id}"]`); if(note){note.classList.add("hot");setTimeout(()=>note.classList.remove("hot"),1800);}
  },380);
}

function newRow(pid,exp){
  const order=rowsOf(pid).length;
  const id=uid("r"); put("rows",id,{paper:pid,order,exp:exp||("Exp "+(order+1)),createdAt:Date.now()}); return id;
}
function newAnn(data){const id=uid("a");put("anns",id,{...data,paper:S.view.id,createdAt:Date.now()});return id;}
async function importFiles(files,targetPid){
  if(!S.canWrite) return;
  if(!S.repoPrivate){toast("Make the repository private before adding PDFs.",4000);return;}
  const list=[...files].filter(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name));
  if(!list.length){toast("Choose a PDF file.");return;}
  let last=null, k=0, ok=0;
  for(const f of list){
    k++;
    if(f.size>MAX_PDF){toast(`${f.name} is over 50 MB, too large to store through GitHub’s API.`,5000);await sleep(1500);continue;}
    toast(list.length>1?`Committing ${k} of ${list.length} to GitHub: ${f.name}`:`Committing ${f.name} to GitHub…`,120000);
    try{
      const pid=targetPid||uid("p");
      const path=PDF_DIR+pid+"-"+Date.now().toString(36)+".pdf";
      const res=await putFile(path,b64FromBytes(new Uint8Array(await f.arrayBuffer())),`Add PDF: ${f.name}`);
      if(targetPid){
        const p=S.papers.get(targetPid); const old=p.pdf, oldSha=p.pdfSha;
        put("papers",targetPid,{...p,pdf:path,pdfSha:res.content.sha,pdfName:f.name}); last=targetPid;
        if(old&&old!==path){pdfCache.delete(old);deleteFile(old,oldSha,"Remove replaced PDF").catch(()=>{});}
      } else {
        const label=f.name.replace(/\.pdf$/i,"").replace(/[_]+/g," ").trim().slice(0,120)||"Untitled paper";
        put("papers",pid,{label,ref:"",status:"To read",notes:"",pdf:path,pdfSha:res.content.sha,pdfName:f.name,createdAt:Date.now()});
        newRow(pid,"Exp 1"); last=pid;
      }
      ok++;
    }catch(e){toast(`${f.name}: ${e instanceof GhError?ghReason(e):"didn’t upload."}`,5000);await sleep(1500);}
  }
  if(ok) {toast(ok>1?`Added ${ok} PDFs.`:"Added.");saveNow();}
  if(last&&(list.length===1||targetPid)) location.hash="paper-"+last; else render();
}
async function deletePaper(pid){
  const p=S.papers.get(pid); if(!p) return;
  for(const a of annsOf(pid)) await removeDoc("anns",a.id);
  for(const r of rowsOf(pid)) await removeDoc("rows",r.id);
  await removeDoc("papers",pid);
  if(p.pdf){pdfCache.delete(p.pdf);deleteFile(p.pdf,p.pdfSha,`Remove PDF: ${p.pdfName||p.label||""}`).catch(()=>{});}
  saveNow();
  toast(`Deleted ${p.label||"paper"}.`); location.hash="library";
}
function exportCsv(){
  const head=["Paper","Full reference","Status",...FIELDS.map(f=>f.label),"Sources (page)"];
  const lines=[head];
  for(const p of papersSorted()) for(const r of rowsOf(p.id)){
    const src=FIELDS.map(f=>{const e=evidenceFor(r.id,f.k);return e?`${f.short} p.${e.page}`:null;}).filter(Boolean).join("; ");
    lines.push([p.label||"",p.ref||"",p.status||"",...FIELDS.map(f=>r[f.k]??""),src]);
  }
  const csv="﻿"+lines.map(l=>l.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="foveal-bias-summary.csv";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

function pagePoint(page,ev){const r=page.getBoundingClientRect();return [clamp((ev.clientX-r.left)/r.width,0,1),clamp((ev.clientY-r.top)/r.height,0,1)];}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));}
document.addEventListener("pointerdown",ev=>{
  const page=ev.target.closest(".page"); if(!page||S.view.name!=="paper") return;
  if(ev.target.closest("[data-act]")) return;
  if(!S.canWrite||S.tool==="read") return;
  ev.preventDefault();  // keep focus where the new note puts it (stops the mousedown that would blur it)
  const i=+page.dataset.page, [x,y]=pagePoint(page,ev);
  if(S.tool==="pen"||S.tool==="hl"){
    ev.preventDefault(); page.setPointerCapture(ev.pointerId);
    liveStroke={kind:"ink",tool:S.tool,color:S.colors[S.tool],page:i,points:[[x,y]]}; drawInk(i); return;
  }
  if(S.tool==="erase"){
    const d=pageDims[i]; let best=null,bd=Infinity;
    for(const a of annsOf(S.view.id).filter(a=>a.kind==="ink"&&a.page===i)){
      const tol=a.tool==="hl"?Math.max(10,d.W*0.017)/2+4:8;
      const pts=a.points||[];
      for(let k=0;k<pts.length;k++){
        const p0=pts[Math.max(0,k-1)],p1=pts[k];
        const dist=segDist(x*d.W,y*d.H,p0[0]*d.W,p0[1]*d.H,p1[0]*d.W,p1[1]*d.H);
        if(dist<tol&&dist<bd){bd=dist;best=a.id;}
      }
    }
    if(best){removeDoc("anns",best).then(()=>drawInk(i));} else toast("Click directly on a stroke or highlight to erase it.",1800);
    return;
  }
  if(S.tool==="margin"){
    const id=newAnn({kind:"margin",page:i,x,y,text:"",color:S.colors.margin}); renderOverlays();
    const note=$(`.mnote[data-id="${id}"]`); if(note){startEditNote(note);if(window.innerWidth<=900) note.scrollIntoView({block:"center"});}
    return;
  }
  if(S.tool==="sticky"){
    const id=newAnn({kind:"sticky",page:i,x,y,text:"",color:S.colors.sticky}); renderOverlays();
    const el=$(`.sticky[data-id="${id}"]`); if(el) stickyPop({id,...S.anns.get(id)},el);
    return;
  }
  if(S.tool==="sticker"){
    const id=newAnn({kind:"sticker",sticker:S.sticker,page:i,x,y,rot:Math.round((Math.random()*24-12)*10)/10,text:""});
    freshSticker=id; renderOverlays(); setTimeout(()=>{freshSticker=null;},600);
    return;
  }
  if(S.tool==="evidence"){
    if(S.pendingEvidence){
      const {row,field}=S.pendingEvidence; const old=evidenceFor(row,field);
      if(old) removeDoc("anns",old.id);
      const id=newAnn({kind:"evidence",page:i,x,y,row,field,text:""});
      S.pendingEvidence=null; S.tool="read"; render();
      const r=S.rows.get(row); toast(`Linked ${FIELD[field].label}${r?" for "+(r.exp||""):""} to p. ${i}.`);
      const pinEl=$(`.pin[data-id="${id}"]`); if(pinEl) pinPop({id,...S.anns.get(id)},pinEl);
      return;
    }
    const marker=document.createElement("span"); marker.style.cssText=`position:absolute;left:${x*100}%;top:${y*100}%;width:1px;height:1px`;
    page.querySelector(".layer").appendChild(marker);
    evidencePickerPop(marker,i,x.toFixed(4),y.toFixed(4)); setTimeout(()=>marker.remove(),50);
  }
});
document.addEventListener("pointermove",ev=>{
  if(!liveStroke) return;
  const page=$(`.page[data-page="${liveStroke.page}"]`); if(!page) return;
  const [x,y]=pagePoint(page,ev); const last=liveStroke.points[liveStroke.points.length-1];
  const d=pageDims[liveStroke.page];
  if(Math.hypot((x-last[0])*d.W,(y-last[1])*d.H)<2) return;
  liveStroke.points.push(liveStroke.tool==="hl"?[x,liveStroke.points[0][1]+(y-liveStroke.points[0][1])*0.15]:[x,y]);
  drawInk(liveStroke.page);
});
function endStroke(){

  s.points=s.points.map(p=>[+p[0].toFixed(4),+p[1].toFixed(4)]).slice(0,4000);
  newAnn({kind:"ink",tool:s.tool,color:s.color,page:s.page,points:s.points,x:s.points[0][0],y:s.points[0][1]});
  drawInk(s.page);
}

function route(){
  if(!S.connected){render();return;}
  const h=location.hash.replace(/^#/,"");
  const m=h.match(/^paper-([A-Za-z0-9]+)$/);
  closePop();
  if(m){ if(S.view.name!=="paper"||S.view.id!==m[1]){S.view={name:"paper",id:m[1]};shellFor=null;if(!S.focusAnn&&!S.pendingEvidence) S.tab="pages";} }
  else { S.view={name:"library"}; shellFor=null; S.pendingEvidence=null; S.tool="read"; }
  render(); if(!m) window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
let rz=null;
window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{
  if(S.view.name==="paper"&&S.tab==="pages"){const el=$("#pages");if(el&&Math.abs(el.clientWidth-lastPagesWidth)>40){el.dataset.pdf="";render();} else $$(".prow").forEach(layoutMargin);}
},250);});

/* ---------------- boot ---------------- */
(async function boot(){
  const cfg=lsGet(LS_CFG);
  if(!cfg||!cfg.token){S.view={name:"setup"};render();return;}
  $("#main").innerHTML=`<div class="wrap loading">Loading your library from GitHub…</div>`;
  try{await connect(cfg);S.view={name:"library"};route();}
  catch(e){
    S.cfg=cfg; S.setupErr=e instanceof GhError?ghReason(e):"Couldn’t load the library.";
    const cache=lsGet(LS_CACHE(cfg));
    if(cache&&cache.data&&e instanceof GhError&&e.status===0){
      applyData(cache.data); S.connected=true; S.canWrite=false; S.repoPrivate=true; S.view={name:"library"}; route();
      toast("Offline: showing this browser’s last copy, read only. Reload when you’re back online.",6000);
    } else {S.view={name:"setup"};$("#main").innerHTML="";render();}
  }
})();

</script>
