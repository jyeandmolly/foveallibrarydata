function renderSwatches(){
  const el=$("#swatches"); if(!el) return;
  const t=S.tool; el.classList.toggle("stk-row",t==="sticker");
  if(t==="sticker"){
    el.innerHTML=`<span class="swl">Sticker</span>`+STICKERS.map(x=>`<button class="stkpick${x.wide?" wide":""}" data-act="pickstk" data-s="${x.k}" title="${esc(x.name)}" aria-label="${esc(x.name)}" aria-pressed="${S.sticker===x.k}">${x.svg}</button>`).join("");
  } else if(["pen","hl","margin","sticky"].includes(t)){
    const pal=t==="pen"?PEN.map(p=>({k:p.k,c:p.c,name:p.name})):t==="hl"?HL.map(p=>({k:p.k,c:p.s,name:p.name})):NOTE.map(n=>({k:n.k,c:t==="margin"?n.ink:n.bg,ring:n.edge,name:n.name}));
    el.innerHTML=`<span class="swl">Colour</span>`+pal.map(p=>`<button class="sw" data-act="pickcolor" data-c="${p.k}" style="background:${p.c}${p.ring?`;outline:1px solid ${p.ring};outline-offset:-1px`:""}" title="${esc(p.name)}" aria-label="${esc(p.name)}" aria-pressed="${S.colors[t]===p.k}"></button>`).join("");
  } else el.innerHTML="";
}
function renderNoPdf(pid){
  const el=$("#pages"); el.dataset.pdf="";
  const can=S.canWrite&&S.repoPrivate;
  el.innerHTML=`<div class="nopdf"><div class="eyebrow">No PDF attached</div><h2>Attach the paper to annotate it</h2><p class="muted">You can still fill this paper’s rows in the summary table and keep reading notes under Notes &amp; sources.</p>${can?`<button class="btn primary" data-act="attach" data-paper="${pid}">${ICON.upload}Attach PDF</button>`:""}</div>`;
}
function loadPdf(p){
  if(pdfCache.has(p.pdf)) return pdfCache.get(p.pdf);
  const pr=(async()=>{
    const lib=window["pdfjs-dist/build/pdf"]; if(!lib) throw new Error("viewer");
    lib.GlobalWorkerOptions.workerSrc="vendor/pdfjs/pdf.worker.min.js";
    const data=await getRawBytes(p.pdf);
    return lib.getDocument({data,isEvalSupported:false}).promise;
  })();
  pdfCache.set(p.pdf,pr); pr.catch(()=>pdfCache.delete(p.pdf));
  return pr;
}
async function renderPages(pid){
  const p=S.papers.get(pid), el=$("#pages"); if(!el) return;
  const token=++pagesToken;
  el.dataset.pdf=p.pdf;
  el.innerHTML=`<div class="loading">Fetching the PDF from GitHub…</div>`;
  let pdf;
  try{pdf=await loadPdf(p);}catch(e){
    if(token!==pagesToken) return;
    const why=e.message==="viewer"?"The PDF viewer files didn’t load. Check that the vendor folder was uploaded with index.html.":(e instanceof GhError?ghReason(e):"The file may be damaged. Try attaching a different copy.");
    el.innerHTML=`<div class="nopdf"><div class="eyebrow">Couldn’t open the PDF</div><h2>This file didn’t load</h2><p class="muted">${esc(why)}</p>${S.canWrite&&S.repoPrivate?`<button class="btn" data-act="attach" data-paper="${pid}">Replace PDF</button>`:""}</div>`;
    el.dataset.pdf="";
    return;
  }
  if(token!==pagesToken) return;
  const narrow=window.innerWidth<=900;
  const avail=(narrow?el.clientWidth-32:el.clientWidth-270-22-32);
  const baseW=clamp(Math.min(avail,860),280,860);
  const W=Math.round(baseW*S.zoom);
  lastPagesWidth=el.clientWidth;
  el.innerHTML=""; pageDims=[]; hideSelbar();
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const page=await pdf.getPage(i); if(token!==pagesToken) return;
    const vp1=page.getViewport({scale:1});
    const H=Math.round(W*vp1.height/vp1.width);
    pageDims[i]={W,H};
    const row=document.createElement("div"); row.className="prow"; row.dataset.page=i;
    row.innerHTML=`<div class="page" data-page="${i}" style="width:${W}px;height:${H}px"><div class="pageload">Page ${i}</div><canvas class="pdf"></canvas><canvas class="ink"></canvas><div class="textLayer"></div><div class="layer"></div></div><aside class="margin"><div class="mhead">p. ${i}</div><div class="mnotes" style="height:${narrow?"auto":(H-30)+"px"}"></div></aside>`;
    el.appendChild(row); pages.push({page,row,W});
  }
  renderOverlays();
  if(S.focusAnn) revealAnn(S.focusAnn);
  if(S.focusSpot) revealSpot();
  if(S.pendingPage){const r=$(`.prow[data-page="${S.pendingPage}"]`);S.pendingPage=null;if(r) r.scrollIntoView({block:"start"});}
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  for(const {page,row,W} of pages){
    if(token!==pagesToken) return;
    const c=row.querySelector("canvas.pdf"), vp=page.getViewport({scale:(W/page.getViewport({scale:1}).width)*dpr});
    c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
    try{await page.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;}catch{}
    const ld=row.querySelector(".pageload"); if(ld) ld.remove();
    drawInk(+row.dataset.page); buildTextLayer(page,row,W);
    if(S.hitTerms&&S.hitTerms.length) markHits(page,row,W).then(()=>{const n=findHits().length; if(n&&$("#psearch")?.value) setFindCount(`${n} match${n===1?"":"es"}`);});
  }
}
function renderOverlays(){
  const pid=S.view.id; if(!pid||!$("#pages")) return;
  const anns=annsOf(pid);
  const byPage=new Map();
  for(const a of anns){if(!byPage.has(a.page)) byPage.set(a.page,[]);byPage.get(a.page).push(a);}
  const multi=rowsOf(pid).length>1;
  for(const row of $$(".prow")){
    const i=+row.dataset.page, list=byPage.get(i)||[];
    const layer=row.querySelector(".layer");
    const margins=list.filter(a=>a.kind==="margin").sort((a,b)=>a.y-b.y);
    let html="";
    margins.forEach((a,ix)=>{html+=`<button class="tick" data-act="tick" data-id="${a.id}" style="top:${a.y*100}%;${noteVars(a.color,"ochre")}" title="Margin note ${ix+1}">${ix+1}</button>`;});
    for(const a of list.filter(a=>a.kind==="sticky")) html+=`<button class="sticky" data-act="sticky" data-id="${a.id}" style="left:${a.x*100}%;top:${a.y*100}%;${noteVars(a.color,"butter")}" title="${esc((a.text||"Sticky note").split("\n")[0].slice(0,80))}" aria-label="Sticky note"></button>`;
    for(const a of list.filter(a=>a.kind==="sticker")){const st=STK[a.sticker]||STK.star;html+=todoCardHtml(a)+`<button class="stk${a.id===freshSticker?" new":""}${st.wide?" wide":""}" data-act="stickerbtn" data-id="${a.id}" style="left:${a.x*100}%;top:${a.y*100}%;--rot:${a.rot||0}deg" title="${esc(st.name+(a.text?" — "+a.text.split("\n")[0].slice(0,60):""))}" aria-label="${esc(st.name)} sticker">${st.svg}</button>`;}
    for(const a of list.filter(a=>a.kind==="evidence")){
      const r=S.rows.get(a.row); const f=FIELD[a.field];
      html+=`<button class="pin" data-act="pin" data-id="${a.id}" style="left:${a.x*100}%;top:${a.y*100}%" title="${esc((f?f.label:"Value")+(r?" · "+(r.exp||""):""))}">${esc(f?f.short:"?")}${r&&multi?" · "+esc((r.exp||"").replace(/^exp(eriment)?\s*/i,"E")):""}</button>`;
    }
    layer.innerHTML=html;
    reconcileMargin(row,margins);
    drawInk(i);
  }
}
function reconcileMargin(row,margins){
  const box=row.querySelector(".mnotes"); if(!box) return;
  const can=S.canWrite;
  const keep=new Set(margins.map(a=>a.id));
  for(const el of $$(".mnote",box)) if(!keep.has(el.dataset.id)) el.remove();
  margins.forEach((a,ix)=>{
    let el=box.querySelector(`.mnote[data-id="${a.id}"]`);
    if(!el){
      el=document.createElement("div"); el.className="mnote"; el.dataset.id=a.id;
      el.innerHTML=`<span class="mnum"></span><div class="mbody" data-act="editnote" tabindex="0"></div><span class="mtools">${can?`<button class="mcol" data-act="cyclecolor" data-id="${a.id}" title="Change colour" aria-label="Change colour"></button><button class="x" data-act="delann" data-id="${a.id}" aria-label="Delete note">${ICON.x}</button>`:""}</span>`;

function layoutMargin(row){
  if(window.innerWidth<=900) return;

  let bottom=0;

let liveStroke=null;
function drawInk(i){
  const row=$(`.prow[data-page="${i}"]`); if(!row) return;
  const c=row.querySelector("canvas.ink"), d=pageDims[i]; if(!c||!d) return;
  const dpr=Math.min(window.devicePixelRatio||1,2.5);
  if(c.width!==Math.round(d.W*dpr)){c.width=Math.round(d.W*dpr);c.height=Math.round(d.H*dpr);}
  const g=c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,d.W,d.H);
  for(const a of annsOf(S.view.id)) if(a.kind==="texthl"&&a.page===i) fillTextHl(g,a,d);   // text highlights under the ink
  const strokes=annsOf(S.view.id).filter(a=>a.kind==="ink"&&a.page===i);
  if(liveStroke&&liveStroke.page===i) strokes.push(liveStroke);
  for(const s of strokes) strokePath(g,s,d);
}
function strokePath(g,s,d){
  const pts=s.points||[]; if(pts.length<1) return;
  const css=getComputedStyle(document.documentElement);
  g.save();
  if(s.tool==="hl"){g.globalCompositeOperation="multiply";g.strokeStyle=(HL.find(h=>h.k===s.color)||HL[0]).c;g.lineWidth=Math.max(10,d.W*0.017);g.lineCap="butt";}
  else {g.strokeStyle=(PEN.find(h=>h.k===s.color)||PEN[0]).c;g.lineWidth=Math.max(1.4,d.W*0.0022);g.lineCap="round";}
  g.lineJoin="round"; g.beginPath();
  g.moveTo(pts[0][0]*d.W,pts[0][1]*d.H);
  if(pts.length===1) g.lineTo(pts[0][0]*d.W+.1,pts[0][1]*d.H);
  for(let k=1;k<pts.length;k++) g.lineTo(pts[k][0]*d.W,pts[k][1]*d.H);
  g.stroke(); g.restore();
}

function newRow(pid,exp){

function newAnn(data){const id=uid("a");put("anns",id,{...data,paper:S.view.id,createdAt:Date.now()});return id;}
async function importFiles(files,targetPid){
  if(!S.canWrite) return;
  if(!S.repoPrivate){toast("Make the repository private before adding PDFs.",4000);return;}
  const list=[...files].filter(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name));
  if(!list.length){toast("Choose a PDF file.");return;}
  let last=null, k=0, ok=0;
  for(const f of list){
    k++;
    if(f.size>MAX_PDF){toast(`${f.name} is over 50 MB, too large to store through GitHub’s API.`,5000);await sleep(1500);continue;}
    toast(list.length>1?`Committing ${k} of ${list.length} to GitHub: ${f.name}`:`Committing ${f.name} to GitHub…`,120000);
    try{
      const pid=targetPid||uid("p");
      const path=PDF_DIR+pid+"-"+Date.now().toString(36)+".pdf";
      const res=await putFile(path,b64FromBytes(new Uint8Array(await f.arrayBuffer())),`Add PDF: ${f.name}`);
      if(targetPid){
        const p=S.papers.get(targetPid); const old=p.pdf, oldSha=p.pdfSha;
        put("papers",targetPid,{...p,pdf:path,pdfSha:res.content.sha,pdfName:f.name}); last=targetPid;
        if(old&&old!==path){pdfCache.delete(old);deleteFile(old,oldSha,"Remove replaced PDF").catch(()=>{});}
      } else {
        const label=f.name.replace(/\.pdf$/i,"").replace(/[_]+/g," ").trim().slice(0,120)||"Untitled paper";
        put("papers",pid,{label,ref:"",status:"To read",notes:"",pdf:path,pdfSha:res.content.sha,pdfName:f.name,createdAt:Date.now()});
        newRow(pid,"Exp 1"); last=pid;
      }
      ok++;
    }catch(e){toast(`${f.name}: ${e instanceof GhError?ghReason(e):"didn’t upload."}`,5000);await sleep(1500);}
  }
  if(ok) {toast(ok>1?`Added ${ok} PDFs.`:"Added.");saveNow();}
  if(last&&(list.length===1||targetPid)) location.hash="paper-"+last;
  else if(ok&&!openTag()) location.hash=ALL_SLUG;   // several new papers: show them in All literature
  else render();
  if(ok) setTimeout(()=>indexMissing(),800);
}
async function deletePaper(pid){
  const p=S.papers.get(pid); if(!p) return;
  for(const a of annsOf(pid)) await removeDoc("anns",a.id);
  for(const r of rowsOf(pid)) await removeDoc("rows",r.id);
  await removeDoc("papers",pid);
  if(p.pdf){pdfCache.delete(p.pdf);deleteFile(p.pdf,p.pdfSha,`Remove PDF: ${p.pdfName||p.label||""}`).catch(()=>{});}
  if(p.text){TXT.mem.delete(pid);deleteFile(p.text,p.textSha,`Remove text index: ${p.label||""}`).catch(()=>{});}
  saveNow();
  toast(`Deleted ${p.label||"paper"}.`); const h=libHash(null); if(location.hash===h||(h==="#"&&!location.hash)) render(); else location.hash=h;
}
function exportCsv(){
  const head=["Paper","Full reference","Status","Tags",...FIELDS.map(f=>f.label),"Sources (page)"];
  const lines=[head];
  for(const p of papersSorted()) for(const r of rowsOf(p.id)){
    const src=FIELDS.map(f=>{const e=evidenceFor(r.id,f.k);return e?`${f.short} p.${e.page}`:null;}).filter(Boolean).join("; ");
    lines.push([p.label||"",p.ref||"",p.status||"",paperTagIds(p).map(id=>S.tags.get(id).name).join("; "),...FIELDS.map(f=>r[f.k]??""),src]);
  }
  const csv="﻿"+lines.map(l=>l.map(v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download="foveal-bias-summary.csv";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);

  else if(act==="pickcolor"){ S.colors[S.tool]=t.dataset.c; savePrefs(); renderSwatches(); }
  else if(act==="pickstk"){ S.sticker=t.dataset.s; savePrefs(); renderSwatches(); }
  else if(act==="anncolor"){ const a=S.anns.get(t.dataset.id); if(!a) return; put("anns",t.dataset.id,{...a,color:t.dataset.c}); S.colors.sticky=t.dataset.c; savePrefs();
    if(pop){setNoteVars(pop,t.dataset.c,"butter");$$(".sw",pop).forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.c===t.dataset.c)));}
    renderOverlays(); }
  else if(act==="cyclecolor"){ const a=S.anns.get(t.dataset.id); if(!a) return; const i=NOTE.findIndex(n=>n.k===(a.color||"ochre")); const next=NOTE[(i+1)%NOTE.length].k; put("anns",t.dataset.id,{...a,color:next}); S.colors.margin=next; savePrefs(); renderOverlays(); }
  else if(act==="swapstk"){ const a=S.anns.get(t.dataset.id); if(!a) return; put("anns",t.dataset.id,{...a,sticker:t.dataset.s}); renderOverlays(); const el=$(`.stk[data-id="${t.dataset.id}"]`); if(el) stickerPop({id:t.dataset.id,...S.anns.get(t.dataset.id)},el); }
  else if(act==="tick"){ const el=$(`.mnote[data-id="${t.dataset.id}"]`); if(el){el.scrollIntoView({block:"center",behavior:"smooth"});el.classList.add("hot");setTimeout(()=>el.classList.remove("hot"),1600);} }
  else if(act==="delann"){
    if(t.dataset.confirm&&!t.classList.contains("arm")){t.classList.add("arm");t.textContent="Click again to delete";return;}
    closePop(); await removeDoc("anns",t.dataset.id); renderOverlays(); if(S.tab==="notes") renderNotesTab(S.view.id);
  }
  else if(act==="editnote") startEditNote(t.closest(".mnote"));
  else if(act==="showrow"){ S.flashRow=t.dataset.row; S.libMode="table"; closePop(); const r=S.rows.get(t.dataset.row); location.hash=libHash(r&&r.paper); }
  else if(act==="openann"){ S.focusAnn=t.dataset.id; S.tab="pages"; S.tool="read"; render(); setTimeout(()=>{ if(S.focusAnn) revealAnn(S.focusAnn); },250); }
  else if(act==="gopage"){ ev.preventDefault(); gotoPage(+t.dataset.page); }
  else if(act==="pickevidence"){
    let rid=$("#pk-row").value; const k=$("#pk-field").value;
    if(rid==="__new") rid=newRow(S.view.id);
    const old=evidenceFor(rid,k); if(old) await removeDoc("anns",old.id);
    const id=newAnn({kind:"evidence",page:+t.dataset.page,x:+t.dataset.x,y:+t.dataset.y,row:rid,field:k,text:""});
    closePop(); renderOverlays();
    const pinEl=$(`.pin[data-id="${id}"]`); if(pinEl) pinPop({id,...S.anns.get(id)},pinEl);
  }
  else if(act==="delpaper"){
    if(!t.classList.contains("arm")){t.classList.add("arm");t.textContent=t.classList.contains("pdel")?"Delete for good?":"Click again to delete for good";return;}
    deletePaper(t.dataset.paper);
  }
});
document.addEventListener("click",ev=>{
  const tb=ev.target.closest(".tabs button"); if(tb){S.tab=tb.dataset.tab;closePop();render();return;}
  const tool=ev.target.closest(".tool"); if(tool&&!tool.disabled){S.tool=tool.dataset.tool;if(S.tool!=="evidence") S.pendingEvidence=null;closePop();render();}
});
document.addEventListener("keydown",ev=>{
  if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==="s"){ev.preventDefault();saveNow();return;}
  if(ev.key==="Enter"&&ev.target.matches("[data-act='openann'],[data-act='gopage'],.mbody")){ev.target.click();return;}
  if(ev.key==="Escape"){ if(pop){closePop();return;} if(S.pickSpot&&S.view.name==="paper"){ const n=S.pickSpot.nid; S.pickSpot=null; location.hash="note-"+n; return; } if(S.pendingEvidence){S.pendingEvidence=null;S.tool="read";render();return;} if(document.activeElement?.matches("textarea")) document.activeElement.blur(); return; }
  if(!(S.view.name==="paper"&&S.tab==="pages")&&S.view.name!=="note") return;
  if(ev.target.matches("input,textarea,select")||ev.target.isContentEditable||ev.metaKey||ev.ctrlKey||ev.altKey) return;   // typing in a note never switches tools
  const t=(S.view.name==="note"?NOTE_TOOLS():TOOLS).find(t=>t.key===ev.key.toLowerCase());
  if(t&&(t.k==="read"||S.canWrite)){S.tool=t.k;if(t.k!=="evidence") S.pendingEvidence=null;closePop();render();}
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="filter"){S.filter=el.value;if(S.filter.trim().length<2) S.hitTerms=null;renderLibrary();return;}
  if(el.dataset.row&&el.dataset.k){
    const r=S.rows.get(el.dataset.row); if(!r) return;
    put("rows",el.dataset.row,{...r,[el.dataset.k]:el.value});
    if(el.tagName==="SELECT"){ el.dataset.v=el.value; const oc=optColor(FIELD[el.dataset.k],el.value);
      if(oc){el.style.setProperty("--oc",oc);el.setAttribute("data-oc","");} else {el.style.removeProperty("--oc");el.removeAttribute("data-oc");} }
    return;
  }
  if(el.dataset.pk&&el.dataset.paper){
    const p=S.papers.get(el.dataset.paper); if(!p) return;
    put("papers",el.dataset.paper,{...p,[el.dataset.pk]:el.value});
    if(el.id==="pnotes") $("#pnotesprev").innerHTML=richText(el.value);
    if(el.tagName==="SELECT") el.dataset.v=el.value;
    return;
  }
  if(el.dataset.ann){
    const a=S.anns.get(el.dataset.ann); if(!a) return;
    put("anns",el.dataset.ann,{...a,text:el.value});
    const prev=document.querySelector(`[data-prev="${el.dataset.ann}"]`); if(prev) prev.innerHTML=richText(el.value);
    if(el.closest(".mnote")){autoGrow(el);layoutMargin(el.closest(".prow"));}
    const st=$(`.sticky[data-id="${el.dataset.ann}"]`); if(st) st.title=(el.value||"Sticky note").split("\n")[0].slice(0,80);
  }
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="sort"){S.sort=el.value;renderLibrary();return;}
  if(el.id==="filepick"){importFiles(el.files);el.value="";return;}
  if(el.id==="attachpick"){importFiles(el.files,el.dataset.target);el.value="";return;}
  if(el.tagName==="SELECT"&&(el.dataset.row||el.dataset.pk)){
    const cur=el.dataset.row?S.rows.get(el.dataset.row)?.[el.dataset.k]:S.papers.get(el.dataset.paper)?.[el.dataset.pk];
    if(cur!==el.value) el.dispatchEvent(new Event("input",{bubbles:true}));
  }
});
function autoGrow(ta){ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";}
function startEditNote(note){
  if(!note||!S.canWrite) return;
  const id=note.dataset.id, a=S.anns.get(id); if(!a) return;
  const body=note.querySelector(".mbody"); if(!body) return;
  const ta=document.createElement("textarea"); ta.dataset.ann=id; ta.dataset.fkey="ann:"+id; ta.value=a.text||"";
  ta.placeholder="Write a note. [[Label]] links a paper; p. 4 links a page.";
  body.replaceWith(ta); autoGrow(ta); ta.focus(); layoutMargin(note.closest(".prow"));
  ta.addEventListener("blur",()=>{
    const cur=S.anns.get(id);
    if(cur&&!(cur.text||"").trim()){ removeDoc("anns",id).then(renderOverlays); return; }
    const nb=document.createElement("div"); nb.className="mbody"; nb.dataset.act="editnote"; nb.tabIndex=0; nb.innerHTML=richText(cur?.text);
    if(ta.isConnected) ta.replaceWith(nb);
    const row=nb.closest(".prow"); if(row) layoutMargin(row);
  },{once:true});
}
function pagePoint(page,ev){const r=page.getBoundingClientRect();return [clamp((ev.clientX-r.left)/r.width,0,1),clamp((ev.clientY-r.top)/r.height,0,1)];}
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));}
document.addEventListener("pointerdown",ev=>{
  const page=ev.target.closest(".page"); if(!page||(S.view.name!=="paper"&&S.view.name!=="note")) return;
  if(S.pickSpot&&S.view.name==="paper"){   // the spot a note's pin will point to
    ev.preventDefault(); const [x,y]=pagePoint(page,ev);
    S.pendingPin={nid:S.pickSpot.nid,c:S.pickSpot.c,paper:S.view.id,page:+page.dataset.page,x,y}; S.pickSpot=null;
    location.hash="note-"+S.pendingPin.nid; return;
  }
  if(ev.target.closest("[data-act]")) return;
  if(!S.canWrite||S.tool==="read") return;
  if(S.tool==="hl"&&ev.target.closest(".textLayer span")) return;   // on words: select them (highlighted on release)
  ev.preventDefault();  // keep focus where the new note puts it (stops the mousedown that would blur it)
  const i=+page.dataset.page, [x,y]=pagePoint(page,ev);
  if(S.tool==="pen"||S.tool==="hl"){
    ev.preventDefault(); page.setPointerCapture(ev.pointerId);
    liveStroke={kind:"ink",tool:S.tool,color:S.colors[S.tool],page:i,points:[[x,y]]}; drawInk(i); return;
  }
  if(S.tool==="erase"){
    const th=textHlAt(i,x,y); if(th){ removeDoc("anns",th.id).then(()=>drawInk(i)); return; }
    const d=pageDims[i]; let best=null,bd=Infinity;
    for(const a of annsOf(S.view.id).filter(a=>a.kind==="ink"&&a.page===i)){
      const tol=a.tool==="hl"?Math.max(10,d.W*0.017)/2+4:8;
      const pts=a.points||[];
      for(let k=0;k<pts.length;k++){
        const p0=pts[Math.max(0,k-1)],p1=pts[k];
        const dist=segDist(x*d.W,y*d.H,p0[0]*d.W,p0[1]*d.H,p1[0]*d.W,p1[1]*d.H);
        if(dist<tol&&dist<bd){bd=dist;best=a.id;}
      }
    }
    if(best){removeDoc("anns",best).then(()=>drawInk(i));} else toast("Click directly on a stroke or highlight to erase it.",1800);
    return;
  }
  if(S.tool==="margin"){
    const id=newAnn({kind:"margin",page:i,x,y,text:"",color:S.colors.margin}); renderOverlays();
    const note=$(`.mnote[data-id="${id}"]`); if(note){startEditNote(note);if(window.innerWidth<=900) note.scrollIntoView({block:"center"});}
    return;
  }
  if(S.tool==="sticky"){
    const id=newAnn({kind:"sticky",page:i,x,y,text:"",color:S.colors.sticky}); renderOverlays();
    const el=$(`.sticky[data-id="${id}"]`); if(el) stickyPop({id,...S.anns.get(id)},el);
    return;
  }
  if(S.tool==="sticker"){
    const id=newAnn({kind:"sticker",sticker:S.sticker,page:i,x,y,rot:Math.round((Math.random()*24-12)*10)/10,text:"",...(S.sticker==="todo"?{todos:[]}:{})});
    freshSticker=id; renderOverlays(); setTimeout(()=>{freshSticker=null;},600);
    if(S.sticker==="todo"){ const el=$(`.stk[data-id="${id}"]`); if(el) todoPop(id,el,true); }   // a TODO sticker comes with a checklist
    return;
  }
  if(S.tool==="evidence"){
    if(S.pendingEvidence){
      const {row,field}=S.pendingEvidence; const old=evidenceFor(row,field);
      if(old) removeDoc("anns",old.id);
      const id=newAnn({kind:"evidence",page:i,x,y,row,field,text:""});
      S.pendingEvidence=null; S.tool="read"; render();
      const r=S.rows.get(row); toast(`Linked ${FIELD[field].label}${r?" for "+(r.exp||""):""} to p. ${i}.`);
      const pinEl=$(`.pin[data-id="${id}"]`); if(pinEl) pinPop({id,...S.anns.get(id)},pinEl);
      return;
    }
    const marker=document.createElement("span"); marker.style.cssText=`position:absolute;left:${x*100}%;top:${y*100}%;width:1px;height:1px`;
    page.querySelector(".layer").appendChild(marker);
    evidencePickerPop(marker,i,x.toFixed(4),y.toFixed(4)); setTimeout(()=>marker.remove(),50);
  }
});
document.addEventListener("pointermove",ev=>{
  if(!liveStroke) return;
  const page=$(`.page[data-page="${liveStroke.page}"]`); if(!page) return;
  const [x,y]=pagePoint(page,ev); const last=liveStroke.points[liveStroke.points.length-1];
  const d=pageDims[liveStroke.page];
  if(Math.hypot((x-last[0])*d.W,(y-last[1])*d.H)<2) return;
  liveStroke.points.push(liveStroke.tool==="hl"?[x,liveStroke.points[0][1]+(y-liveStroke.points[0][1])*0.15]:[x,y]);
  drawInk(liveStroke.page);
});
function endStroke(){
  if(!liveStroke) return;
  const s=liveStroke; liveStroke=null;
  s.points=s.points.map(p=>[+p[0].toFixed(4),+p[1].toFixed(4)]).slice(0,4000);
  newAnn({kind:"ink",tool:s.tool,color:s.color,page:s.page,points:s.points,x:s.points[0][0],y:s.points[0][1]});
  drawInk(s.page);
}
/* drag stickers, stickies and source pins to move them */
let drag=null;
document.addEventListener("pointerdown",ev=>{
  const h=ev.target.closest(".stk,.sticky,.pin"); if(!h||!S.canWrite||(S.view.name!=="paper"&&S.view.name!=="note")) return;
  drag={el:h,id:h.dataset.id,page:h.closest(".page"),sx:ev.clientX,sy:ev.clientY,moved:false,pid:ev.pointerId};
},true);
document.addEventListener("pointermove",ev=>{
  if(!drag||ev.pointerId!==drag.pid) return;
  if(!drag.moved){ if(Math.hypot(ev.clientX-drag.sx,ev.clientY-drag.sy)<5) return; drag.moved=true; drag.el.classList.add("dragging"); try{drag.el.setPointerCapture(ev.pointerId);}catch{} closePop(); }
  ev.preventDefault();
  const [x,y]=pagePoint(drag.page,ev); drag.x=x; drag.y=y;
  drag.el.style.left=(x*100)+"%"; drag.el.style.top=(y*100)+"%";
  const card=drag.page.querySelector(`.todocard[data-for="${drag.id}"]`); if(card){card.style.left=(x*100)+"%"; card.style.top=(y*100)+"%";}
});
function endDrag(ev){
  if(!drag) return;
  const d=drag; drag=null;
  if(!d.moved) return;
  d.el.classList.remove("dragging"); S.suppressClick=true; setTimeout(()=>{S.suppressClick=false;},400);
  const a=S.anns.get(d.id); if(a&&d.x!=null){ put("anns",d.id,{...a,x:+d.x.toFixed(4),y:+d.y.toFixed(4)}); if(isTodo(a)) renderOverlays(); }
}
document.addEventListener("pointerup",endDrag,true);
document.addEventListener("pointercancel",endDrag,true);
document.addEventListener("pointerup",endStroke);
document.addEventListener("pointercancel",endStroke);
window.addEventListener("beforeunload",ev=>{ if(S.connected&&S.rev>S.savedRev){ saveNow(); ev.preventDefault(); ev.returnValue=""; } });

/* ---------------- routing ---------------- */
function route(){
  if(!S.connected){render();return;}
  const h=location.hash.replace(/^#/,"");
  const m=h.match(/^paper-([A-Za-z0-9]+)$/), nm=h.match(/^note-([A-Za-z0-9]+)$/);
  closePop();
  if(S.pickSpot&&!(m&&m[1]===S.pickSpot.pid)) S.pickSpot=null;   // left the paper without choosing a spot
  if(nm){ if(S.view.name!=="note"||S.view.id!==nm[1]){ S.view={name:"note",id:nm[1]}; shellFor=null; render(); window.scrollTo(0,0); } else render(); return; }
  if(m){ if(S.view.name!=="paper"||S.view.id!==m[1]){S.view={name:"paper",id:m[1]};shellFor=null;if(!S.focusAnn&&!S.pendingEvidence&&!S.keepTab) S.tab="pages"; S.keepTab=false;} }
  else { const tag=h?tagFromSlug(decodeURIComponent(h)):null, was=S.view.name==="library"?S.view.tag:undefined;
    S.view={name:"library",tag}; shellFor=null; S.pendingEvidence=null; S.tool="read";
    if(tag) S.tag=tag;
    if(tag!==S.lastLibTag){S.filter=""; S.search=null; S.hitTerms=null; if(tag!==NOTES_TAG) S.noteFilter="";}   // a search survives a visit to a paper
    S.lastLibTag=tag;
    if(!tag&&location.href.includes("#")) history.replaceState(null,"",location.pathname+location.search); }   // the front page has a plain address
  render();
  if(!m){ if(S.view.tag){ const sm=!!S.smoothIn; requestAnimationFrame(()=>scrollToMain(sm)); } else window.scrollTo(0,0); S.smoothIn=false; }
}
window.addEventListener("hashchange",route);
let rz=null;
window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{
  if(S.view.name==="paper"&&S.tab==="pages"){const el=$("#pages");if(el&&Math.abs(el.clientWidth-lastPagesWidth)>40){el.dataset.pdf="";render();} else $$(".prow").forEach(layoutMargin);}
},250);});

/* ---------------- boot ---------------- */
(async function boot(){
  const cfg=lsGet(LS_CFG);
  if(!cfg||!cfg.token){S.view={name:"setup"};render();return;}
  $("#main").innerHTML=`<div class="wrap loading">Loading your library from GitHub…</div>`;
  try{await connect(cfg);S.view={name:"library"};route();}
  catch(e){
    S.cfg=cfg; S.setupErr=e instanceof GhError?ghReason(e):"Couldn’t load the library.";
    const cache=lsGet(LS_CACHE(cfg));
    if(cache&&cache.data&&e instanceof GhError&&e.status===0){
      applyData(cache.data); S.connected=true; S.canWrite=false; S.repoPrivate=true; S.view={name:"library"}; route();
      toast("Offline: showing this browser’s last copy, read only. Reload when you’re back online.",6000);
    } else {S.view={name:"setup"};$("#main").innerHTML="";render();}
  }
})();

</script>
